<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>strata-jbench configurator</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1c1e21;--mute:#666b73;--line:#dcdfe3;--acc:#0a8f6c;--acc2:#e6f5f0;--warn:#b45309;--bad:#b42318;--chip:#eef0f2;
 --c0:#0a8f6c;--c1:#2f6fde;--c2:#c2410c;--c3:#7c3aed;--c4:#0e7490;--c5:#be185d;--c6:#4d7c0f;--c7:#a16207;--c8:#475569;--c9:#b91c1c;--c10:#1d4ed8;--launch:#9aa1ab}
:root[data-theme="dark"]{--bg:#15171a;--card:#1e2126;--ink:#e8eaed;--mute:#9aa1ab;--line:#33383f;--acc:#3fcfa6;--acc2:#16332c;--warn:#f0b35a;--bad:#f28b82;--chip:#2a2e35;--launch:#5b626c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--card:#1e2126;--ink:#e8eaed;--mute:#9aa1ab;--line:#33383f;--acc:#3fcfa6;--acc2:#16332c;--warn:#f0b35a;--bad:#f28b82;--chip:#2a2e35;--launch:#5b626c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Noto Sans SC",sans-serif}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card)}
header h1{font-size:18px;margin:0;flex:1 1 auto}
header .sub{color:var(--mute);font-size:13px;flex:1 1 100%}
button,select{font:inherit;color:inherit}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 10px;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;padding:16px;max-width:1280px;margin:0 auto}
@media (max-width:980px){main{grid-template-columns:minmax(0,1fr)}aside{position:static!important;max-height:none!important}}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
section>h2{font-size:15px;margin:0 0 4px;display:flex;gap:8px;align-items:baseline}
section>h2 .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font-size:12px;flex:none}
.lead{color:var(--mute);font-size:13px;margin:0 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--card);color:inherit;font:inherit;text-align:left;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:2px;width:100%}
.card.on{border-color:var(--acc);background:var(--acc2);box-shadow:inset 0 0 0 1px var(--acc)}
.card.off{opacity:.5;cursor:not-allowed}
.card b{display:block}
.card .q{font-size:13px;margin:2px 0}
.card small,.small{color:var(--mute);font-size:12.5px}
.tag{display:inline-block;background:var(--chip);border-radius:999px;padding:0 8px;font-size:12px;margin:2px 4px 0 0;white-space:nowrap}
.tag.w{color:var(--warn)}.tag.g{color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 12px;cursor:pointer}
.btn.on{border-color:var(--acc);background:var(--acc);color:#fff}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.models td:first-child{width:26px}
.models tr.base td{background:var(--chip);font-weight:600}
.models tr.dis{opacity:.45}
label{cursor:pointer}
details{margin-top:6px}details summary{cursor:pointer;color:var(--mute);font-size:12.5px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--chip);border-radius:8px;padding:8px 10px;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;margin:6px 0;max-height:260px;overflow:auto}
aside{position:sticky;top:12px;align-self:start;max-height:calc(100vh - 24px);overflow:auto}
.big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{display:flex;height:18px;border-radius:6px;overflow:hidden;background:var(--chip);margin:6px 0}
.bar i{display:block;height:100%}
.legend div{display:flex;gap:6px;align-items:center;font-size:12.5px}
.legend span.sw{width:10px;height:10px;border-radius:2px;flex:none}
.legend span.v{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--mute)}
.matrix{overflow:auto}
.matrix td.c{text-align:center;width:26px;padding:2px}
.matrix td.c i{display:inline-block;width:14px;height:14px;border-radius:3px;background:var(--chip)}
.matrix td.c i.on{background:var(--acc)}
.matrix th.v{writing-mode:vertical-rl;font-weight:500;font-size:12px;padding:4px 2px;white-space:nowrap}
.hl{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.hl .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:var(--chip)}
.hl.on .dot{background:var(--acc)}
.hl code{font-weight:700}
.note{font-size:12.5px;color:var(--warn);margin:6px 0}
.empty{color:var(--mute);font-size:13px;padding:8px 0}
</style>
</head>
<body>
<header>
  <h1>strata-jbench <span id="t-title"></span></h1>
  <div class="seg" id="lang"></div>
  <div class="seg" id="theme"></div>
  <div class="sub" id="t-sub"></div>
</header>
<main>
<div>
  <section><h2><span class="n">1</span><span id="h-env"></span></h2><p class="lead" id="l-env"></p>
    <select id="env" class="btn"></select><div class="small" id="env-info"></div></section>
  <section><h2><span class="n">2</span><span id="h-engine"></span></h2><p class="lead" id="l-engine"></p>
    <div class="cards" id="engines"></div><div class="row" id="tracks"></div><div class="small" id="track-info"></div></section>
  <section><h2><span class="n">3</span><span id="h-driver"></span></h2><p class="lead" id="l-driver"></p>
    <div class="cards" id="drivers"></div></section>
  <section><h2><span class="n">4</span><span id="h-models"></span></h2><p class="lead" id="l-models"></p>
    <div class="row" id="model-buttons"></div><div id="models"></div></section>
  <section><h2><span class="n">5</span><span id="h-tasks"></span></h2><p class="lead" id="l-tasks"></p>
    <div class="row" id="presets"></div><div class="cards" id="tasks"></div></section>
</div>
<aside>
  <section><h2 id="h-time"></h2><div class="big" id="total"></div><div class="small" id="total-sub"></div>
    <div class="bar" id="bar"></div><div class="legend" id="legend"></div><div class="small" id="est-note"></div></section>
  <section><h2 id="h-head"></h2><div id="headlines"></div></section>
  <section><h2 id="h-cover"></h2><div class="matrix" id="matrix"></div></section>
  <section><h2 id="h-recipe"></h2><p class="lead" id="l-recipe"></p><pre id="recipe"></pre>
    <div class="row"><button class="btn pri" id="copy"></button><button class="btn" id="copy2"></button><span class="small" id="copied"></span></div>
    <div class="small" id="recipe-note"></div></section>
</aside>
</main>

a":"答えを自動で判定できる 4 問（数学、コード（テストを実行して判定）、日本語の推論、英語の推論）を、thinking off と on（xhigh）で。出力は 16,384 token まで、temperature 1.0、各 3 回。thinking のないモデルは off だけ","en":"Four tasks whose answers are checked automatically (math, code judged by running its tests, reasoning in Japanese, reasoning in English), with thinking off and on (xhigh), up to 16,384 output tokens, temperature 1.0, 3 times each. A model without thinking: off only","zh":"4 道可自动判定答案的题（数学、代码（运行测试判定）、日语推理、英语推理），分别在 thinking off 与 on（xhigh）下，输出最多 16,384 token，temperature 1.0，各 3 次。没有 thinking 的模型只测 off"},"metrics":["reasoning_tokens","first_answer_s","total_s","correct","capped"],"headline":"JB-answer","models":"all"},{"id":"code-oneshot","version":1,"match":{"step":["3"],"fixture_prefix":["coding-"]},"label":{"ja":"1 回の依頼でページを書く","en":"A page from one request","zh":"一次请求生成页面"},"question":{"ja":"1 回の依頼で、動くページを書けるか？","en":"Can it write a working page from one request?","zh":"一次请求能写出可运行的页面吗？"},"sends":{"ja":"「港に寄港する帆船」の情景を 3D ボクセルアートの単一 HTML ファイルで、という英文の依頼。思考 64K、出力はコンテキスト 128K の枠いっぱい、temperature 1.0、3 回。ページは headless Chrome で 10 秒動かして、エラー・固まったか・描画されたかを記録","en":"An English request for the scene \"A sailing ship calling at a harbor\" as 3D voxel art in one HTML file. Thinking 64K, output up to the whole 128K window, temperature 1.0, 3 times. Each page runs 10 s in headless Chrome; its errors, whether it froze and whether anything was drawn are recorded","zh":"用英文请求把“停靠港口的帆船”场景做成单个 HTML 文件的 3D 体素艺术。思考 64K，输出用满 128K 窗口，temperature 1.0，3 次。页面在 headless Chrome 中运行 10 秒，记录报错、是否卡死、是否有绘制"},"metrics":["total_s","completion_tokens","capped","page_drawn","page_errors"],"headline":"JB-page","models":"all"},{"id":"context-reserve","version":1,"match":{"step":["4a"]},"label":{"ja":"コンテキストの確保コスト","en":"The cost of reserving context","zh":"预留上下文的代价"},"question":{"ja":"コンテキストを広く確保するだけで遅くなるか？","en":"Does reserving a larger context alone make it slower?","zh":"仅仅预留更大的上下文就会变慢吗？"},"sends":{"ja":"コンテキストを 128K / 256K / 1M にして起動し、同じ 4K 入力 + 512 出力を 3 回。1M で起動できるかもここで分かる","en":"Launched with a 128K / 256K / 1M context, the same 4K input + 512 output 3 times. Whether it starts at 1M at all shows here too","zh":"分别以 128K / 256K / 1M 上下文启动，相同的 4K 输入 + 512 输出各 3 次。能否以 1M 启动也在此体现"},"metrics":["decode_tps","prefill_tps","launch_ok","vram_peak","rss_peak"],"headline":null,"models":"all"},{"id":"long-read","version":1,"match":{"step":["4b","4c"]},"label":{"ja":"長文の読解","en":"Reading long documents","zh":"长文阅读"},"question":{"ja":"長い文書を実際に読ませると、速さと正答はどうなる？（〜1M token）","en":"Given a really long document, how fast is it and does it answer right? (up to 1M tokens)","zh":"真正读入长文档时，速度与正确率如何？（至 1M token）"},"sends":{"ja":"青空文庫と Project Gutenberg の日英 10 作品から作った文書を 32K / 128K / 256K（学習範囲）と 512K / 1M（拡張範囲）で。10% / 50% / 90% の位置に埋めた事実を 1 つずつ問い、最後に複数箇所を組み合わせる問い。各 3 回。対象は代表のモデル","en":"A document made of ten works from Aozora Bunko and Project Gutenberg (Japanese and English) at 32K / 128K / 256K (trained range) and 512K / 1M (extended). One question per fact planted at 10% / 50% / 90%, then one that needs several places. 3 times each. Representative models only","zh":"由青空文库与 Project Gutenberg 的 10 部日英作品拼成的文档，长度 32K / 128K / 256K（训练范围）与 512K / 1M（扩展范围）。对埋在 10% / 50% / 90% 位置的事实各问一题，最后一题需要综合多处。各 3 次。仅代表模型"},"metrics":["prefill_tps","ttft_s","decode_tps","correct","rss_peak","vram_peak"],"headline":null,"models":"representatives"},{"id":"yarn-check","version":1,"match":{"step":["4d"]},"label":{"ja":"YaRN の影響","en":"The effect of YaRN","zh":"YaRN 的影响"},"question":{"ja":"学習長を超える設定（YaRN）は、同じ入力の結果を変えるか？","en":"Does the setting for going past the trained length (YaRN) change the result on the same input?","zh":"超出训练长度的设置（YaRN）会改变相同输入的结果吗？"},"sends":{"ja":"約 300K の入力を容量 384K（YaRN あり / なし）で、約 200K の入力を容量 256K と 1M で。基準モデルのみ","en":"About 300K of input at a 384K context with and without YaRN, and about 200K at 256K and at 1M. The reference model only","zh":"约 300K 输入在 384K 容量下（有 / 无 YaRN），约 200K 输入在 256K 与 1M 容量下。仅基准模型"},"metrics":["correct","prefill_tps","decode_tps"],"headline":null,"models":"reference"},{"id":"launch-options","version":1,"match":{"step":["5"]},"label":{"ja":"起動オプションの効き方","en":"What launch options do","zh":"启动选项的效果"},"question":{"ja":"起動オプションはどれが効く？","en":"Which launch options matter?","zh":"哪些启动选项有效？"},"sends":{"ja":"基準の起動から 1 回に 1 つだけ変えて（drafter、draft の深さ、KV 形式、prefill chunk、VRAM の配分、vision、CPU の割り当て、PLE の置き場所、並列、自動 tune）、書く速さ 2 種と読む速さ 2 種を 3 回ずつ。対象は代表のモデル","en":"One change at a time from the baseline launch (drafter, draft depth, KV format, prefill chunk, VRAM reserve, vision, CPU assignment, where the PLE table lives, parallel slots, auto tune), two writing and two reading cases 3 times each. Representative models only","zh":"每次只改基准启动的一项（drafter、draft 深度、KV 格式、prefill chunk、VRAM 分配、vision、CPU 分配、PLE 表位置、并行、自动 tune），2 种生成与 2 种读取用例各 3 次。仅代表模型"},"metrics":["decode_tps","accept_rate","prefill_tps","ttft_s"],"headline":null,"models":"representatives","engines":["strata"]},{"id":"selfcheck","version":1,"match":{"step":["0"]},"label":{"ja":"計測の点検","en":"Checking the instruments","zh":"测量自检"},"question":{"ja":"計測そのものは正しいか、起動しなおすとどれだけばらつくか？","en":"Are the measurements right, and how much do they vary between launches?","zh":"测量本身是否正确，重新启动之间波动多大？"},"sends":{"ja":"基準モデルで「書く速さ」「読む速さ」を、起動しなおしながら 3 回。Gyro-S を作者の公開条件で測って公開値と比べる。コーディングを 1 回流して成果物の取り出しを確かめる。環境ごとに 1 度","en":"Writing and reading speed on the reference model over 3 separate launches; Gyro-S under its author's published protocol against the published figures; the coding task once, to check that the page is extracted. Once per environment","zh":"在基准模型上分 3 次启动测量“生成速度”“读取速度”；按作者公开的条件测 Gyro-S 并与公开数值比较；跑一次编程任务以确认成果提取。每个环境一次"},"metrics":["decode_tps","prefill_tps","launch_spread"],"headline":null,"models":"reference"},{"id":"agent-oneshot","version":1,"match":{"step":["G"]},"label":{"ja":"エージェントに任せる","en":"Handing it to an agent","zh":"交给智能体"},"question":{"ja":"エージェントのハーネスに 1 回で任せると、どれだけかかり、何ができるか？","en":"Handed to an agent harness in one shot, how long does it take and what comes out?","zh":"一次性交给智能体 harness，需要多久、能做出什么？"},"sends":{"ja":"「マイクラ風3D箱庭ゲーム作って」を、形式の指示なしでハーネスに one shot で渡す。思考 32K、出力は窓いっぱい、1 回 3,600 秒まで、3 回。sampling・thinking・seed・出力上限は記録プロキシが全ハーネスで同じ値にそろえる","en":"\"Make a Minecraft-like 3D sandbox game\" (in Japanese), handed to the harness in one shot with no format instructions. Thinking 32K, output up to the whole window, 3,600 s per run, 3 times. A recording proxy sets sampling, thinking, seed and the output cap alike for every harness","zh":"把“做一个类似 Minecraft 的 3D 沙盒游戏”（日语）不加格式说明、一次性交给 harness。思考 32K，输出用满窗口，每次最多 3,600 秒，3 次。记录代理把 sampling、thinking、seed 与输出上限对所有 harness 统一"},"metrics":["total_s","turns","tool_calls","preamble_tokens","cache_reuse","page_drawn"],"headline":"JB-agent","models":"reference","drivers":"harness"}],"presets":[{"id":"quick","label":{"ja":"クイック","en":"Quick","zh":"快速"},"about":{"ja":"見出しの数字を 2 つだけ（書く速さ、32K を読んで最初の 1 文字まで）。数分","en":"The two headline numbers only (writing speed, time to the first character after reading 32K). Minutes","zh":"只测两个头条数字（生成速度、读入 32K 后到第一个字符的时间）。数分钟"},"tasks":[{"task":"speed-decode","headline_only":true},{"task":"speed-prefill","headline_only":true}]},{"id":"standard","label":{"ja":"スタンダード","en":"Standard","zh":"标准"},"about":{"ja":"速さ（書く・読む）、考えて答える、ページを書く。見出しの数字が 4 つ揃う","en":"Speed (writing, reading), thinking and answering, writing a page: all four headline numbers","zh":"速度（生成、读取）、思考后作答、生成页面：四个头条数字齐全"},"tasks":[{"task":"speed-decode"},{"task":"speed-prefill"},{"task":"think-qa"},{"task":"code-oneshot"}]},{"id":"full","label":{"ja":"フル","en":"Full","zh":"完整"},"about":{"ja":"すべての種目","en":"Every task","zh":"全部项目"},"tasks":[{"task":"speed-decode"},{"task":"speed-prefill"},{"task":"official-standard"},{"task":"think-qa"},{"task":"code-oneshot"},{"task":"context-reserve"},{"task":"long-read"},{"task":"yarn-check"},{"task":"launch-options"},{"task":"selfcheck"}]}],"metrics":[{"id":"decode_tps","unit":"tok/s","better":"higher","source":"engine","label":{"ja":"decode の速さ","en":"decode speed","zh":"decode 速度"},"definition":{"ja":"エンジンが応答に載せる timings.predicted_per_second（出力 token ÷ 生成にかかった時間）。待ち時間全体で割った値ではない","en":"The engine's timings.predicted_per_second in the response (output tokens ÷ the time spent generating), not divided by the whole wait","zh":"引擎在响应中给出的 timings.predicted_per_second（输出 token ÷ 生成耗时），不是除以整个等待时间"}},{"id":"decode_wall_tps","unit":"tok/s","better":"higher","source":"client","label":{"ja":"decode の速さ（クライアント計測）","en":"decode speed (client-side)","zh":"decode 速度（客户端测量）"},"definition":{"ja":"出力 token 数 ÷（最初の token が届いてから最後の token が届くまでの時間）。timings を返さないエンジンでも測れる","en":"Output tokens ÷ the time from the first token arriving to the last. Measurable on an engine that returns no timings","zh":"输出 token 数 ÷（第一个 token 到达至最后一个 token 到达的时间）。不返回 timings 的引擎也能测"}},{"id":"prefill_tps","unit":"tok/s","better":"higher","source":"engine","label":{"ja":"prefill の速さ","en":"prefill speed","zh":"prefill 速度"},"definition":{"ja":"エンジンの timings.prompt_n ÷ prompt_ms。cache から再利用した token は含めない","en":"The engine's timings.prompt_n ÷ prompt_ms; tokens reused from the cache are not counted","zh":"引擎的 timings.prompt_n ÷ prompt_ms；不含从缓存复用的 token"}},{"id":"ttft_s","unit":"s","better":"lower","source":"client","label":{"ja":"最初の 1 文字まで","en":"time to first token","zh":"首 token 时间"},"definition":{"ja":"リクエストを送る直前から、最初の空でない思考または回答の断片が届くまで","en":"From just before the request is sent to the first non-empty piece of thinking or answer","zh":"从发送请求前一刻到收到第一个非空的思考或回答片段"}},{"id":"first_answer_s","unit":"s","better":"lower","source":"client","label":{"ja":"回答が始まるまで","en":"time to the answer","zh":"到回答开始的时间"},"definition":{"ja":"リクエストを送る直前から、回答（思考ではない本文）の最初の断片が届くまで","en":"From just before the request is sent to the first piece of the answer itself (not thinking)","zh":"从发送请求前一刻到收到回答正文（非思考）的第一个片段"}},{"id":"total_s","unit":"s","better":"lower","source":"client","label":{"ja":"完了まで","en":"time to the end","zh":"完成时间"},"definition":{"ja function pyJson(v) {

function sha256(str) {

  for (let i = 7; i >= 0; i--) bytes.push(i > 3 ? 0 : (bits >>> (i * 8)) & 255);

    const w = [];
    for (let i = 0; i < 64; i++) w[i] = i < 16 ? (bytes[o + 4 * i] << 24 | bytes[o + 4 * i + 1] << 16 | bytes[o + 4 * i + 2] << 8 | bytes[o + 4 * i + 3]) >>> 0

    }
    [a, b, c, d, e, f, g, h].forEach((v, i) => { H[i] = (H[i] + v) >>> 0; });

}

// start: the language of the browser, this PC's environment (or #env=<id>), the reference-sized default selection
const nav = (navigator.language || 'ja').slice(0, 2); S.lang = LANGS.includes(nav) ? nav : 'en';
const q = new URLSearchParams(location.hash.slice(1));
if (q.get('lang') && LANGS.includes(q.get('lang'))) S.lang = q.get('lang');
S.env = Math.max(0, D.envs.findIndex(e => q.get('env') ? e.id === q.get('env') : e.local));
if (q.get('engine') && D.engines.some(e => e.id === q.get('engine'))) S.engine = q.get('engine');
const pickRef = () => { const here = modelsHere(); S.models = new Set(env().ref && here.has(env().ref) ? [env().ref] : [...here].slice(0, 1)); };
pickRef();
setPreset('standard');
draw();
</script>
