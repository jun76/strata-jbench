<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>マイクラ風3D箱庭</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
    }

    canvas {
      display: block;
    }

    #ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(2px);
      pointer-events: auto;
      z-index: 20;
    }

    .panel {
      background: rgba(20, 20, 25, 0.85);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      padding: 24px 28px;
      max-width: 560px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,0.45);
    }

    .panel h1 {
      font-size: 28px;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .panel p {
      line-height: 1.7;
      color: #e8e8e8;
      font-size: 14px;
    }

    .key {
      display: inline-block;
      background: #303038;
      border: 1px solid #555;
      border-radius: 8px;
      padding: 4px 8px;
      margin: 2px;
      min-width: 26px;
      font-weight: bold;
    }

    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 24px;
      height: 24px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0.85;
      z-index: 12;
    }

    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: #fff;
      box-shadow: 0 0 4px rgba(0,0,0,0.8);
    }

    #crosshair::before {
      width: 2px;
      height: 22px;
      left: 11px;
      top: 1px;
    }

    #crosshair::after {
      width: 22px;
      height: 2px;
      left: 1px;
      top: 11px;
    }

    #hotbar {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      pointer-events: none;
      z-index: 11;
    }

    .slot {
      width: 54px;
      height: 54px;
      border-radius: 10px;
      border: 2px solid rgba(255,255,255,0.22);
      background: rgba(20, 20, 25, 0.78);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-size: 11px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }

    .slot.selected {
      border-color: #fff;
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(255,255,255,0.18);
      background: rgba(40, 45, 55, 0.92);
    }

    .swatch {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid rgba(0,0,0,0.35);
      margin-bottom: 4px;
    }

    #help {
      position: fixed;
      top: 12px;
      left: 12px;
      background: rgba(20, 20, 25, 0.62);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.5;
      pointer-events: none;
      z-index: 11;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div id="help">
      <b>操作開始後はマウスで視点操作</b><br>
      WASD: 移動 / Space: ジャンプ / Shift: 走る<br>
      左クリック: 破壊 / 右クリック: 設置<br>
      1〜6: ブロック選択 /ホイール: 切替
    </div>

    <div id="hotbar"></div>
  </div>

  <div id="crosshair"></div>

  <div id="overlay">
    <div class="panel">
      <h1>マイクラ風3D箱庭</h1>
      <p>
        クリックして操作を開始してください。<br>
        WASDで移動、Spaceでジャンプ、左クリックでブロック破壊、右クリックで設置できます。
      </p>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

    // --------------------------
    // 定数
    // --------------------------
    const W = 40;
    const D = 40;
    const H = 32;

    const MAX_INSTANCES = W * D * H;

    const AIR = 0;
    const GRASS = 1;
    const DIRT = 2;
    const STONE = 3;
    const WOOD = 4;
    const LEAVES = 5;
    const SAND = 6;

    const BLOCK_NAMES = [
      '', '芝', '土', '石', '木', '葉', '砂'
    ];

    const BLOCK_COLORS = {
      [GRASS]: new THREE.Color(0x4e9a4e),
      [DIRT]: new THREE.Color(0x8b5a2b),
      [STONE]: new THREE.Color(0x9b9b9b),
      [WOOD]: new THREE.Color(0x7a4a22),
      [LEAVES]: new THREE.Color(0x2f7a32),
      [SAND]: new THREE.Color(0xd9bf7a),
    };

    const PLAYER_RADIUS = 0.32;
    const PLAYER_HEIGHT = 1.8;
    const EYE_HEIGHT = 1.62;

    const GRAVITY = 28;
    const JUMP_SPEED = 8.4;
    const WALK_SPEED = 5.2;
    const SPRINT_SPEED = 8.5;

    const REACH = 6.25;

    // --------------------------
    // Three.js 準備
    // --------------------------
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x8fb8ff, 1);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x8fb8ff);
    scene.fog = new THREE.Fog(0x8fb8ff, 32, 85);

    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      220
    );
    camera.rotation.order = 'YXZ';

    const ambient = new THREE.AmbientLight(0xffffff, 0.62);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xffffff, 0.72);
    sun.position.set(25, 42, 18);
    scene.add(sun);

    const hemisphere = new THREE.HemisphereLight(0xbfd6ff, 0x4f4230, 0.35);
    scene.add(hemisphere);

    // --------------------------
    // ブロックデータ
    // --------------------------
    const blocks = new Uint8Array(W * D * H);

    function blockIndex(x, y, z) {
      return x + W * (z + D * y);
    }

    function inBounds(x, y, z) {
      return x >= 0 && x < W && y >= 0 && y < H && z >= 0 && z < D;
    }

    function getBlock(x, y, z) {
      if (!inBounds(x, y, z)) return AIR;
      return blocks[blockIndex(x, y, z)];
    }

    function setBlock(x, y, z, id) {
      if (!inBounds(x, y, z)) return;
      blocks[blockIndex(x, y, z)] = id;
    }

    function isSolid(x, y, z) {
      const id = getBlock(x, y, z);
      return id !== AIR;
    }

    // --------------------------
    // ブロック描画
    // InstancedMeshで一括描画
    // --------------------------
    const blockGeometry = new THREE.BoxGeometry(1, 1, 1);
    const blockMaterial = new THREE.MeshLambertMaterial({
      color: 0xffffff
    });

    const blockMesh = new THREE.InstancedMesh(
      blockGeometry,
      blockMaterial,
      MAX_INSTANCES
    );
    blockMesh.frustumCulled = false;
    scene.add(blockMesh);

    const dummyObject = new THREE.Object3D();
    const dummyColor = new THREE.Color();

    // instanceColorを初期化
    dummyColor.copy(BLOCK_COLORS[STONE]);
    blockMesh.setColorAt(0, dummyColor);
    blockMesh.instanceColor.needsUpdate = true;

    function rebuildBlocks() {
      let count = 0;

      for (let y = 0; y < H; y++) {
        for (let z = 0; z < D; z++) {
          for (let x = 0; x < W; x++) {
            const id = blocks[blockIndex(x, y, z)];
            if (id === AIR) continue;

            if (count >= MAX_INSTANCES) break;

            dummyObject.position.set(
              x + 0.5,
              y + 0.5,
              z + 0.5
            );
            dummyObject.updateMatrix();
            blockMesh.setMatrixAt(count, dummyObject.matrix);

            dummyColor.copy(BLOCK_COLORS[id] || new THREE.Color(0xff0000));
            blockMesh.setColorAt(count, dummyColor);

            count++;
          }
        }
      }

      blockMesh.count = count;
      blockMesh.instanceMatrix.needsUpdate = true;
      if (blockMesh.instanceColor) {
        blockMesh.instanceColor.needsUpdate = true;
      }
    }

    // --------------------------
    // 選択枠ハイライト
    // --------------------------
    const outlineGeometry = new THREE.BoxGeometry(1.035, 1.035, 1.035);
    const outlineMaterial = new THREE.LineBasicMaterial({
      color: 0x111111,
      transparent: true,
      opacity: 0.78
    });

    const edges = new THREE.EdgesGeometry(outlineGeometry);
    const outline = new THREE.LineSegments(edges, outlineMaterial);
    outline.visible = false;
    scene.add(outline);

    // --------------------------
    // 地形生成
    // --------------------------
    function seededRandom(seed) {
      let s = seed >>> 0;
      return () => {
        s = (s * 1664525 + 1013904223) >>> 0;
        return s / 4294967296;
      };
    }

    const random = seededRandom(13467);

    function generateTerrain() {
      blocks.fill(AIR);

      const offsetX = random() * 80;
      const offsetZ = random() * 80;

      for (let x = 0; x < W; x++) {
        for (let z = 0; z < D; z++) {
          let h = 8;

          h += Math.sin((x + offsetX) * 0.20) * 3.2;
          h += Math.cos((z + offsetZ) * 0.24) * 2.8;
          h += Math.sin((x + z + offsetX + offsetZ) * 0.11) * 2.4;
          h += Math.cos((x - z + offsetX - offsetZ) * 0.17) * 1.8;
          h += Math.sin((x * 0.43) + Math.cos(z * 0.37)) * 1.2;

          h = Math.max(4, Math.min(H - 9, Math.floor(h)));

          for (let y = 0; y < h; y++) {
            let id = STONE;

            if (y >= h - 1) {
              id = GRASS;
            } else if (y >= h - 3) {
              id = DIRT;
            }

            setBlock(x, y, z, id);
          }

          // 低いところは砂
          if (h <= 5) {
            setBlock(x, h - 1, z, SAND);
          }
        }
      }

      // 木生成
      let treeCount = 0;

      for (let attempt = 0; attempt < 600 && treeCount < 18; attempt++) {
        const tx = Math.floor(random() * (W - 6)) + 3;
        const tz = Math.floor(random() * (D - 6)) + 3;

        let top = H - 1;
        for (let y = H - 1; y >= 0; y--) {
          if (isSolid(tx, y, tz)) {
            top = y;
            break;
          }
        }

        const groundY = top;
        const grass = getBlock(tx, groundY, tz);
        if (grass !== GRASS) continue;

        const trunkBaseY = groundY + 1;
        const trunkHeight = 3 + Math.floor(random() * 2);
        const trunkTopY = Math.min(H - 1, trunkBaseY + trunkHeight - 1);

        for (let y = trunkBaseY; y <= trunkTopY; y++) {
          setBlock(tx, y, tz, WOOD);
        }

        const leafCenterY = trunkTopY;

        for (let dx = -2; dx <= 2; dx++) {
          for (let dz = -2; dz <= 2; dz++) {
            for (let dy = -1; dy <= 1; dy++) {
              const lx = tx + dx;
              const ly = leafCenterY + dy;
              const lz = tz + dz;

              if (!inBounds(lx, ly, lz)) continue;
              if (isSolid(lx, ly, lz)) continue;

              const distance = Math.abs(dx) + Math.abs(dz) + Math.abs(dy);
              if (distance > 4) continue;

              if (dx === 0 && dz === 0 && dy === 0) continue;

              setBlock(lx, ly, lz, LEAVES);
            }
          }
        }

        treeCount++;
      }

      rebuildBlocks();
    }

    // --------------------------
    // プレイヤー状態
    // --------------------------
    const player = {
      pos: new THREE.Vector3(),
      vel: new THREE.Vector3(),
      yaw: 0,
      pitch: 0,
      grounded: false
    };

    function spawnPlayer() {
      const sx = W / 2 + 0.5;
      const sz = D / 2 + 0.5;

      let top = 0;
      for (let y = H - 1; y >= 0; y--) {
        if (isSolid(Math.floor(sx), y, Math.floor(sz))) {
          top = y;
          break;
        }
      }

      player.pos.set(sx, top + 1 + 0.001, sz);
      player.vel.set(0, 0, 0);
      player.yaw = 0;
      player.pitch = 0;
      player.grounded = false;
    }

    // --------------------------
    // 衝突判定
    // --------------------------
    function scanOverlappingBlocks() {
      const minX = Math.floor(player.pos.x - PLAYER_RADIUS);
      const maxX = Math.floor(player.pos.x + PLAYER_RADIUS);
      const minY = Math.floor(player.pos.y + 0.001);
      const maxY = Math.floor(player.pos.y + PLAYER_HEIGHT - 0.001);
      const minZ = Math.floor(player.pos.z - PLAYER_RADIUS);
      const maxZ = Math.floor(player.pos.z + PLAYER_RADIUS);

      const overlaps = [];

      for (let x = minX; x <= maxX; x++) {
        for (let y = minY; y <= maxY; y++) {
          for (let z = minZ; z <= maxZ; z++) {
            if (isSolid(x, y, z)) {
              overlaps.push([x, y, z]);
            }
          }
        }
      }

      return overlaps;
    }

    function resolveAxis(axis) {
      const overlaps = scanOverlappingBlocks();
      if (overlaps.length === 0) return;

      if (axis === 'x') {
        let minBlock = Infinity;
        let maxBlock = -Infinity;

        for (const [x] of overlaps) {
          minBlock = Math.min(minBlock, x);
          maxBlock = Math.max(maxBlock, x + 1);
        }

        if (player.vel.x > 0) {
          player.pos.x = minBlock - PLAYER_RADIUS;
        } else if (player.vel.x < 0) {
          player.pos.x = maxBlock + PLAYER_RADIUS;
        }

        player.vel.x = 0;
      }

      if (axis === 'z') {
        let minBlock = Infinity;
        let maxBlock = -Infinity;

        for (const [, , z] of overlaps) {
          minBlock = Math.min(minBlock, z);
          maxBlock = Math.max(maxBlock, z + 1);
        }

        if (player.vel.z > 0) {
          player.pos.z = minBlock - PLAYER_RADIUS;
        } else if (player.vel.z < 0) {
          player.pos.z = maxBlock + PLAYER_RADIUS;
        }

        player.vel.z = 0;
      }

      if (axis === 'y') {
        let minBlock = Infinity;
        let maxBlock = -Infinity;

        for (const [, y] of overlaps) {
          minBlock = Math.min(minBlock, y);
          maxBlock = Math.max(maxBlock, y + 1);
        }

        if (player.vel.y > 0) {
          player.pos.y = minBlock - PLAYER_HEIGHT - 0.001;
        } else if (player.vel.y < 0) {
          player.pos.y = maxBlock + 0.001;
          player.grounded = true;
        }

        player.vel.y = 0;
      }
    }

    function isGrounded() {
      const x = Math.floor(player.pos.x);
      const y = Math.floor(player.pos.y - 0.12);
      const z = Math.floor(player.pos.z);

      return isSolid(x, y, z);
    }

    function clampToMap() {
      player.pos.x = Math.max(
        PLAYER_RADIUS + 0.01,
        Math.min(W - PLAYER_RADIUS - 0.01, player.pos.x)
      );

      player.pos.z = Math.max(
        PLAYER_RADIUS + 0.01,
        Math.min(D - PLAYER_RADIUS - 0.01, player.pos.z)
      );

      if (player.pos.y < -10) {
        spawnPlayer();
      }
    }

    // --------------------------
    // Voxel Raycast
    // --------------------------
    function raycastVoxel(origin, direction, maxDistance = REACH) {
      let x = Math.floor(origin.x);
      let y = Math.floor(origin.y);
      let z = Math.floor(origin.z);

      const dx = direction.x;
      const dy = direction.y;
      const dz = direction.z;

      if (dx === 0 && dy === 0 && dz === 0) {
        return null;
      }

      if (isSolid(x, y, z)) {
        let normal = new THREE.Vector3(0, -1, 0);

        if (Math.abs(dx) >= Math.abs(dy) && Math.abs(dx) >= Math.abs(dz)) {
          normal = new THREE.Vector3(-Math.sign(dx), 0, 0);
        } else if (Math.abs(dy) >= Math.abs(dx) && Math.abs(dy) >= Math.abs(dz)) {
          normal = new THREE.Vector3(0, -Math.sign(dy), 0);
        } else {
          normal = new THREE.Vector3(0, 0, -Math.sign(dz));
        }

        return { x, y, z, normal };
      }

      const stepX = dx > 0 ? 1 : -1;
      const stepY = dy > 0 ? 1 : -1;
      const stepZ = dz > 0 ? 1 : -1;

      const tDeltaX = dx !== 0 ? Math.abs(1 / dx) : Infinity;
      const tDeltaY = dy !== 0 ? Math.abs(1 / dy) : Infinity;
      const tDeltaZ = dz !== 0 ? Math.abs(1 / dz) : Infinity;

      let tMaxX = dx > 0
        ? (x + 1 - origin.x) / dx
        : dx < 0
          ? (x - origin.x) / dx
          : Infinity;

      let tMaxY = dy > 0
        ? (y + 1 - origin.y) / dy
        : dy < 0
          ? (y - origin.y) / dy
          : Infinity;

      let tMaxZ = dz > 0
        ? (z + 1 - origin.z) / dz
        : dz < 0
          ? (z - origin.z) / dz
          : Infinity;

      const faceNormal = new THREE.Vector3();

      for (let i = 0; i < 128; i++) {
        const minT = Math.min(tMaxX, tMaxY, tMaxZ);
        if (minT > maxDistance) return null;

        if (tMaxX < tMaxY && tMaxX < tMaxZ) {
          x += stepX;
          tMaxX += tDeltaX;
          faceNormal.set(-stepX, 0, 0);
        } else if (tMaxY < tMaxZ) {
          y += stepY;
          tMaxY += tDeltaY;
          faceNormal.set(0, -stepY, 0);
        } else {
          z += stepZ;
          tMaxZ += tDeltaZ;
          faceNormal.set(0, 0, -stepZ);
        }

        if (isSolid(x, y, z)) {
          return { x, y, z, normal: faceNormal.clone() };
        }
      }

      return null;
    }

    // --------------------------
    // ブロック操作
    // --------------------------
    function intersectsPlayer(blockX, blockY, blockZ) {
      const blockMinX = blockX;
      const blockMaxX = blockX + 1;
      const blockMinY = blockY;
      const blockMaxY = blockY + 1;
      const blockMinZ = blockZ;
      const blockMaxZ = blockZ + 1;

      const playerMinX = player.pos.x - PLAYER_RADIUS;
      const playerMaxX = player.pos.x + PLAYER_RADIUS;
      const playerMinY = player.pos.y;
      const playerMaxY = player.pos.y + PLAYER_HEIGHT;
      const playerMinZ = player.pos.z - PLAYER_RADIUS;
      const playerMaxZ = player.pos.z + PLAYER_RADIUS;

      return (
        blockMaxX > playerMinX &&
        blockMinX < playerMaxX &&
        blockMaxY > playerMinY &&
        blockMinY < playerMaxY &&
        blockMaxZ > playerMinZ &&
        blockMinZ < playerMaxZ
      );
    }

    function getLookDirection() {
      const dir = new THREE.Vector3();
      camera.getWorldDirection(dir);
      return dir;
    }

    function breakBlock() {
      const hit = raycastVoxel(camera.position, getLookDirection(), REACH);
      if (!hit) return;

      setBlock(hit.x, hit.y, hit.z, AIR);
      rebuildBlocks();
    }

    function placeBlock() {
      const hit = raycastVoxel(camera.position, getLookDirection(), REACH);
      if (!hit) return;

      const nx = hit.x + hit.normal.x;
      const ny = hit.y + hit.normal.y;
      const nz = hit.z + hit.normal.z;

      if (!inBounds(nx, ny, nz)) return;
      if (isSolid(nx, ny, nz)) return;
      if (intersectsPlayer(nx, ny, nz)) return;

      setBlock(nx, ny, nz, selectedBlock);
      rebuildBlocks();
    }

    // --------------------------
    // UI / ホットバー
    // --------------------------
    let selectedBlock = GRASS;

    const hotbar = document.getElementById('hotbar');
    const overlay = document.getElementById('overlay');

    function createHotbar() {
      const items = [
        { id: GRASS, name: '芝' },
        { id: DIRT, name: '土' },
        { id: STONE, name: '石' },
        { id: WOOD, name: '木' },
        { id: LEAVES, name: '葉' },
        { id: SAND, name: '砂' },
      ];

      for (const item of items) {
        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.dataset.id = item.id;

        const swatch = document.createElement('div');
        swatch.className = 'swatch';
        swatch.style.background = `#${BLOCK_COLORS[item.id].getHexString()}`;

        const label = document.createElement('div');
        label.textContent = item.name;

        const key = document.createElement('div');
        key.textContent = item.id;
        key.style.fontSize = '10px';
        key.style.opacity = 0.8;

        slot.appendChild(swatch);
        slot.appendChild(label);
        slot.appendChild(key);

        hotbar.appendChild(slot);
      }

      updateHotbar();
    }

    function updateHotbar() {
      [...hotbar.children].forEach((slot) => {
        const id = Number(slot.dataset.id);
        slot.classList.toggle('selected', id === selectedBlock);
      });
    }

    function selectBlock(id) {
      if (id < 1 || id > 6) return;
      selectedBlock = id;
      updateHotbar();
    }

    // --------------------------
    // 入力
    // --------------------------
    const keys = {};
    let pointerLocked = false;

    function requestPointerLock() {
      renderer.domElement.requestPointerLock();
    }

    document.addEventListener('pointerlockchange', () => {
      pointerLocked = document.pointerLockElement === renderer.domElement;

      if (pointerLocked) {
        overlay.style.display = 'none';
      } else {
        overlay.style.display = 'flex';
        overlay.querySelector('.panel').innerHTML = `
          <h1>マイクラ風3D箱庭</h1>
          <p>
            再び画面をクリックして操作を続けてください。<br>
            WASDで移動、Spaceでジャンプ、左クリックで破壊、右クリックで設置。
          </p>
        `;
      }
    });

    overlay.addEventListener('click', requestPointerLock);
    renderer.domElement.addEventListener('click', () => {
      if (!pointerLocked) requestPointerLock();
    });

    document.addEventListener('mousedown', (e) => {
      if (!pointerLocked) {
        if (e.button === 0) requestPointerLock();
        return;
      }

      e.preventDefault();

      if (e.button === 0) {
        breakBlock();
      } else if (e.button === 2) {
        placeBlock();
      }
    });

    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
    });

    document.addEventListener('keydown', (e) => {
      keys[e.code] = true;

      if (e.code === 'Space') {
        e.preventDefault();
      }

      if (e.code === 'Digit1') selectBlock(1);
      if (e.code === 'Digit2') selectBlock(2);
      if (e.code === 'Digit3') selectBlock(3);
      if (e.code === 'Digit4') selectBlock(4);
      if (e.code === 'Digit5') selectBlock(5);
      if (e.code === 'Digit6') selectBlock(6);

      if (e.code === 'KeyR') {
        generateTerrain();
        spawnPlayer();
      }
    });

    document.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    window.addEventListener('wheel', (e) => {
      if (!pointerLocked) return;

      const offset = e.deltaY > 0 ? 1 : -1;
      const current = selectedBlock;
      const next = ((current - 1 + offset + 6) % 6) + 1;
      selectBlock(next);
    }, { passive: true });

    document.addEventListener('mousemove', (e) => {
      if (!pointerLocked) return;

      const sensitivity = 0.0022;
      player.yaw -= e.movementX * sensitivity;
      player.pitch -= e.movementY * sensitivity;

      player.pitch = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, player.pitch));
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --------------------------
    // 移動更新
    // --------------------------
    function updatePlayer(dt) {
      dt = Math.min(dt, 0.05);

      const forwardInput = (keys['KeyW'] ? 1 : 0) - (keys['KeyS'] ? 1 : 0);
      const rightInput = (keys['KeyD'] ? 1 : 0) - (keys['KeyA'] ? 1 : 0);

      const move = new THREE.Vector3();

      if (forwardInput !== 0) {
        move.x += -Math.sin(player.yaw) * forwardInput;
        move.z += -Math.cos(player.yaw) * forwardInput;
      }

      if (rightInput !== 0) {
        move.x += Math.cos(player.yaw) * rightInput;
        move.z += -Math.sin(player.yaw) * rightInput;
      }

      if (move.lengthSq() > 1) {
        move.normalize();
      }

      const speed = keys['ShiftLeft'] || keys['ShiftRight']
        ? SPRINT_SPEED
        : WALK_SPEED;

      player.vel.x = move.x * speed;
      player.vel.z = move.z * speed;

      player.vel.y -= GRAVITY * dt;
      player.vel.y = Math.max(player.vel.y, -45);

      if (keys['Space'] && player.grounded) {
        player.vel.y = JUMP_SPEED;
        player.grounded = false;
      }

      player.grounded = false;

      player.pos.x += player.vel.x * dt;
      resolveAxis('x');

      player.pos.z += player.vel.z * dt;
      resolveAxis('z');

      player.pos.y += player.vel.y * dt;
      resolveAxis('y');

      clampToMap();

      if (!player.grounded) {
        player.grounded = isGrounded();
      }
    }

    function updateCamera() {
      camera.position.set(
        player.pos.x,
        player.pos.y + EYE_HEIGHT,
        player.pos.z
      );

      camera.rotation.set(
        player.pitch,
        player.yaw,
        0,
        'YXZ'
      );
    }

    // --------------------------
    // ハイライト更新
    // --------------------------
    function updateHighlight() {
      const hit = raycastVoxel(camera.position, getLookDirection(), REACH);

      if (hit) {
        outline.visible = true;
        outline.position.set(
          hit.x + 0.5,
          hit.y + 0.5,
          hit.z + 0.5
        );
      } else {
        outline.visible = false;
      }
    }

    // --------------------------
    // メインループ
    // --------------------------
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const dt = clock.getDelta();

      if (pointerLocked) {
        updatePlayer(dt);
      } else {
        // 操作開始前はゆっくり回転させる演出
        player.yaw += dt * 0.18;
      }

      updateCamera();
      updateHighlight();

      renderer.render(scene, camera);
    }

    // --------------------------
    // 起動
    // --------------------------
    createHotbar();
    generateTerrain();
    spawnPlayer();
    animate();
  </script>
</body>
</html>
