<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Harbor Scene</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #87CEEB; 
            font-family: sans-serif;
        }
        canvas { 
            display: block; 
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 8px 12px;
            border-radius: 4px;
            pointer-events: none;
        }
    </style>
    <!-- Import maps polyfill -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="info">A Sailing Ship Calling at a Harbor<br><small>Left Click + Drag to Orbit | Scroll to Zoom</small></div>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --------------------------------------------------------
        // 1. Core Setup
        // --------------------------------------------------------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 50, 150);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(30, 25, 40);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 5, 0);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // Prevent going under the floor

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        dirLight.shadow.camera.left = -50;
        dirLight.shadow.camera.right = 50;
        dirLight.shadow.camera.top = 50;
        dirLight.shadow.camera.bottom = -50;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 150;
        scene.add(dirLight);

        // --------------------------------------------------------
        // 2. Optimized Voxel Builder 
        // (Groups blocks by color to reduce draw calls to ~10)
        // --------------------------------------------------------
        class VoxelBuilder {
            constructor() {
                this.data = {};
            }
            add(x, y, z, color) {
                if (!this.data[color]) this.data[color] = [];
                this.data[color].push({ x, y, z });
            }
            build(targetGroup) {
                const geometry = new THREE.BoxGeometry(1, 1, 1);
                for (const color in this.data) {
                    const positions = this.data[color];
                    const material = new THREE.MeshLambertMaterial({ color: color });
                    const mesh = new THREE.InstancedMesh(geometry, material, positions.length);
                    const dummy = new THREE.Object3D();
                    positions.forEach((p, i) => {
                        dummy.position.set(p.x, p.y, p.z);
                        dummy.updateMatrix();
                        mesh.setMatrixAt(i, dummy.matrix);
                    });
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    targetGroup.add(mesh);
                }
            }
        }

        // Builders & Groups
        const sceneBuilder = new VoxelBuilder();
        const shipBuilder = new VoxelBuilder();
        const wavesBuilder = new VoxelBuilder();
        const cloudsBuilder = new VoxelBuilder();
        const birdsBuilder = new VoxelBuilder();

        const sceneGroup = new THREE.Group();
        const shipGroup = new THREE.Group();
        const wavesGroup = new THREE.Group();
        const cloudsGroup = new THREE.Group();
        const birdsGroup = new THREE.Group();

        scene.add(sceneGroup, shipGroup, wavesGroup, cloudsGroup, birdsGroup);

        function addVoxel(x, y, z, color, builder = sceneBuilder) {
            builder.add(x, y, z, color);
        }

        // Color Palette
        const COLORS = {
            water: 0x1e77b8, wave: 0x4a90e2,
            hull: 0x5c3a21, hullTrim: 0x3d2414, deck: 0x8b5a2b,
            sail: 0xf4f1e1, mast: 0x2c1e16,
            stone: 0x7f8c8d, roof: 0xc0392b,
            crate: 0xd35400, barrel: 0x935116,
            leaf: 0x27ae60, sand: 0xf4d03f
        };

        // --------------------------------------------------------
        // 3. Geometry Construction
        // --------------------------------------------------------

        // --- A. Ocean & Waves ---
        const waterGeo = new THREE.BoxGeometry(200, 1, 200);
        const waterMesh = new THREE.Mesh(waterGeo, new THREE.MeshLambertMaterial({ color: COLORS.water }));
        waterMesh.position.set(0, -0.5, 0); // Surface is at y=0
        waterMesh.receiveShadow = true;
        scene.add(waterMesh);

        for (let i = 0; i < 300; i++) {
            const x = Math.floor((Math.random() - 0.5) * 100);
            const z = Math.floor((Math.random() - 0.5) * 100);
            addVoxel(x, 0.5, z, COLORS.wave, wavesBuilder);
            if (Math.random() > 0.5) addVoxel(x + 1, 0.5, z, COLORS.wave, wavesBuilder);
        }

        // --- B. The Sailing Ship ---
        const hullLevels = [
            { y: 0.5, zLen: 7, maxW: 1 },  // Keel
            { y: 1.5, zLen: 9, maxW: 2 },
            { y: 2.5, zLen: 10, maxW: 3 },
            { y: 3.5, zLen: 11, maxW: 3 }  // Top hull
        ];

        hullLevels.forEach(level => {
            for (let z = -level.zLen; z <= level.zLen; z++) {
                let w = level.maxW;
                // Taper the bow and stern
                if (Math.abs(z) === level.zLen) w = 0;
                else if (Math.abs(z) === level.zLen - 1) w = Math.max(0, level.maxW - 2);
                else if (Math.abs(z) === level.zLen - 2) w = Math.max(0, level.maxW - 1);
                
                for (let x = -w; x <= w; x++) {
                    addVoxel(x, level.y, z, COLORS.hull, shipBuilder);
                }
            }
        });

        // Deck
        for (let z = -10; z <= 10; z++) {
            for (let x = -3; x <= 3; x++) {
                addVoxel(x, 4.5, z, COLORS.deck, shipBuilder);
            }
        }

        // Railings
        for (let z = -10; z <= 10; z++) {
            addVoxel(-3, 4.5, z, COLORS.hullTrim, shipBuilder);
            addVoxel(3, 4.5, z, COLORS.hullTrim, shipBuilder);
        }
        for (let x = -3; x <= 3; x++) {
            addVoxel(x, 4.5, -10, COLORS.hullTrim, shipBuilder);
            addVoxel(x, 4.5, 10, COLORS.hullTrim, shipBuilder);
        }
        for (let z = -10; z <= 10; z += 2) {
            addVoxel(-3, 5.5, z, COLORS.hullTrim, shipBuilder);
            addVoxel(3, 5.5, z, COLORS.hullTrim, shipBuilder);
        }

        // Stern Cabin
        for (let z = 6; z <= 9; z++) {
            for (let x = -2; x <= 2; x++) {
                for (let y = 5; y <= 7; y++) {
                    if (y > 5 && x > -2 && x < 2 && z > 6 && z < 9) continue; // Hollow
                    if (z === 6 && x === 0 && y === 5) continue; // Doorway
                    if (y === 6 && (x === -2 || x === 2) && z === 8) continue; // Window
                    addVoxel(x, y + 0.5, z, COLORS.hull, shipBuilder);
                }
            }
        }
        for (let z = 5; z <= 10; z++) {
            for (let x = -3; x <= 3; x++) {
                addVoxel(x, 8.5, z, COLORS.roof, shipBuilder);
            }
        }

        // Main Mast & Spars
        for (let y = 5; y <= 24; y++) addVoxel(0, y + 0.5, 0, COLORS.mast, shipBuilder);
        for (let x = -6; x <= 6; x++) addVoxel(x, 19.5, 0, COLORS.mast, shipBuilder);
        for (let x = -8; x <= 8; x++) addVoxel(x, 13.5, 0, COLORS.mast, shipBuilder);
        for (let x = -5; x <= 5; x++) addVoxel(x, 8.5, 0, COLORS.mast, shipBuilder);

        // Main Sails (with a slight visual curve/bulge)
        for (let y = 14; y <= 18; y++) {
            for (let x = -5; x <= 5; x++) {
                let zOffset = Math.floor((5 - Math.abs(x)) / 3) + 1;
                addVoxel(x, y + 0.5, zOffset, COLORS.sail, shipBuilder);
            }
        }
        for (let y = 9; y <= 12; y++) {
            for (let x = -7; x <= 7; x++) {
                let zOffset = Math.floor((7 - Math.abs(x)) / 3) + 1;
                addVoxel(x, y + 0.5, zOffset, COLORS.sail, shipBuilder);
            }
        }
        for (let y = 5; y <= 7; y++) {
            for (let x = -4; x <= 4; x++) {
                let zOffset = Math.floor((4 - Math.abs(x)) / 2) + 1;
                addVoxel(x, y + 0.5, zOffset, COLORS.sail, shipBuilder);
            }
        }
        
        // Flag
        for (let z = 1; z <= 4; z++) addVoxel(0, 24.5, z, COLORS.roof, shipBuilder);

        // Foremast & Sails
        for (let y = 5; y <= 16; y++) addVoxel(0, y + 0.5, -6, COLORS.mast, shipBuilder);
        for (let x = -4; x <= 4; x++) addVoxel(x, 12.5, -6, COLORS.mast, shipBuilder);
        for (let x = -6; x <= 6; x++) addVoxel(x, 7.5, -6, COLORS.mast, shipBuilder);
        
        for (let y = 8; y <= 11; y++) {
            for (let x = -3; x <= 3; x++) {
                let zOffset = -6 + Math.floor((3 - Math.abs(x)) / 2) + 1;
                addVoxel(x, y + 0.5, zOffset, COLORS.sail, shipBuilder);
            }
        }
        for (let y = 5; y <= 6; y++) {
            for (let x = -5; x <= 5; x++) {
                let zOffset = -6 + Math.floor((5 - Math.abs(x)) / 2) + 1;
                addVoxel(x, y + 0.5, zOffset, COLORS.sail, shipBuilder);
            }
        }

        // --- C. Harbor / Dock ---
        // Wooden pier
        for (let x = 6; x <= 20; x++) {
            for (let z = -10; z <= 10; z++) {
                addVoxel(x, 0.5, z, COLORS.stone);
                addVoxel(x, 1.5, z, COLORS.stone);
                addVoxel(x, 2.5, z, COLORS.stone);
                addVoxel(x, 3.5, z, COLORS.deck); // Pier top
            }
        }

        // Dock posts
        for (let x = 6; x <= 20; x += 4) {
            addVoxel(x, 4.5, -10, COLORS.mast);
            addVoxel(x, 5.5, -10, COLORS.mast);
            addVoxel(x, 4.5, 10, COLORS.mast);
            addVoxel(x, 5.5, 10, COLORS.mast);
        }

        // Gangplank
        for (let x = 3; x <= 6; x++) {
            for (let z = 2; z <= 3; z++) addVoxel(x, 4.5, z, COLORS.deck);
        }

        // Cargo (Crates and Barrels)
        function createCrate(x, z) {
            for (let i = 0; i < 2; i++) {
                for (let j = 0; j < 2; j++) {
                    addVoxel(x + i, 4.5, z + j, COLORS.crate);
                    addVoxel(x + i, 5.5, z + j, COLORS.crate);
                }
            }
        }
        [[12, -5], [12, -2], [15, -5], [10, 6], [14, 7], [15, 7]].forEach(c => createCrate(c[0], c[1]));

        function createBarrel(x, z) {
            addVoxel(x, 4.5, z, COLORS.barrel);
            addVoxel(x, 5.5, z, COLORS.barrel);
        }
        [[18, -8], [18, -7], [17, 2], [17, 3], [17, 4]].forEach(b => createBarrel(b[0], b[1]));

        // Harbor Warehouse
        for (let x = 16; x <= 22; x++) {
            for (let z = 4; z <= 9; z++) {
                for (let y = 4; y <= 8; y++) {
                    if (y < 8 && x > 16 && x < 22 && z > 4 && z < 9) continue; // hollow
                    if (x === 16 && z === 6 && y === 4) continue; // door
                    addVoxel(x, y + 0.5, z, COLORS.crate);
                }
            }
        }
        for (let x = 15; x <= 23; x++) {
            for (let z = 3; z <= 10; z++) addVoxel(x, 9.5, z, COLORS.roof);
        }

        // --- D. Lighthouse Island ---
        const isX = -25, isZ = -20;
        
        // Sand base
        for (let x = isX - 5; x <= isX + 5; x++) {
            for (let z = isZ - 5; z <= isZ + 5; z++) {
                let dist = Math.sqrt((x - isX)**2 + (z - isZ)**2);
                if (dist < 5) {
                    addVoxel(x, 0.5, z, COLORS.sand);
                    if (dist < 3) addVoxel(x, 1.5, z, COLORS.sand);
                }
            }
        }
        
        // Lighthouse Tower
        for (let y = 2; y <= 14; y++) {
            for (let x = isX - 1; x <= isX + 1; x++) {
                for (let z = isZ - 1; z <= isZ + 1; z++) {
                    let color = (Math.floor(y / 3) % 2 === 0) ? 0xffffff : COLORS.roof;
                    if (y > 12) color = COLORS.mast; // Balcony level
                    addVoxel(x, y + 0.5, z, color);
                }
            }
        }
        
        // Lantern & Roof
        for (let y = 15; y <= 16; y++) {
            for (let x = isX - 1; x <= isX + 1; x++) {
                for (let z = isZ - 1; z <= isZ + 1; z++) addVoxel(x, y + 0.5, z, 0xffd700);
            }
        }
        for (let x = isX - 2; x <= isX + 2; x++) {
            for (let z = isZ - 2; z <= isZ + 2; z++) addVoxel(x, 17.5, z, COLORS.roof);
        }

        // Little Trees
        function createTree(tx, tz) {
            addVoxel(tx, 2.5, tz, COLORS.mast);
            addVoxel(tx, 3.5, tz, COLORS.mast);
            for(let x = -1; x <= 1; x++) {
                for(let z = -1; z <= 1; z++) {
                    if (Math.abs(x) === 1 && Math.abs(z) === 1) continue;
                    addVoxel(tx + x, 4.5, tz + z, COLORS.leaf);
                    addVoxel(tx + x, 5.5, tz + z, COLORS.leaf);
                }
            }
            addVoxel(tx, 6.5, tz, COLORS.leaf);
        }
        createTree(isX + 2, isZ + 2);
        createTree(isX - 2, isZ - 2);

        // --- E. Rowboat ---
        for (let z = 10; z <= 14; z++) {
            for (let x = 7; x <= 9; x++) {
                if ((z === 10 || z === 14) && x !== 8) continue;
                addVoxel(x, 1.5, z, COLORS.hull);
            }
        }

        // --- F. Sky & Birds ---
        function createCloud(cx, cy, cz) {
            for (let x = -2; x <= 2; x++) {
                for (let z = -1; z <= 1; z++) {
                    if (Math.random() > 0.3) addVoxel(cx + x, cy + Math.floor(Math.random()*2), cz + z, 0xffffff, cloudsBuilder);
                }
            }
        }
        createCloud(10, 35, -20);
        createCloud(-15, 40, 15);
        createCloud(30, 30, 30);

        function createBird(bx, by, bz) {
            addVoxel(bx - 1, by + 1, bz, COLORS.mast, birdsBuilder);
            addVoxel(bx, by, bz, COLORS.mast, birdsBuilder);
            addVoxel(bx + 1, by + 1, bz, COLORS.mast, birdsBuilder);
        }
        createBird(5, 20, -15);
        createBird(8, 22, -12);
        createBird(-10, 25, -5);

        // --------------------------------------------------------
        // 4. Finalize Mesh Generation & Animation
        // --------------------------------------------------------
        sceneBuilder.build(sceneGroup);
        shipBuilder.build(shipGroup);
        wavesBuilder.build(wavesGroup);
        cloudsBuilder.build(cloudsGroup);
        birdsBuilder.build(birdsGroup);

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Bob the ship gently
            shipGroup.position.y = -0.5 + Math.sin(time * 1.5) * 0.3;
            shipGroup.rotation.z = Math.sin(time * 1.1) * 0.02;
            shipGroup.rotation.x = Math.cos(time * 1.3) * 0.02;

            // Animate waves
            wavesGroup.position.y = Math.sin(time * 2) * 0.2;

            // Slowly drift clouds & animate birds
            cloudsGroup.rotation.y = time * 0.01;
            birdsGroup.position.x = Math.sin(time * 2) * 3;
            birdsGroup.position.y = Math.sin(time * 5) * 0.5;

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
