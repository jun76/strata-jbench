<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Sailing Ship at Harbor</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #87CEEB;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Load Three.js and OrbitControls from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        // --- 1. Basic Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 60, 150);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
        camera.position.set(35, 30, 45);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(5, 5, 0);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // Prevent camera from going underwater

        // --- 2. Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x445566, 0.4);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(30, 50, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.left = -60;
        dirLight.shadow.camera.right = 60;
        dirLight.shadow.camera.top = 60;
        dirLight.shadow.camera.bottom = -60;
        scene.add(dirLight);

        // --- 3. Voxel Data Generator ---
        const voxels = [];
        function addVoxel(x, y, z, color) {
            voxels.push({ x, y, z, color });
        }

        // --- 4. Build the Scene ---

        // A. Ocean
        for (let x = -40; x <= 40; x++) {
            for (let z = -40; z <= 40; z++) {
                let c = 0x2288FF;
                let r = Math.random();
                if (r > 0.98) c = 0xFFFFFF;       // White caps
                else if (r > 0.9) c = 0x4499FF; 
                else if (r > 0.7) c = 0x3399FF;
                else if (r < 0.1) c = 0x1166DD;
                
                let y = (c === 0xFFFFFF) ? 1 : 0; // Raise white caps slightly
                addVoxel(x, y, z, c);
            }
        }

        // B. Harbor / Dock
        for (let x = 5; x <= 18; x++) {
            for (let z = -15; z <= 12; z++) {
                let color = (z % 2 === 0) ? 0x6B4423 : 0x5C3A1C; // Alternating planks
                addVoxel(x, 3, z, color);
                
                // Dock support pillars
                if (x % 4 === 1 && z % 4 === 1) {
                    addVoxel(x, 1, z, 0x3D2400);
                    addVoxel(x, 2, z, 0x3D2400);
                }
            }
        }

        // C. Lighthouse
        function buildLighthouse(cx, cy, cz) {
            // Base
            for (let x = 0; x < 4; x++) 
                for (let z = 0; z < 4; z++) 
                    addVoxel(cx+x, cy, cz+z, 0x777777);
            
            // Tower
            for (let y = 1; y <= 8; y++) {
                let color = (y % 2 === 0) ? 0xFFFFFF : 0xFF3333;
                for (let x = 0; x < 3; x++) 
                    for (let z = 0; z < 3; z++) 
                        addVoxel(cx+x, cy+y, cz+z, color);
            }
            
            // Light room
            for (let y = 9; y <= 10; y++) {
                for (let x = 0; x < 3; x++) 
                    for (let z = 0; z < 3; z++) 
                        addVoxel(cx+x, cy+y, cz+z, 0xFFFF66);
            }
            
            // Roof & peak
            for (let x = 0; x < 3; x++) 
                for (let z = 0; z < 3; z++) 
                    addVoxel(cx+x, cy+11, cz+z, 0xFF3333);
            addVoxel(cx+1, cy+12, cz+1, 0xFF3333);
            
            // Lighthouse Flag
            addVoxel(cx+1, cy+13, cz+1, 0x888888); // Pole
            addVoxel(cx+1, cy+14, cz+1, 0x888888);
            addVoxel(cx+2, cy+14, cz+1, 0xFF3333); // Flag
            addVoxel(cx+3, cy+14, cz+1, 0xFF3333);
        }
        buildLighthouse(15, 4, -12);

        // D. Cargo & Details
        function buildCrate(cx, cy, cz) {
            for (let x = 0; x < 2; x++) 
                for (let y = 0; y < 2; y++) 
                    for (let z = 0; z < 2; z++)
                        addVoxel(cx+x, cy+y, cz+z, 0xCDA434);
        }
        buildCrate(8, 4, -6);
        buildCrate(10, 4, -5);
        buildCrate(8, 6, -6); // Stacked crate

        function buildBarrel(cx, cy, cz) {
            addVoxel(cx, cy, cz, 0x8B4513);
            addVoxel(cx, cy+1, cz, 0x8B4513);
        }
        buildBarrel(13, 4, 2);
        buildBarrel(14, 4, 3);
        buildBarrel(13, 4, 4);

        // Rowboat tied to dock
        for (let x = 10; x <= 12; x++) {
            for (let z = 6; z <= 9; z++) {
                if (x === 10 || x === 12 || z === 6 || z === 9) addVoxel(x, 2, z, 0x654321);
                else addVoxel(x, 1, z, 0x543210);
            }
        }
        addVoxel(11, 3, 7, 0xCDA434); // Oars
        addVoxel(11, 3, 8, 0xCDA434);

        // E. The Sailing Ship
        // Hull (z=7 is the front bow, z=-7 is the back stern)
        for (let z = -7; z <= 7; z++) {
            let w = 0;
            if (z === 7) w = 1;
            else if (z === 6) w = 2;
            else if (z === 5) w = 3;
            else if (z === 4) w = 4;
            else if (z >= -5) w = 4;
            else if (z === -6) w = 3;
            else if (z === -7) w = 2;

            for (let x = -w; x <= w; x++) {
                if (Math.abs(x) <= w-1 && z >= -6 && z <= 6) addVoxel(x, 1, z, 0x2B1600); // Bottom
                if (Math.abs(x) <= w && z >= -7 && z <= 7) addVoxel(x, 2, z, 0x4A2E00);   // Mid hull
                addVoxel(x, 3, z, 0x5C3A00);                                              // Upper hull
                addVoxel(x, 4, z, 0x8B5A2B);                                              // Deck
                
                // Railings
                if (Math.abs(x) === w || z === 7 || z === -7) addVoxel(x, 5, z, 0x5C3A00);
            }
        }

        // Mast & Crow's Nest
        for (let y = 5; y <= 25; y++) addVoxel(0, y, 0, 0x4A2E00);
        for (let x = -1; x <= 1; x++) 
            for (let z = -1; z <= 1; z++) 
                addVoxel(x, 20, z, 0x3D2400);

        // Sails (Main & Top sails sit behind the mast, Jib sits in front)
        for (let y = 11; y <= 19; y++) { // Main sail
            for (let x = -4; x <= 4; x++) {
                let z = -1 - Math.floor(Math.abs(x) / 2);
                addVoxel(x, y, z, 0xEEEEEE);
            }
        }
        for (let y = 21; y <= 24; y++) { // Top sail
            for (let x = -2; x <= 2; x++) {
                let z = -1 - Math.floor(Math.abs(x) / 2);
                addVoxel(x, y, z, 0xDDDDDD);
            }
        }
        for (let y = 8; y <= 18; y++) { // Jib sail
            let maxZ = Math.floor((y - 7) * 0.5) + 1;
            for (let z = 1; z <= maxZ; z++) addVoxel(0, y, z, 0xEEEEEE);
        }

        // Ship Flag
        addVoxel(1, 25, 0, 0xFF3333);
        addVoxel(2, 25, 0, 0xFF3333);
        addVoxel(1, 24, 0, 0xFF3333);

        // Captain's Cabin
        for (let x = -2; x <= 2; x++) 
            for (let z = -6; z <= -5; z++) 
                addVoxel(x, 5, z, 0x8B5A2B);
        addVoxel(0, 6, -6, 0x55AAFF); // Window

        // Mooring Ropes
        addVoxel(5, 5, -4, 0xDDDDDD);
        addVoxel(6, 4, -4, 0xDDDDDD);
        addVoxel(5, 5, 4, 0xDDDDDD);
        addVoxel(6, 4, 4, 0xDDDDDD);

        // Seagulls
        function addSeagull(x, y, z) {
            addVoxel(x, y, z, 0xFFFFFF);
            addVoxel(x-1, y+1, z, 0xFFFFFF);
            addVoxel(x+1, y+1, z, 0xFFFFFF);
        }
        addSeagull(-5, 15, -5);
        addSeagull(-8, 18, -2);
        addSeagull(0, 22, -8);

        // --- 5. Render Voxels Using InstancedMesh ---
        // Using InstancedMesh allows us to render thousands of cubes with 1 draw call
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshLambertMaterial({ color: 0xffffff }); 
        const instancedMesh = new THREE.InstancedMesh(geometry, material, voxels.length);
        
        instancedMesh.castShadow = true;
        instancedMesh.receiveShadow = true;

        const dummy = new THREE.Object3D();
        const colorObj = new THREE.Color();

        for (let i = 0; i < voxels.length; i++) {
            const v = voxels[i];
            dummy.position.set(v.x, v.y, v.z);
            dummy.updateMatrix();
            instancedMesh.setMatrixAt(i, dummy.matrix);
            instancedMesh.setColorAt(i, colorObj.setHex(v.color));
        }
        
        instancedMesh.instanceMatrix.needsUpdate = true;
        if (instancedMesh.instanceColor) instancedMesh.instanceColor.needsUpdate = true;
        scene.add(instancedMesh);

        // --- 6. Animation & Resize Loop ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // Required for damping
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
