<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Sailing Ship Calling at a Harbor</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; height:100%; background:#0e2233; }
  #app { position:fixed; inset:0; }
  .hud {
    position:fixed; top:16px; left:16px; z-index:10; pointer-events:none;
    color:#f4f1e8; font-family: Georgia, 'Times New Roman', serif;
    background:rgba(12, 28, 42, 0.55); border:1px solid rgba(255,255,255,0.18);
    border-radius:10px; padding:12px 16px; backdrop-filter: blur(6px); max-width:340px;
  }
  .hud h1 { font-size:17px; margin:0 0 6px; letter-spacing:0.4px; font-weight:600; }
  .hud p { font-size:12px; line-height:1.5; margin:0; opacity:0.82; }
  .hint {
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:10;
    color:#eaf2f8; font-family: Georgia, serif; font-size:12px; letter-spacing:0.3px;
    background:rgba(12, 28, 42, 0.45); border:1px solid rgba(255,255,255,0.14);
    border-radius:999px; padding:7px 18px; pointer-events:none; white-space:nowrap;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div class="hud">
  <h1>A Sailing Ship Calling at a Harbor</h1>
  <p>Voxel diorama: hull, square sails, pier, warehouse and lighthouse — all in one file.</p>
</div>
<div class="hint">Drag to orbit &nbsp;·&nbsp; Scroll to zoom &nbsp;·&nbsp; Right-drag to pan</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------- deterministic random ---------------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rand = mulberry32(20240613);
function jitterColor(hex, amt=0.045){
  const c = new THREE.Color(hex);
  const hsl = {}; c.getHSL(hsl);
  hsl.l = Math.min(0.95, Math.max(0.08, hsl.l + (rand()-0.5)*amt));
  hsl.h = (hsl.h + (rand()-0.5)*0.02 + 1) % 1;
  hsl.s = Math.min(1, Math.max(0, hsl.s + (rand()-0.5)*0.05));
  c.setHSL(hsl.h, hsl.s, hsl.l);
  return c;
}

/* ---------------- renderer / scene / camera ---------------- */
const container = document.getElementById('app');
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfe0ec, 70, 160);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 500);
camera.position.set(26, 16, 28);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(2, 2.5, -1);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 12;
controls.maxDistance = 95;
controls.maxPolarAngle = 1.46;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.addEventListener('start', () => controls.autoRotate = false);

/* ---------------- lights ---------------- */
scene.add(new THREE.HemisphereLight(0xcfe4ff, 0x2e5a78, 0.8));

const sun = new THREE.DirectionalLight(0xfff0d6, 2.6);
sun.position.set(30, 38, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -45; sun.shadow.camera.right = 45;
sun.shadow.camera.top = 45; sun.shadow.camera.bottom = -45;
sun.shadow.camera.near = 5; sun.shadow.camera.far = 120;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 1.2;
scene.add(sun, sun.target);

const fill = new THREE.DirectionalLight(0xbdd8ff, 0.4);
fill.position.set(-25, 18, -30);
scene.add(fill);

/* ---------------- sky dome & sun ---------------- */
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(150, 32, 20),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite:false, fog:false,
    uniforms: {
      top:    { value: new THREE.Color(0x3a7bd5) },
      mid:    { value: new THREE.Color(0xcfe4f2) },
      bottom: { value: new THREE.Color(0x3d6a88) }
    },
    vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `uniform vec3 top; uniform vec3 mid; uniform vec3 bottom; varying vec3 vDir;
      void main(){
        float h = vDir.y;
        vec3 c = h > 0.0 ? mix(mid, top, pow(h, 0.55)) : mix(mid, bottom, pow(-h, 0.5));
        gl_FragColor = vec4(c, 1.0);
      }`
  })
);
scene.add(sky);

/* ---------------- voxel factory ---------------- */
function makeVoxelMesh(list, { material } = {}){
  const geo = new THREE.BoxGeometry(1,1,1);
  const mat = material || new THREE.MeshStandardMaterial({ roughness:0.85, metalness:0.02 });
  const mesh = new THREE.InstancedMesh(geo, mat, list.length);
  const m = new THREE.Matrix4(), p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3();
  list.forEach((v,i)=>{
    p.set(v.x, v.y, v.z);
    s.setScalar(v.s ?? 1);
    q.identity();
    m.compose(p, q, s);
    mesh.setMatrixAt(i, m);
    if (v.color) mesh.setColorAt(i, v.color);
  });
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
}

/* ---------------- static voxels ---------------- */
const staticVoxels = [];
const V = (x,y,z,color,amt=0.045) => staticVoxels.push({ x, y, z, color: jitterColor(color, amt), s:1 });
function box(x0,y0,z0,x1,y1,z1,color,amt=0.045){
  for (let x=x0;x<=x1;x++) for (let y=y0;y<=y1;y++) for (let z=z0;z<=z1;z++) V(x,y,z,color,amt);
}

/* quay (left strip of land, facing water at +z) */
for (let x=-26;x<=26;x++) for (let z=-20;z<=-10;z++){
  let c = '#a9adb1';
  if (z===-10) c = '#cfd0cb';        // light edge row
  else if (z===-11) c = '#dfb44e';   // yellow safety line
  V(x,2,z,c,0.05);
}
box(-26,0,-10, 26,1,-10, '#787e84', 0.05);   // front wall
box(-26,0,-20, -26,1,-10, '#787e84', 0.05);  // left cap
box(26,0,-20, 26,1,-10, '#787e84', 0.05);    // right cap

/* pier */
for (let x=-2;x<=2;x++) for (let z=-10;z<=-4;z++)
  V(x,2,z, (x===-2||x===2) ? '#6f5432' : '#8a6a42', 0.06);
for (const px of [-2,2]) for (const pz of [-9,-7,-5]) for (const py of [0,1])
  V(px,py,pz,'#4a3423',0.05);

/* lamp posts */
function lampPost(x,z){
  for (const y of [3,4,5]) V(x,y,z,'#2f3438',0.03);
  V(x,6,z,'#ffd97a',0.02);
}
lampPost(1,-4); lampPost(-2,-12); lampPost(14,-12);

/* crates & barrels */
V(-5,3,-13,'#a87c3f',0.07); V(-6,3,-13,'#a87c3f',0.07); V(-5,4,-13,'#b98a4a',0.07);
V(-8,3,-13,'#6f4a2c',0.05); V(-9,3,-13,'#6f4a2c',0.05);

/* warehouse */
for (let x=-15;x<=-7;x++) for (let z=-18;z<=-13;z++) for (let y=3;y<=6;y++){
  let c;
  if (z===-13 && x>=-11 && x<=-10 && y<=5) c='#463022';          // door
  else if (z===-13 && (x===-14||x===-8) && y===5) c='#ffd97a';   // windows
  else if (x===-15 && z===-16 && y===5) c='#ffd97a';             // side window
  else c='#a85a44';
  V(x,y,z,c,0.06);
}
box(-14,7,-17, -8,7,-14, '#454a56', 0.05);
box(-13,8,-16, -9,8,-15, '#3c414d', 0.05);

/* lighthouse */
const rockSpots = [[18,-17],[19,-17],[20,-17],[21,-17],[22,-17],[18,-16],[22,-16],
                   [18,-15],[22,-15],[18,-14],[22,-14],[18,-13],[19,-13],[20,-13],[21,-13],[22,-13]];
for (const [rx,rz] of rockSpots) V(rx,3,rz,'#6f757c',0.10);
for (let y=4;y<=10;y++){
  const white = (y<=5)||(y===8||y===9);
  const c = white ? '#efe6d0' : '#c0392b';
  for (let x=19;x<=21;x++) for (let z=-16;z<=-14;z++) V(x,y,z,c,0.05);
}
box(18,11,-17, 22,11,-13, '#3a3f47', 0.05);   // gallery
V(19,13,-16,'#8e2f24',0.04); V(20,13,-16,'#8e2f24',0.04);
V(19,13,-15,'#8e2f24',0.04); V(20,13,-15,'#8e2f24',0.04);
V(20,14,-15,'#7a271d',0.03);

/* rocks in the water (right side) */
V(24,0,-4,'#6f757c',0.10); V(25,0,-3,'#6f757c',0.10); V(26,0,-4,'#6f757c',0.10);
V(25,1,-4,'#7d838a',0.10); V(24,1,-3,'#7d838a',0.10);

const staticMesh = makeVoxelMesh(staticVoxels);
scene.add(staticMesh);

/* under-quay slab (flat, to seal the gap) */
const slab = new THREE.Mesh(
  new THREE.BoxGeometry(53.4, 1.5, 11.4),
  new THREE.MeshStandardMaterial({ color:0x4a5055, roughness:0.95 })
);
slab.position.set(0,-0.55,-15);
slab.receiveShadow = true;
scene.add(slab);

/* lighthouse lamp room (emissive, animated) */
const lampList = [];
for (let x=19;x<=21;x++) for (let z=-16;z<=-14;z++)
  lampList.push({ x, y:12, z, color: new THREE.Color('#ffd75e'), s:1 });
const lampMat = new THREE.MeshStandardMaterial({ color:0xffffff, emissive:0xffc94d, emissiveIntensity:1.8, roughness:0.4 });
const lampMesh = makeVoxelMesh(lampList, { material: lampMat });
lampMesh.castShadow = false;
scene.add(lampMesh);
const lampLight = new THREE.PointLight(0xffd75e, 1.0, 14, 2);
lampLight.position.set(20, 12.5, -15);
scene.add(lampLight);

const beaconMat = new THREE.MeshStandardMaterial({ color:0xff5040, emissive:0xff3020, emissiveIntensity:2.0, roughness:0.4 });
const beacon = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.9,0.9), beaconMat);
beacon.position.set(20, 15, -15);
scene.add(beacon);

/* ---------------- water ---------------- */
const waterList = [];
const blues = ['#2e7fb8','#3585c2','#2a6da3','#3d8ecb'];
for (let x=-26;x<=26;x++) for (let z=-9;z<=18;z++){
  if (x>=-2 && x<=2 && z>=-9 && z<=-4) continue;   // pier footprint
  waterList.push({ x, z, color: jitterColor(blues[Math.floor(rand()*blues.length)], 0.07) });
}
const waterMesh = makeVoxelMesh(waterList.map(w=>({ x:w.x, y:0, z:w.z, color:w.color, s:1 })));
waterMesh.castShadow = false;
waterMesh.receiveShadow = true;
scene.add(waterMesh);

/* deep-water plane under everything */
const deep = new THREE.Mesh(
  new THREE.CircleGeometry(130, 48),
  new THREE.MeshStandardMaterial({ color:0x1c4e70, roughness:1 })
);
deep.rotation.x = -Math.PI/2;
deep.position.y = -0.65;
scene.add(deep);

/* ---------------- sun (voxel cluster) ---------------- */
const sunList = [];
for (let x=-2;x<=2;x++) for (let y=-2;y<=2;y++){
  const edge = Math.abs(x)===2 || Math.abs(y)===2;
  sunList.push({ x:x*2.3, y:y*2.3, z:0, color:new THREE.Color(edge?'#ffdf7e':'#fff6c8'), s:2.0 });
}
const sunMesh = makeVoxelMesh(sunList, { material: new THREE.MeshBasicMaterial({ color:0xffffff }) });
sunMesh.castShadow = false; sunMesh.receiveShadow = false;
sunMesh.position.set(38, 49, 26);
scene.add(sunMesh);

/* ---------------- ship ---------------- */
const shipGroup = new THREE.Group();
shipGroup.position.set(6, 0.15, 2);

const shipVoxels = [];
const S = (x,y,z,color,amt=0.05) => shipVoxels.push({ x, y, z, color: jitterColor(color, amt), s:1 });
const hullWidth = x => (x===-7||x===7) ? [0,0] : (x<=-5||x>=5) ? [-1,1] : [-2,2];

for (let x=-5;x<=5;x++){
  const [z0,z1] = (x===-5||x===5) ? [0,0] : [-1,1];
  for (let z=z0;z<=z1;z++) S(x,0,z,'#241f1b',0.06);
}
for (let x=-7;x<=7;x++){
  const [z0,z1] = hullWidth(x);
  for (let z=z0;z<=z1;z++) S(x,1,z,'#6e4526',0.07);
}
for (let x=-7;x<=7;x++){
  const [z0,z1] = hullWidth(x);
  for (let z=z0;z<=z1;z++){
    const isRim = (z===z0||z===z1||x===-7||x===7);
    S(x,2,z, isRim ? '#3a2716' : '#c69a58', isRim?0.04:0.05);
  }
}
for (let x=-7;x<=-5;x++) for (let z=-1;z<=1;z++) S(x,3,z,'#5a3820',0.06);   // stern castle
S(6,3,0,'#5a3820',0.06); S(7,3,0,'#5a3820',0.06);                          // forecastle
S(-6,4,0,'#ffd75e',0.03);                                                  // stern lantern
S(8,3,0,'#5a3820',0.04); S(9,3,0,'#5a3820',0.04); S(10,4,0,'#5a3820',0.04); // bowsprit

for (let y=3;y<=10;y++) S(3,y,0,'#7a4e2a',0.05);      // fore mast
for (let y=3;y<=11;y++) S(-2,y,0,'#7a4e2a',0.05);     // main mast
for (let z=-2;z<=2;z++) S(3,9,z,'#7a4e2a',0.04);
for (let z=-3;z<=3;z++) S(3,6,z,'#7a4e2a',0.04);
for (let z=-2;z<=2;z++) S(-2,10,z,'#7a4e2a',0.04);
for (let z=-3;z<=3;z++) S(-2,7,z,'#7a4e2a',0.04);

const shipMesh = makeVoxelMesh(shipVoxels);
shipGroup.add(shipMesh);

/* pennants (separate so they can wave) */
function makePennant(mx,my){
  const g = new THREE.Group();
  g.position.set(mx,my,0);
  const mat = new THREE.MeshStandardMaterial({ color:0xd64541, roughness:0.7 });
  const c1 = new THREE.Mesh(new THREE.BoxGeometry(1,0.55,0.55), mat); c1.position.set(-0.7,0,0);
  const c2 = new THREE.Mesh(new THREE.BoxGeometry(0.8,0.35,0.35), mat); c2.position.set(-1.6,-0.05,0);
  c1.castShadow = c2.castShadow = true;
  g.add(c1,c2);
  return g;
}
const pennantFore = makePennant(3,10);
const pennantMain = makePennant(-2,11);
shipGroup.add(pennantFore, pennantMain);

/* sails (separate pivots so they can sway) */
const sails = [];
const sailDefs = [
  { px:3, py:9,  rows:[{y:-1,x:0,z0:-2,z1:2},{y:-2,x:-1,z0:-2,z1:2}] },
  { px:3, py:6,  rows:[{y:-1,x:0,z0:-3,z1:3},{y:-2,x:-1,z0:-3,z1:3},{y:-3,x:-1,z0:-3,z1:3}] },
  { px:-2, py:10, rows:[{y:-1,x:0,z0:-2,z1:2},{y:-2,x:-1,z0:-2,z1:2}] },
  { px:-2, py:7,  rows:[{y:-1,x:0,z0:-3,z1:3},{y:-2,x:-1,z0:-3,z1:3},{y:-3,x:-1,z0:-3,z1:3}] }
];
for (const def of sailDefs){
  const list = [];
  for (const r of def.rows) for (let z=r.z0;z<=r.z1;z++)
    list.push({ x:r.x, y:r.y, z, color: jitterColor('#f2e6c8', 0.045), s:1 });
  const mesh = makeVoxelMesh(list);
  const g = new THREE.Group();
  g.position.set(def.px, def.py, 0);
  g.add(mesh);
  shipGroup.add(g);
  sails.push(g);
}
scene.add(shipGroup);

/* ---------------- rowboat ---------------- */
const boatVoxels = [];
const B = (x,y,z,color) => boatVoxels.push({ x, y, z, color: jitterColor(color,0.05), s:1 });
for (let x=-2;x<=2;x++) for (let z=-1;z<=1;z++){
  const interior = (z===0 && x>=-1 && x<=1);
  B(x,0,z, interior ? '#8a6a42' : '#4a2e1a');
}
for (let x=-2;x<=2;x++) for (let z=-1;z<=1;z++){
  const interior = (z===0 && x>=-1 && x<=1);
  if (!interior) B(x,1,z,'#4a2e1a');
}
B(0,1,0,'#a87c3f');  // oar
const boatGroup = new THREE.Group();
boatGroup.add(makeVoxelMesh(boatVoxels));
boatGroup.position.set(-4.5, 0.1, -6.5);
boatGroup.rotation.y = Math.PI/2;
scene.add(boatGroup);

/* ---------------- buoys ---------------- */
function makeBuoy(x,z,phase){
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.BoxGeometry(1.1,0.9,1.1), new THREE.MeshStandardMaterial({ color:0xe2601f, roughness:0.7 }));
  const top = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.5), new THREE.MeshStandardMaterial({ color:0xf5f0e6, roughness:0.6 }));
  top.position.y = 0.7;
  base.castShadow = true;
  g.add(base, top);
  g.position.set(x, 0.1, z);
  g.userData.phase = phase;
  scene.add(g);
  return g;
}
const buoys = [ makeBuoy(12,7,0), makeBuoy(18,4,2.1), makeBuoy(11,-7,4.2) ];

/* ---------------- clouds ---------------- */
const cloudMat  = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.9 });
const cloudMat2 = new THREE.MeshStandardMaterial({ color:0xe6ecf2, roughness:0.9 });
function makeCloud(x,y,z,seed){
  const r = mulberry32(seed);
  const g = new THREE.Group();
  const n = 7 + Math.floor(r()*4);
  for (let i=0;i<n;i++){
    const s = 1.2 + r()*2.2;
    const m = new THREE.Mesh(new THREE.BoxGeometry(s, s*0.55, s*0.8), r()<0.6 ? cloudMat : cloudMat2);
    m.position.set((r()-0.5)*5, (r()-0.5)*1.4, (r()-0.5)*2.6);
    g.add(m);
  }
  g.position.set(x,y,z);
  g.userData.speed = 0.4 + r()*0.5;
  scene.add(g);
  return g;
}
const clouds = [ makeCloud(-20,17,-10,11), makeCloud(4,20,-16,22), makeCloud(22,18,4,33),
                 makeCloud(-6,22,8,44), makeCloud(34,21,-6,55) ];

/* ---------------- gulls ---------------- */
const gullBodyGeo = new THREE.BoxGeometry(0.3,0.28,0.55);
const wingLGeo = new THREE.BoxGeometry(0.8,0.08,0.34); wingLGeo.translate(0.45,0,0);
const wingRGeo = new THREE.BoxGeometry(0.8,0.08,0.34); wingRGeo.translate(-0.45,0,0);
const gullMat = new THREE.MeshStandardMaterial({ color:0xf4f6f8, roughness:0.8 });
function makeGull(i){
  const g = new THREE.Group();
  const body = new THREE.Mesh(gullBodyGeo, gullMat);
  const wL = new THREE.Mesh(wingLGeo, gullMat);
  const wR = new THREE.Mesh(wingRGeo, gullMat);
  body.castShadow = wL.castShadow = wR.castShadow = true;
  g.add(body, wL, wR);
  g.userData = { wL, wR, phase:i*2.1, radius:6.5+i*1.8, speed:0.32+i*0.05, height:10.5+i*1.6, cx:5, cz:0 };
  scene.add(g);
  return g;
}
const gulls = [ makeGull(0), makeGull(1), makeGull(2) ];

/* ---------------- animation ---------------- */
const clock = new THREE.Clock();
const tempM = new THREE.Matrix4();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  controls.update();

  /* water */
  for (let i=0;i<waterList.length;i++){
    const w = waterList[i];
    tempM.makeTranslation(w.x, Math.sin(t*1.35 + w.x*0.5 + w.z*0.55)*0.13, w.z);
    waterMesh.setMatrixAt(i, tempM);
  }
  waterMesh.instanceMatrix.needsUpdate = true;

  /* ship */
  shipGroup.position.y = 0.15 + Math.sin(t*0.8)*0.16;
  shipGroup.rotation.z = Math.sin(t*0.6)*0.028;
  shipGroup.rotation.x = Math.sin(t*0.45+1.3)*0.02;
  sails.forEach((g,i)=>{ g.rotation.z = Math.sin(t*0.9 + i*1.7)*0.06; });
  pennantFore.rotation.y = Math.sin(t*2.3)*0.45;
  pennantMain.rotation.y = Math.sin(t*2.0+1.2)*0.45;

  /* buoys & boat */
  for (const b of buoys){
    const p = b.userData.phase;
    b.position.y = 0.12 + Math.sin(t*1.5+p)*0.14;
    b.rotation.z = Math.sin(t*1.2+p)*0.12;
    b.rotation.x = Math.cos(t*0.9+p)*0.10;
  }
  boatGroup.position.y = 0.1 + Math.sin(t*1.1)*0.13;
  boatGroup.rotation.x = Math.sin(t*0.9)*0.045;
  boatGroup.rotation.z = Math.sin(t*0.7+1)*0.05;

  /* clouds */
  for (const c of clouds){
    c.position.x += c.userData.speed*dt;
    if (c.position.x > 62) c.position.x = -62;
  }

  /* gulls */
  for (const g of gulls){
    const u = g.userData;
    const a = t*u.speed + u.phase;
    const px = u.cx + Math.cos(a)*u.radius;
    const pz = u.cz + Math.sin(a)*u.radius;
    const py = u.height + Math.sin(t*1.7+u.phase)*0.5;
    const na = a + 0.06;
    g.position.set(px,py,pz);
    g.lookAt(u.cx + Math.cos(na)*u.radius, py, u.cz + Math.sin(na)*u.radius);
    const flap = Math.sin(t*9 + u.phase)*0.6;
    u.wL.rotation.z = flap;
    u.wR.rotation.z = flap;
  }

  /* lighthouse */
  lampMat.emissiveIntensity = 1.5 + Math.sin(t*2.6)*1.0;
  lampLight.intensity = 0.9 + Math.sin(t*2.6)*0.5;
  beaconMat.emissiveIntensity = 1.4 + Math.sin(t*4.2)*1.1;

  renderer.render(scene, camera);
}
animate();

/* ---------------- resize ---------------- */
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
