<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>マイクラ風3D箱庭</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    canvas {
      display: block;
    }

    #ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    #menu {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.58);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      pointer-events: auto;
      padding: 20px;
      text-align: center;
    }

    #menu h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0.5px;
    }

    #menu p {
      margin: 0;
      opacity: 0.9;
      max-width: 460px;
      line-height: 1.55;
      font-size: 14px;
    }

    #playBtn {
      pointer-events: auto;
      padding: 12px 22px;
      border: 0;
      border-radius: 10px;
      background: #1f8a4c;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    #playBtn:hover {
      background: #23a35d;
    }

    #hud {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      display: none;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
    }

    #info {
      background: rgba(0, 0, 0, 0.48);
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 14px;
      white-space: pre-line;
      backdrop-filter: blur(4px);
    }

    #hotbar {
      display: flex;
      gap: 6px;
      pointer-events: auto;
    }

    .slot {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      border: 2px solid rgba(255,255,255,0.28);
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      opacity: 0.8;
    }

    .slot.active {
      opacity: 1;
      border-color: white;
      box-shadow: 0 0 12px rgba(255,255,255,0.45);
      transform: translateY(-4px);
    }

    #crosshair {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 22px;
      height: 22px;
      opacity: 0.9;
      display: none;
    }

    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: white;
    }

    #crosshair::before {
      left: 10px;
      top: 0;
      width: 2px;
      height: 22px;
    }

    #crosshair::after {
      left: 0;
      top: 10px;
      width: 22px;
      height: 2px;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div id="menu">
      <h1>マイクラ風 3D箱庭</h1>
      <p>
        WASD 移動 / Space ジャンプ<br>
        左クリック: ブロックを掘る<br>
        右クリック: ブロックを置く<br>
        1〜6: ブロック種類切り替え<br>
        Esc: ポインター解除
      </p>
      <button id="playBtn">ゲーム開始</button>
    </div>

    <div id="hud">
      <div id="info"></div>
      <div id="hotbar"></div>
    </div>

    <div id="crosshair"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
  <script>
    /*
      マイクラス風3D箱庭ゲーム
      - 1ファイル
      - Three.js CDN
      - WASD / Space
      - 左クリックで掘る
      - 右クリックで置く
    */

    const WORLD_X = 64;
    const WORLD_Z = 64;
    const WORLD_Y = 32;

    const PLAYER_RADIUS = 0.3;
    const PLAYER_HALF_HEIGHT = 0.9;
    const GRAVITY = 24.0;
    const JUMP_VELOCITY = 8.0;
    const REACH_DISTANCE = 5.0;

    const BLOCK_TYPES = {
      1: { name: "Grass", color: 0x5cb561 },
      2: { name: "Dirt",  color: 0x8a5b32 },
      3: { name: "Stone", color: 0x8b8b8b },
      4: { name: "Log",   color: 0x593c22 },
      5: { name: "Leaf",  color: 0x3f8f45 },
      6: { name: "Sand",  color: 0xd8c99c }
    };

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x8ec5e6);
    scene.fog = new THREE.Fog(0x8ec5e6, 28, 72);

    const camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.rotation.order = "YXZ";

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const ambient = new THREE.AmbientLight(0xffffff, 0.58);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xffffff, 1.15);
    sun.position.set(25, 50, 15);
    scene.add(sun);

    const blocks = new Map();

    function key(x, y, z) {
      return x + "," + y + "," + z;
    }

    function isInsideWorld(x, y, z) {
      return x >= 0 && x < WORLD_X && y >= 0 && y < WORLD_Y && z >= 0 && z < WORLD_Z;
    }

    function getBlock(x, y, z) {
      if (y < 0) return 99; // 地面（bedrock-like）
      return blocks.get(key(x, y, z));
    }

    function setBlock(x, y, z, type) {
      if (!isInsideWorld(x, y, z)) return;

      const k = key(x, y, z);
      if (type === 0) {
        blocks.delete(k);
      } else {
        blocks.set(k, type);
      }
    }

    function neighborHasBlock(x, y, z) {
      if (y < 0) return true;
      return blocks.has(key(x, y, z));
    }

    function isExposed(x, y, z) {
      return (
        !neighborHasBlock(x + 1, y, z) ||
        !neighborHasBlock(x - 1, y, z) ||
        !neighborHasBlock(x, y + 1, z) ||
        !neighborHasBlock(x, y - 1, z) ||
        !neighborHasBlock(x, y, z + 1) ||
        !neighborHasBlock(x, y, z - 1)
      );
    }

    function hash2(x, z) {
      let n = (x * 374761393 + z * 668265263) | 0;
      n = ((n ^ (n >> 13)) * 1274126177) | 0;
      return ((n ^ (n >> 16)) >>> 0);
    }

    function heightAt(x, z) {
      const a = Math.sin(x * 0.17 + 1.2) * 4.0;
      const b = Math.sin(z * 0.13 - 4.1) * 4.0;
      const c = Math.sin((x + z) * 0.07) * 2.5;
      const d = Math.sin((x - z) * 0.11) * 1.5;

      let h = 8 + a + b + c + d;
      h = Math.max(2, Math.min(WORLD_Y - 8, Math.floor(h)));
      return h;
    }

    function generateWorld() {
      for (let x = 0; x < WORLD_X; x++) {
        for (let z = 0; z < WORLD_Z; z++) {
          const h = heightAt(x, z);

          for (let y = 0; y < h; y++) {
            let type;

            if (y === h - 1) {
              if (h <= 4) {
                type = 6; // Sand
              } else {
                type = 1; // Grass
              }
            } else if (y >= h - 3) {
              type = 2; // Dirt
            } else {
              type = 3; // Stone
            }

            blocks.set(key(x, y, z), type);
          }
        }
      }

      // 木を増やす
      for (let x = 2; x < WORLD_X - 2; x += 2) {
        for (let z = 2; z < WORLD_Z - 2; z += 2) {
          if ((hash2(x, z) % 1000) > 28) continue;

          const h = heightAt(x, z);
          if (h <= 4) continue;

          const top = h - 1;

          // 幹
          for (let dy = 1; dy <= 3; dy++) {
            setBlock(x, top + dy, z, 4);
          }

          // 葉
          const leafCenterY = top + 3;
          for (let dx = -2; dx <= 2; dx++) {
            for (let dz = -2; dz <= 2; dz++) {
              for (let dy = -1; dy <= 2; dy++) {
                const y = leafCenterY + dy;
                const dist = Math.abs(dx) + Math.abs(dz) + Math.abs(dy);

                if (dist <= 3) {
                  setBlock(x + dx, y, z + dz, 5);
                }
              }
            }
          }
        }
      }
    }

    const boxGeometry = new THREE.BoxGeometry(1, 1, 1);
    const boxMaterial = new THREE.MeshLambertMaterial({ color: 0xffffff });

    let instanceCapacity = 80000;
    let blocksMesh = new THREE.InstancedMesh(boxGeometry, boxMaterial, instanceCapacity);
    blocksMesh.frustumCulled = false;
    scene.add(blocksMesh);

    const dummy = new THREE.Object3D();
    const tmpColor = new THREE.Color();
    let instanceBlocks = [];

    function rebuildInstancedMesh() {
      const visible = [];

      for (let x = 0; x < WORLD_X; x++) {
        for (let z = 0; z < WORLD_Z; z++) {
          for (let y = 0; y < WORLD_Y; y++) {
            const type = blocks.get(key(x, y, z));
            if (type === undefined) continue;

            if (isExposed(x, y, z)) {
              visible.push({ x, y, z, type });
            }
          }
        }
      }

      if (visible.length > instanceCapacity) {
        scene.remove(blocksMesh);
        instanceCapacity = visible.length + 10000;
        blocksMesh = new THREE.InstancedMesh(boxGeometry, boxMaterial, instanceCapacity);
        blocksMesh.frustumCulled = false;
        scene.add(blocksMesh);
      }

      instanceBlocks = visible;
      blocksMesh.count = visible.length;

      for (let i = 0; i < visible.length; i++) {
        const b = visible[i];

        dummy.position.set(b.x, b.y, b.z);
        dummy.rotation.set(0, 0, 0);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();

        blocksMesh.setMatrixAt(i, dummy.matrix);

        tmpColor.setHex(BLOCK_TYPES[b.type].color);
        blocksMesh.setColorAt(i, tmpColor);
      }

      blocksMesh.instanceMatrix.needsUpdate = true;
      if (blocksMesh.instanceColor) {
        blocksMesh.instanceColor.needsUpdate = true;
      }
    }

    const raycaster = new THREE.Raycaster();
    raycaster.far = REACH_DISTANCE;
    const centerPoint = new THREE.Vector2(0, 0);

    const highlightGeometry = new THREE.EdgesGeometry(new THREE.BoxGeometry(1.015, 1.015, 1.015));
    const highlightMaterial = new THREE.LineBasicMaterial({
      color: 0x000000,
      transparent: true,
      opacity: 0.55
    });
    const highlight = new THREE.LineSegments(highlightGeometry, highlightMaterial);
    highlight.visible = false;
    scene.add(highlight);

    function raycastTarget() {
      raycaster.setFromCamera(centerPoint, camera);
      const hits = raycaster.intersectObject(blocksMesh);
      if (hits.length > 0 && hits[0].distance <= REACH_DISTANCE) {
        return hits[0];
      }
      return null;
    }

    function mineBlock() {
      const hit = raycastTarget();
      if (!hit) return;

      const target = instanceBlocks[hit.instanceId];
      if (!target) return;

      setBlock(target.x, target.y, target.z, 0);
      rebuildInstancedMesh();
    }

    function blockOverlapsPlayer(x, y, z) {
      const px = player.pos.x;
      const py = player.pos.y;
      const pz = player.pos.z;

      const minX = px - PLAYER_RADIUS;
      const maxX = px + PLAYER_RADIUS;
      const minY = py - PLAYER_HALF_HEIGHT;
      const maxY = py + PLAYER_HALF_HEIGHT;

      const bMinX = x - 0.5;
      const bMaxX = x + 0.5;
      const bMinY = y - 0.5;
      const bMaxY = y + 0.5;
      const bMinZ = z - 0.5;
      const bMaxZ = z + 0.5;

      const minZ = pz - PLAYER_RADIUS;
      const maxZ = pz + PLAYER_RADIUS;

      return (
        minX < bMaxX && maxX > bMinX &&
        minY < bMaxY && maxY > bMinY &&
        minZ < bMaxZ && maxZ > bMinZ
      );
    }

    function placeBlock() {
      const hit = raycastTarget();
      if (!hit) return;

      const target = instanceBlocks[hit.instanceId];
      if (!target) return;

      const n = hit.face ? hit.face.normal : null;
      if (!n) return;

      const nx = Math.round(n.x);
      const ny = Math.round(n.y);
      const nz = Math.round(n.z);

      if (nx === 0 && ny === 0 && nz === 0) return;

      const tx = target.x + nx;
      const ty = target.y + ny;
      const tz = target.z + nz;

      if (!isInsideWorld(tx, ty, tz)) return;
      if (blocks.has(key(tx, ty, tz))) return;

      if (blockOverlapsPlayer(tx, ty, tz)) return;

      setBlock(tx, ty, tz, selectedBlock);
      rebuildInstancedMesh();
    }

    const player = {
      pos: new THREE.Vector3(32.5, 40, 32.5),
      vel: new THREE.Vector3(0, 0, 0),
      onGround: false
    };

    let yaw = 0;
    let pitch = 0;
    let selectedBlock = 1;
    let locked = false;

    const keys = {};

    window.addEventListener("keydown", (e) => {
      if (["Space", "KeyW", "KeyA", "KeyS", "KeyD"].includes(e.code)) {
        e.preventDefault();
      }

      if (e.key >= "1" && e.key <= "6") {
        setSelectedBlock(parseInt(e.key, 10));
      }

      keys[e.code] = true;
    });

    window.addEventListener("keyup", (e) => {
      keys[e.code] = false;
    });

    const menuEl = document.getElementById("menu");
    const hudEl = document.getElementById("hud");
    const crosshairEl = document.getElementById("crosshair");
    const infoEl = document.getElementById("info");
    const hotbarEl = document.getElementById("hotbar");

    for (let i = 1; i <= 6; i++) {
      const slot = document.createElement("div");
      slot.className = "slot";
      slot.style.background = "#" + BLOCK_TYPES[i].color.toString(16).padStart(6, "0");
      slot.title = BLOCK_TYPES[i].name;
      hotbarEl.appendChild(slot);
    }

    function setSelectedBlock(i) {
      selectedBlock = i;

      const slots = document.querySelectorAll(".slot");
      slots.forEach((el, idx) => {
        el.classList.toggle("active", idx === i - 1);
      });
    }

    setSelectedBlock(1);

    document.getElementById("playBtn").addEventListener("click", () => {
      renderer.domElement.requestPointerLock();
    });

    document.addEventListener("pointerlockchange", () => {
      locked = document.pointerLockElement === renderer.domElement;

      if (locked) {
        menuEl.style.display = "none";
        hudEl.style.display = "flex";
        crosshairEl.style.display = "block";
      } else {
        menuEl.style.display = "flex";
        hudEl.style.display = "none";
        crosshairEl.style.display = "none";
      }
    });

    document.addEventListener("mousemove", (e) => {
      if (!locked) return;

      yaw -= e.movementX * 0.0025;
      pitch -= e.movementY * 0.0025;

      pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, pitch));
    });

    renderer.domElement.addEventListener("mousedown", (e) => {
      if (!locked) return;

      if (e.button === 0) {
        mineBlock();
      } else if (e.button === 2) {
        placeBlock();
      }
    });

    renderer.domElement.addEventListener("contextmenu", (e) => {
      e.preventDefault();
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function collidesAt(pos) {
      const minX = pos.x - PLAYER_RADIUS;
      const maxX = pos.x + PLAYER_RADIUS;
      const minY = pos.y - PLAYER_HALF_HEIGHT;
      const maxY = pos.y + PLAYER_HALF_HEIGHT;
      const minZ = pos.z - PLAYER_RADIUS;
      const maxZ = pos.z + PLAYER_RADIUS;

      const x0 = Math.floor(minX - 0.5);
      const x1 = Math.ceil(maxX + 0.5);
      const y0 = Math.floor(minY - 0.5);
      const y1 = Math.ceil(maxY + 0.5);
      const z0 = Math.floor(minZ - 0.5);
      const z1 = Math.ceil(maxZ + 0.5);

      for (let x = x0; x <= x1; x++) {
        for (let y = y0; y <= y1; y++) {
          for (let z = z0; z <= z1; z++) {
            if (y < 0 || blocks.has(key(x, y, z))) {
              const bMinX = x - 0.5;
              const bMaxX = x + 0.5;
              const bMinY = y - 0.5;
              const bMaxY = y + 0.5;
              const bMinZ = z - 0.5;
              const bMaxZ = z + 0.5;

              if (
                minX < bMaxX && maxX > bMinX &&
                minY < bMaxY && maxY > bMinY &&
                minZ < bMaxZ && maxZ > bMinZ
              ) {
                return true;
              }
            }
          }
        }
      }

      return false;
    }

    function respawn() {
      player.pos.set(32.5, 45, 32.5);
      player.vel.set(0, 0, 0);
      player.onGround = false;
    }

    function moveAxis(axis, delta) {
      const old = player.pos[axis];
      const target = old + delta;

      player.pos[axis] = target;

      if (!collidesAt(player.pos)) {
        return;
      }

      // 衝突境界まで二分探索
      let low = old;
      let high = target;

      for (let i = 0; i < 12; i++) {
        const mid = (low + high) / 2;
        player.pos[axis] = mid;

        if (!collidesAt(player.pos)) {
          low = mid;
        } else {
          high = mid;
        }
      }

      player.pos[axis] = low;

      if (axis === "y") {
        player.vel.y = 0;

        if (delta < 0) {
          player.onGround = true;
        }
      }
    }

    function updatePlayer(dt) {
      const wasOnGround = player.onGround;
      player.onGround = false;

      const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
      const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));

      const move = new THREE.Vector3();

      if (keys["KeyW"]) move.add(forward);
      if (keys["KeyS"]) move.sub(forward);
      if (keys["KeyD"]) move.add(right);
      if (keys["KeyA"]) move.sub(right);

      move.y = 0;

      if (move.lengthSq() > 0) {
        move.normalize();
      }

      const sprint = keys["ShiftLeft"] || keys["ShiftRight"];
      const speed = sprint ? 8.5 : 5.5;
      const accel = player.onGround ? 35 : 12;

      const targetVX = move.x * speed;
      const targetVZ = move.z * speed;

      player.vel.x += (targetVX - player.vel.x) * Math.min(1, accel * dt);
      player.vel.z += (targetVZ - player.vel.z) * Math.min(1, accel * dt);

      if (wasOnGround && keys["Space"]) {
        player.vel.y = JUMP_VELOCITY;
        player.onGround = false;
      }

      player.vel.y -= GRAVITY * dt;
      player.vel.y = Math.max(-35, player.vel.y);

      moveAxis("x", player.vel.x * dt);
      moveAxis("z", player.vel.z * dt);
      moveAxis("y", player.vel.y * dt);

      if (collidesAt(player.pos)) {
        respawn();
      }
    }

    function updateCamera() {
      camera.position.copy(player.pos);
      camera.position.y += 0.6;

      camera.rotation.x = pitch;
      camera.rotation.y = yaw;
      camera.rotation.z = 0;
    }

    function updateHighlight() {
      const hit = raycastTarget();

      if (hit) {
        const target = instanceBlocks[hit.instanceId];
        if (target) {
          highlight.position.set(target.x, target.y, target.z);
          highlight.visible = true;
          return;
        }
      }

      highlight.visible = false;
    }

    function updateInfo() {
      const selected = BLOCK_TYPES[selectedBlock].name;
      infoEl.textContent =
        "選択: " + selected + "\n" +
        "x: " + player.pos.x.toFixed(2) + "\n" +
        "y: " + player.pos.y.toFixed(2) + "\n" +
        "z: " + player.pos.z.toFixed(2);
    }

    generateWorld();
    rebuildInstancedMesh();
    respawn();

    let lastTime = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);

      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      if (locked) {
        updatePlayer(dt);
      }

      updateCamera();
      updateHighlight();
      updateInfo();

      renderer.render(scene, camera);
    }

    animate(performance.now());
  </script>
</body>
</html>
