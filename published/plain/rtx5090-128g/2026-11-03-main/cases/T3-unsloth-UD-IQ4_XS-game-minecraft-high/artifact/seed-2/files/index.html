<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>マイクラ風 3D 箱庭</title>
<style>
  html,body{
    margin:0;
    overflow:hidden;
    background:#87ceeb;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  canvas{display:block}
  #blocker{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.62);
    color:#fff;
    text-align:center;
    z-index:20;
  }
  #blocker h1{margin:0 0 12px;font-size:34px}
  #blocker p{margin:8px 0;font-size:15px;line-height:1.7}
  #blocker button{
    margin-top:14px;
    font-size:19px;
    padding:12px 22px;
    border:0;
    border-radius:10px;
    background:#28a745;
    color:white;
    cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,.35);
  }
  #blocker button:hover{filter:brightness(1.08)}
  #info{
    position:fixed;
    top:10px;
    left:10px;
    color:#fff;
    text-shadow:0 1px 2px #000;
    font-size:13px;
    background:rgba(0,0,0,.38);
    padding:10px 12px;
    border-radius:10px;
    line-height:1.55;
    z-index:10;
    pointer-events:none;
    user-select:none;
  }
  #crosshair{
    position:fixed;
    left:50%;
    top:50%;
    width:20px;
    height:20px;
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:5;
  }
  #crosshair:before,
  #crosshair:after{
    content:"";
    position:absolute;
    background:rgba(255,255,255,.9);
  }
  #crosshair:before{
    width:2px;
    height:20px;
    left:9px;
    top:0;
  }
  #crosshair:after{
    width:20px;
    height:2px;
    left:0;
    top:9px;
  }
  #ui{
    position:fixed;
    left:0;
    right:0;
    bottom:16px;
    display:flex;
    justify-content:center;
    pointer-events:none;
    z-index:10;
  }
  .hotbar{
    display:flex;
    gap:7px;
    background:rgba(0,0,0,.45);
    padding:9px;
    border-radius:12px;
    box-shadow:0 4px 18px rgba(0,0,0,.35);
  }
  .slot{
    width:58px;
    height:58px;
    border:3px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.08);
    border-radius:10px;
    position:relative;
    color:#fff;
    font-weight:700;
    text-shadow:0 1px 2px #000;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    text-align:center;
    pointer-events:auto;
    cursor:pointer;
    overflow:hidden;
    transition:transform .08s;
  }
  .slot:hover{transform:translateY(-2px)}
  .slot.selected{
    border-color:#fff;
    background:rgba(255,255,255,.22);
  }
  .slot .num{
    position:absolute;
    top:3px;
    left:6px;
    font-size:12px;
    opacity:.95;
  }
  .slot .swatch{
    position:absolute;
    inset:18px 8px 16px 8px;
    border-radius:6px;
    border:1px solid rgba(255,255,255,.35);
  }
  .slot .label{
    position:absolute;
    bottom:3px;
    left:0;
    right:0;
    font-size:11px;
  }
</style>
</head>
<body>

<div id="blocker">
  <div>
    <h1>Micro Minecraft-like Sandbox</h1>
    <p>
      クリックで開始 / WASD移動 / Spaceジャンプ<br />
      左クリック:破壊 / 右クリック:設置 / F飛翔切替 / Rリスポーン
    </p>
    <button id="start">クリックで開始</button>
  </div>
</div>

<div id="info">
  WASD 移動 / Space ジャンプ / Shift 減速<br />
  Ctrl スプリント / F 飛翔切替 / R リスポーン<br />
  1-6 ブロック選択 / 左クリック破壊 / 右クリック設置
</div>

<div id="crosshair"></div>
<div id="ui"></div>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

// -------------------------
// Basic constants
// -------------------------
const AIR = 0;
const GRASS = 1;
const DIRT = 2;
const STONE = 3;
const WOOD = 4;
const LEAVES = 5;
const SAND = 6;
const WATER = 7;

const blockDefs = [
  null,
  { name: "草", color: 0x57b746, solid: true },
  { name: "土", color: 0x8b5a2b, solid: true },
  { name: "石", color: 0x8f8f8f, solid: true },
  { name: "木", color: 0x7a4f2a, solid: true },
  { name: "葉", color: 0x2f9a41, solid: true },
  { name: "砂", color: 0xd9c97c, solid: true },
  { name: "水", color: 0x2f80ed, solid: false, transparent: true }
];

const WORLD_SIZE = 48;
const MAX_Y = 40;
const SEA_LEVEL = 5;
const PLAYER_R = 0.3;
const PLAYER_H = 1.8;
const EYE_HEIGHT = 1.6;
const GRAVITY = 28;

// -------------------------
// Three.js scene
// -------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 30, 120);

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.05,
  500
);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xffffff, 0x8f7c5e, 0.95);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffffff, 0.65);
sun.position.set(70, 110, 40);
scene.add(sun);

// -------------------------
// Materials / geometry
// -------------------------
const boxGeo = new THREE.BoxGeometry(1, 1, 1);

const materials = blockDefs.map(def => {
  if (!def) return null;
  const mat = new THREE.MeshLambertMaterial({ color: def.color });
  if (def.transparent) {
    mat.transparent = true;
    mat.opacity = 0.55;
    mat.depthWrite = false;
  }
  return mat;
});

// -------------------------
// World storage
// key: "x,y,z" -> block type
// -------------------------
const blocks = new Map();

const key = (x, y, z) => `${x},${y},${z}`;

function getBlockRaw(x, y, z) {
  return blocks.get(key(x, y, z)) || AIR;
}

function setBlockRaw(x, y, z, type) {
  if (y < 0 || y >= MAX_Y) return;
  const k = key(x, y, z);
  if (type === AIR) blocks.delete(k);
  else blocks.set(k, type);
}

function isSolidBlock(x, y, z) {
  if (y < 0) return true; // invisible floor
  if (y >= MAX_Y) return false;
  const t = blocks.get(key(x, y, z));
  return !!(t && blockDefs[t].solid);
}

function isRaySolidBlock(x, y, z) {
  if (y < 0 || y >= MAX_Y) return false;
  const t = blocks.get(key(x, y, z));
  return !!(t && blockDefs[t].solid);
}

// -------------------------
// Instanced meshes
// -------------------------
const blockMeshes = new Array(blockDefs.length).fill(null);
const blockKeys = new Array(blockDefs.length).fill(null);

function rebuildInstances() {
  const buckets = blockDefs.map(() => []);

  for (const [k, type] of blocks.entries()) {
    if (type > 0 && type < buckets.length) {
      buckets[type].push(k);
    }
  }

  const m = new THREE.Matrix4();

  for (let type = 1; type < blockDefs.length; type++) {
    const list = buckets[type];
    const need = list.length;
    let mesh = blockMeshes[type];

    if (!mesh || mesh.userData.capacity < need) {
      if (mesh) scene.remove(mesh);

      const cap = Math.max(1000, need, mesh ? mesh.userData.capacity * 2 : 0);
      mesh = new THREE.InstancedMesh(boxGeo, materials[type], cap);
      mesh.userData.capacity = cap;
      mesh.userData.type = type;
      mesh.frustumCulled = false;

      if (blockDefs[type].transparent) {
        mesh.renderOrder = 10;
      }

      blockMeshes[type] = mesh;
      scene.add(mesh);
    }

    mesh.count = need;
    blockKeys[type] = list;

    for (let i = 0; i < need; i++) {
      const parts = list[i].split(",");
      const x = Number(parts[0]);
      const y = Number(parts[1]);
      const z = Number(parts[2]);
      m.makeTranslation(x + 0.5, y + 0.5, z + 0.5);
      mesh.setMatrixAt(i, m);
    }

    mesh.instanceMatrix.needsUpdate = true;
  }
}

// -------------------------
// Simple value noise
// -------------------------
function fract(x) {
  return x - Math.floor(x);
}

function rand01(x, y) {
  const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
  return fract(n);
}

function smooth(t) {
  return t * t * (3 - 2 * t);
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function noise2(x, z) {
  const xi = Math.floor(x);
  const zi = Math.floor(z);
  const xf = x - xi;
  const zf = z - zi;

  const v00 = rand01(xi, zi);
  const v10 = rand01(xi + 1, zi);
  const v01 = rand01(xi, zi + 1);
  const v11 = rand01(xi + 1, zi + 1);

  const u = smooth(xf);
  const v = smooth(zf);

  return lerp(
    lerp(v00, v10, u),
    lerp(v01, v11, u),
    v
  );
}

function fbm(x, z) {
  return (
    noise2(x / 24, z / 24) * 0.62 +
    noise2(x / 12, z / 12) * 0.28 +
    noise2(x / 6, z / 6) * 0.10
  );
}

// -------------------------
// World generation
// -------------------------
function generateWorld() {
  const cx = WORLD_SIZE * 0.5;
  const cz = WORLD_SIZE * 0.5;

  for (let x = 0; x < WORLD_SIZE; x++) {
    for (let z = 0; z < WORLD_SIZE; z++) {
      const n = fbm(x, z);
      let h = Math.floor(1 + n * 15);
      h = Math.max(1, Math.min(h, 18));

      // central island for safe spawn
      const dx = x - cx;
      const dz = z - cz;
      const d2 = dx * dx + dz * dz;
      if (d2 < 90) {
        h = Math.max(h, SEA_LEVEL + 2 + Math.floor(noise2(x / 7, z / 7) * 2));
      }

      for (let y = 0; y < h; y++) {
        let type;

        if (y === h - 1) {
          if (y < SEA_LEVEL) type = SAND;
          else if (y >= 14) type = STONE;
          else type = GRASS;
        } else if (y >= h - 3) {
          type = (h - 1 < SEA_LEVEL) ? SAND : DIRT;
        } else {
          type = STONE;
        }

        setBlockRaw(x, y, z, type);
      }

      // water fill
      for (let y = h; y < SEA_LEVEL; y++) {
        setBlockRaw(x, y, z, WATER);
      }
    }
  }

  // simple trees
  for (let x = 3; x < WORLD_SIZE - 3; x++) {
    for (let z = 3; z < WORLD_SIZE - 3; z++) {
      const r = rand01(x * 12.9898, z * 78.233);
      if (r > 0.012) continue;

      let top = -1;
      for (let y = 25; y >= 0; y--) {
        if (isSolidBlock(x, y, z)) {
          top = y;
          break;
        }
      }

      if (top < SEA_LEVEL) continue;
      if (getBlockRaw(x, top, z) !== GRASS) continue;

      const trunkH = 4 + Math.floor(rand01(x * 3.1, z * 5.7) * 2);

      for (let y = top + 1; y <= top + trunkH; y++) {
        setBlockRaw(x, y, z, WOOD);
      }

      const leafBottom = top + trunkH - 1;
      const leafTop = top + trunkH;

      for (let dx = -2; dx <= 2; dx++) {
        for (let dz = -2; dz <= 2; dz++) {
          if (Math.abs(dx) === 2 && Math.abs(dz) === 2) {
            if (rand01(x + dx, z + dz) < 0.45) continue;
          }

          for (let y = leafBottom; y <= leafTop; y++) {
            if (dx === 0 && dz === 0) continue;
            if (getBlockRaw(x + dx, y, z + dz) === AIR) {
              setBlockRaw(x + dx, y, z + dz, LEAVES);
            }
          }
        }
      }

      // top cap
      for (let dx = -1; dx <= 1; dx++) {
        for (let dz = -1; dz <= 1; dz++) {
          if (dx === 0 && dz === 0) continue;
          const y = top + trunkH + 1;
          if (getBlockRaw(x + dx, y, z + dz) === AIR) {
            setBlockRaw(x + dx, y, z + dz, LEAVES);
          }
        }
      }
    }
  }
}

generateWorld();
rebuildInstances();

// -------------------------
// Player
// -------------------------
const player = {
  x: WORLD_SIZE * 0.5 + 0.5,
  y: 20,
  z: WORLD_SIZE * 0.5 + 0.5,
  vx: 0,
  vy: 0,
  vz: 0,
  yaw: 0,
  pitch: 0
};

let onGround = false;
let fly = false;

function findTopSolid(x, z) {
  const bx = Math.floor(x);
  const bz = Math.floor(z);
  for (let y = 32; y >= 0; y--) {
    if (isSolidBlock(bx, y, bz)) return y;
  }
  return 0;
}

function respawn() {
  player.x = WORLD_SIZE * 0.5 + 0.5;
  player.z = WORLD_SIZE * 0.5 + 0.5;
  const top = findTopSolid(player.x, player.z);
  player.y = top + 1;
  player.vx = 0;
  player.vy = 0;
  player.vz = 0;
}

respawn();

// -------------------------
// Collision
// -------------------------
function boxCollides(px, py, pz) {
  const minX = px - PLAYER_R;
  const maxX = px + PLAYER_R;
  const minY = py;
  const maxY = py + PLAYER_H;
  const minZ = pz - PLAYER_R;
  const maxZ = pz + PLAYER_R;

  const sx = Math.floor(minX);
  const ex = Math.floor(maxX);
  const sy = Math.floor(minY);
  const ey = Math.floor(maxY);
  const sz = Math.floor(minZ);
  const ez = Math.floor(maxZ);

  for (let x = sx; x <= ex; x++) {
    for (let y = sy; y <= ey; y++) {
      for (let z = sz; z <= ez; z++) {
        if (!isSolidBlock(x, y, z)) continue;

        if (
          minX < x + 1 &&
          maxX > x &&
          minY < y + 1 &&
          maxY > y &&
          minZ < z + 1 &&
          maxZ > z
        ) {
          return true;
        }
      }
    }
  }

  return false;
}

function moveAxis(axis, amount) {
  if (amount === 0) return false;

  const prev = player[axis];
  player[axis] += amount;

  if (boxCollides(player.x, player.y, player.z)) {
    player[axis] = prev;
    return true;
  }

  return false;
}

function isInWater() {
  const bx = Math.floor(player.x);
  const bz = Math.floor(player.z);
  return (
    getBlockRaw(bx, Math.floor(player.y + 0.2), bz) === WATER ||
    getBlockRaw(bx, Math.floor(player.y + 0.9), bz) === WATER
  );
}

// -------------------------
// Voxel raycast (DDA)
// -------------------------
function raycastVoxel(origin, dir, maxDist) {
  let x = Math.floor(origin.x);
  let y = Math.floor(origin.y);
  let z = Math.floor(origin.z);

  const dx = dir.x;
  const dy = dir.y;
  const dz = dir.z;

  const stepX = dx > 0 ? 1 : dx < 0 ? -1 : 0;
  const stepY = dy > 0 ? 1 : dy < 0 ? -1 : 0;
  const stepZ = dz > 0 ? 1 : dz < 0 ? -1 : 0;

  const tDeltaX = dx !== 0 ? Math.abs(1 / dx) : Infinity;
  const tDeltaY = dy !== 0 ? Math.abs(1 / dy) : Infinity;
  const tDeltaZ = dz !== 0 ? Math.abs(1 / dz) : Infinity;

  let tMaxX = dx > 0 ? ((x + 1 - origin.x) / dx) : dx < 0 ? ((x - origin.x) / dx) : Infinity;
  let tMaxY = dy > 0 ? ((y + 1 - origin.y) / dy) : dy < 0 ? ((y - origin.y) / dy) : Infinity;
  let tMaxZ = dz > 0 ? ((z + 1 - origin.z) / dz) : dz < 0 ? ((z - origin.z) / dz) : Infinity;

  let face = [0, 0, 0];

  if (isRaySolidBlock(x, y, z)) {
    return { x, y, z, face };
  }

  for (let i = 0; i < 160; i++) {
    if (tMaxX < tMaxY && tMaxX < tMaxZ) {
      if (tMaxX > maxDist) break;
      x += stepX;
      face = [-stepX, 0, 0];
      tMaxX += tDeltaX;
    } else if (tMaxY < tMaxZ) {
      if (tMaxY > maxDist) break;
      y += stepY;
      face = [0, -stepY, 0];
      tMaxY += tDeltaY;
    } else {
      if (tMaxZ > maxDist) break;
      z += stepZ;
      face = [0, 0, -stepZ];
      tMaxZ += tDeltaZ;
    }

    if (isRaySolidBlock(x, y, z)) {
      return { x, y, z, face };
    }
  }

  return null;
}

// -------------------------
// Selection highlight
// -------------------------
const highlight = new THREE.LineSegments(
  new THREE.EdgesGeometry(boxGeo),
  new THREE.LineBasicMaterial({ color: 0x111111 })
);
highlight.visible = false;
scene.add(highlight);

let target = null;

// -------------------------
// UI hotbar
// -------------------------
const ui = document.getElementById("ui");
const hotbar = document.createElement("div");
hotbar.className = "hotbar";
ui.appendChild(hotbar);

const selectable = [GRASS, DIRT, STONE, WOOD, LEAVES, SAND];
let selected = GRASS;

function hex(color) {
  return "#" + color.toString(16).padStart(6, "0");
}

selectable.forEach((type, i) => {
  const slot = document.createElement("div");
  slot.className = "slot";
  slot.innerHTML = `
    <span class="num">${i + 1}</span>
    <div class="swatch" style="background:${hex(blockDefs[type].color)}"></div>
    <span class="label">${blockDefs[type].name}</span>
  `;
  slot.onclick = () => {
    selected = type;
    updateUI();
  };
  hotbar.appendChild(slot);
});

function updateUI() {
  const slots = [...hotbar.children];
  slots.forEach((el, i) => {
    el.classList.toggle("selected", selectable[i] === selected);
  });
}
updateUI();

// -------------------------
// Input
// -------------------------
const keys = {};

window.addEventListener("keydown", e => {
  keys[e.code] = true;

  if (e.code === "Space") e.preventDefault();

  if (e.code === "Digit1") selected = selectable[0];
  if (e.code === "Digit2") selected = selectable[1];
  if (e.code === "Digit3") selected = selectable[2];
  if (e.code === "Digit4") selected = selectable[3];
  if (e.code === "Digit5") selected = selectable[4];
  if (e.code === "Digit6") selected = selectable[5];

  if (e.code === "KeyF") {
    fly = !fly;
    player.vy = 0;
  }

  if (e.code === "KeyR") {
    respawn();
  }

  updateUI();
});

window.addEventListener("keyup", e => {
  keys[e.code] = false;
});

// pointer lock
const blocker = document.getElementById("blocker");
const startBtn = document.getElementById("start");

startBtn.addEventListener("click", () => {
  renderer.domElement.requestPointerLock();
});

document.addEventListener("pointerlockchange", () => {
  const locked = document.pointerLockElement === renderer.domElement;
  blocker.style.display = locked ? "none" : "flex";
});

window.addEventListener("mousemove", e => {
  if (document.pointerLockElement !== renderer.domElement) return;
  const sensitivity = 0.0023;
  player.yaw -= e.movementX * sensitivity;
  player.pitch -= e.movementY * sensitivity;
  player.pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, player.pitch));
});

document.addEventListener("contextmenu", e => e.preventDefault());

document.addEventListener("mousedown", e => {
  if (document.pointerLockElement !== renderer.domElement) return;

  if (e.button === 0) {
    breakTargetBlock();
  } else if (e.button === 2) {
    placeBlockAtTarget();
  }
});

function breakTargetBlock() {
  if (!target) return;
  if (target.y === 0) return; // keep bottom floor

  setBlockRaw(target.x, target.y, target.z, AIR);
  rebuildInstances();
}

function playerOverlapsBlock(bx, by, bz) {
  const minX = player.x - PLAYER_R;
  const maxX = player.x + PLAYER_R;
  const minY = player.y;
  const maxY = player.y + PLAYER_H;
  const minZ = player.z - PLAYER_R;
  const maxZ = player.z + PLAYER_R;

  return (
    minX < bx + 1 &&
    maxX > bx &&
    minY < by + 1 &&
    maxY > by &&
    minZ < bz + 1 &&
    maxZ > bz
  );
}

function placeBlockAtTarget() {
  if (!target) return;

  const nx = target.x + target.face[0];
  const ny = target.y + target.face[1];
  const nz = target.z + target.face[2];

  if (ny < 0 || ny >= MAX_Y) return;
  if (getBlockRaw(nx, ny, nz) !== AIR) return;
  if (playerOverlapsBlock(nx, ny, nz)) return;

  setBlockRaw(nx, ny, nz, selected);
  rebuildInstances();
}

// -------------------------
// Main loop
// -------------------------
const forward = new THREE.Vector3();
const right = new THREE.Vector3();
const move = new THREE.Vector3();
const rayOrigin = new THREE.Vector3();
const rayDir = new THREE.Vector3();

let prevTime = performance.now();

function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

function update(dt) {
  // camera orientation
  camera.rotation.set(player.pitch, player.yaw, 0, "YXZ");
  camera.position.set(player.x, player.y + EYE_HEIGHT, player.z);

  // directions
  forward.set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  right.set(Math.cos(player.yaw), 0, -Math.sin(player.yaw));

  // input move
  move.set(0, 0, 0);

  if (keys["KeyW"]) move.add(forward);
  if (keys["KeyS"]) move.sub(forward);
  if (keys["KeyD"]) move.add(right);
  if (keys["KeyA"]) move.sub(right);
  move.y = 0;
  if (move.lengthSq() > 0) move.normalize();

  const inWater = isInWater();

  let baseSpeed = fly ? 14 : 6.2;
  if (inWater && !fly) baseSpeed = 3.6;
  if (keys["ShiftLeft"] && !fly) baseSpeed *= 0.45;
  if (keys["ControlLeft"] && !fly) baseSpeed *= 1.55;

  if (fly) {
    player.vx = move.x * baseSpeed;
    player.vz = move.z * baseSpeed;

    let vy = 0;
    if (keys["Space"]) vy += baseSpeed;
    if (keys["ShiftLeft"]) vy -= baseSpeed;
    player.vy = vy;
  } else {
    const targetVx = move.x * baseSpeed;
    const targetVz = move.z * baseSpeed;

    const k = 1 - Math.exp(-14 * dt);
    player.vx += (targetVx - player.vx) * k;
    player.vz += (targetVz - player.vz) * k;

    if (inWater) {
      if (keys["Space"]) {
        player.vy += 12 * dt;
      } else {
        player.vy -= 7 * dt;
      }
      player.vy = clamp(player.vy, -5, 7);
      player.vy *= 0.96;
    } else {
      if (onGround && keys["Space"]) {
        player.vy = 9.3;
        onGround = false;
      }
      player.vy -= GRAVITY * dt;
      player.vy = Math.max(player.vy, -24);
    }
  }

  // movement collisions
  onGround = false;

  if (moveAxis("x", player.vx * dt)) {
    player.vx = 0;
  }

  if (moveAxis("z", player.vz * dt)) {
    player.vz = 0;
  }

  if (moveAxis("y", player.vy * dt)) {
    if (player.vy < 0) {
      onGround = true;
    }
    player.vy = 0;
  }

  // fell out of world
  if (player.y < -30) {
    respawn();
  }

  // raycast target
  camera.getWorldDirection(rayDir);
  rayOrigin.copy(camera.position);
  target = raycastVoxel(rayOrigin, rayDir, 7);

  if (target) {
    highlight.visible = true;
    highlight.position.set(target.x + 0.5, target.y + 0.5, target.z + 0.5);
  } else {
    highlight.visible = false;
  }
}

function animate(now) {
  requestAnimationFrame(animate);

  const dt = Math.min((now - prevTime) / 1000, 0.05);
  prevTime = now;

  update(dt);
  renderer.render(scene, camera);
}

requestAnimationFrame(animate);

// -------------------------
// Resize
// -------------------------
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
