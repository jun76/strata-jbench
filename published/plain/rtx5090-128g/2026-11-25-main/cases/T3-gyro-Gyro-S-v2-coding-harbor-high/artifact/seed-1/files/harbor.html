<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voxel Harbor — A Sailing Ship Calling at Harbor</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0b2a35;
    }
    canvas {
      display: block;
      touch-action: none;
    }
    #hint {
      position: fixed;
      bottom: 8px;
      left: 8px;
      color: #dff6ff;
      font: 12px monospace;
      text-shadow: 0 1px 2px #000;
      opacity: 0.85;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="hint">Drag to orbit, scroll to zoom</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    if (typeof THREE === "undefined") {
      document.body.innerHTML =
        '<p style="font-family:monospace;color:#fff;padding:20px;">Could not load THREE.js from the CDN. Check your internet connection.</p>';
    } else {
      init();
    }

    function init() {
      const scene = new THREE.Scene();

      const SKY = 0x99c6db;
      scene.background = new THREE.Color(SKY);
      scene.fog = new THREE.Fog(SKY, 110, 270);

      const camera = new THREE.PerspectiveCamera(
        48,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );

      let renderer;
      try {
        renderer = new THREE.WebGLRenderer({ antialias: true });
      } catch (err) {
        document.body.innerHTML =
          '<p style="font-family:monospace;color:#fff;padding:20px;">WebGL is not available in this browser.</p>';
        return;
      }

      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (THREE.sRGBEncoding) renderer.outputEncoding = THREE.sRGBEncoding;
      document.body.appendChild(renderer.domElement);

      // Lights
      const hemi = new THREE.HemisphereLight(0xe9f6ff, 0x6d5c4b, 0.72);
      scene.add(hemi);

      const sun = new THREE.DirectionalLight(0xffefd5, 0.85);
      sun.position.set(90, 130, 70);
      scene.add(sun);

      const fill = new THREE.DirectionalLight(0x88c4e0, 0.28);
      fill.position.set(-110, 80, -100);
      scene.add(fill);

      // Voxel storage
      const boxData = {};
      const shipData = {};

      function addBox(x, y, z, w, h, d, color) {
        const arr = boxData[color] || (boxData[color] = []);
        arr.push({ x, y, z, w, h, d });
      }

      function addShipBox(x, y, z, w, h, d, color) {
        const arr = shipData[color] || (shipData[color] = []);
        arr.push({ x, y, z, w, h, d });
      }

      function buildInstancedGroup(data) {
        const group = new THREE.Group();
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const dummy = new THREE.Object3D();

        for (const [key, arr] of Object.entries(data)) {
          if (!arr.length) continue;

          const color = Number(key);
          const material = new THREE.MeshLambertMaterial({
            color,
            flatShading: true,
          });

          const mesh = new THREE.InstancedMesh(geometry, material, arr.length);

          arr.forEach((b, i) => {
            dummy.position.set(b.x, b.y, b.z);
            dummy.scale.set(b.w, b.h, b.d);
            dummy.updateMatrix();
            mesh.setMatrixAt(i, dummy.matrix);
          });

          mesh.instanceMatrix.needsUpdate = true;
          group.add(mesh);
        }

        return group;
      }

      // Ship group
      const shipGroup = new THREE.Group();
      shipGroup.position.set(-13, 0, 0);
      scene.add(shipGroup);

      let shipFlagPivot = null;

      const ropeMat = new THREE.MeshLambertMaterial({
        color: 0x2b241c,
        flatShading: true,
      });

      function addShipRope(x1, y1, z1, x2, y2, z2, thickness = 0.22) {
        const from = new THREE.Vector3(x1, y1, z1);
        const to = new THREE.Vector3(x2, y2, z2);
        const dir = to.clone().sub(from);
        const len = dir.length();
        if (len < 0.01) return;

        dir.normalize();

        const mesh = new THREE.Mesh(
          new THREE.BoxGeometry(len, thickness, thickness),
          ropeMat
        );
        mesh.position.copy(from).add(to).multiplyScalar(0.5);
        mesh.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), dir);

        shipGroup.add(mesh);
      }

      function buildShip() {
        const C = {
          hullDark: 0x3c2a21,
          hullMid: 0x664532,
          hullUpper: 0x7b5236,
          deck: 0xa57550,
          cabin: 0x725037,
          cabinRoof: 0x594233,
          sail: 0xe8dbc2,
          yard: 0x3f2d22,
          mast: 0x5b3e2b,
          window: 0x2b221c,
          flag: 0xd74f45,
        };

        function row(y, h, len, halfWidth, color) {
          addShipBox(0, y + h / 2, 0, halfWidth * 2, h, len * 2, color);
        }

        // Hull rows
        row(-3, 3, 22, 4.5, C.hullDark);
        row(0, 3, 23, 6, C.hullMid);
        row(3, 3, 24, 6, C.hullUpper);
        row(6, 3, 23, 5.5, C.hullMid);

        // Deck
        addShipBox(0, 9.5, 0, 11.2, 1, 46, C.deck);

        // Deck rails
        addShipBox(5.6, 10.2, 0, 0.5, 1, 44, C.hullUpper);
        addShipBox(-5.6, 10.2, 0, 0.5, 1, 44, C.hullUpper);

        // Bow
        addShipBox(0, 3.5, 25, 5.5, 7, 6, C.hullMid);
        addShipBox(0, 1.5, 27, 3, 3, 4, C.hullUpper);

        // Bowsprit
        addShipBox(0, 8.2, 33, 1.2, 1.2, 10, C.mast);
        addShipBox(0, 7.6, 31, 0.8, 1.5, 2, C.yard);

        // Stern cabin
        addShipBox(0, 12, -22, 10, 5, 8, C.cabin);
        addShipBox(0, 14.5, -22, 9.5, 2, 8, C.cabinRoof);

        // Cabin windows
        [-24, -20].forEach((z) => {
          addShipBox(5.1, 11.5, z, 0.4, 2.2, 2.2, C.window);
          addShipBox(-5.1, 11.5, z, 0.4, 2.2, 2.2, C.window);
        });

        // Masts
        function mast(z, h) {
          addShipBox(0, 9.5 + h / 2, z, 1.8, h, 1.8, C.mast);
        }

        mast(10, 14);
        mast(0, 18);
        mast(-10, 12);

        // Furled sails
        function furled(z, y, yardW, sailW) {
          addShipBox(0, y, z, yardW, 1.2, 1.2, C.yard);
          addShipBox(0, y, z, sailW, 2.4, 2.4, C.sail);
        }

        furled(10, 13, 12, 10);
        furled(10, 19, 11, 9);

        furled(0, 13, 14, 12);
        furled(0, 20, 13, 11);
        furled(0, 27, 12, 10);

        furled(-10, 13, 9, 7);
        furled(-10, 19, 8, 6);

        // Separate animated flag
        shipFlagPivot = new THREE.Group();
        shipFlagPivot.position.set(0.9, 27.8, 0);

        const flagMesh = new THREE.Mesh(
          new THREE.BoxGeometry(2.2, 2.2, 0.3),
          new THREE.MeshLambertMaterial({
            color: 0xd74f45,
            flatShading: true,
          })
        );
        flagMesh.position.set(1.1, 0, 0);
        shipFlagPivot.add(flagMesh);
        shipGroup.add(shipFlagPivot);

        // Rigging
        addShipRope(0, 8.2, 38, 0, 23.5, 10, 0.25);
        addShipRope(0, 27.5, 0, 0, 8.2, 38, 0.22);
        addShipRope(0, 27.5, 0, 5.6, 10.2, -18, 0.22);
        addShipRope(0, 27.5, 0, -5.6, 10.2, -18, 0.22);
      }

      buildShip();
      shipGroup.add(buildInstancedGroup(shipData));

      // Dock / shore
      function buildDock() {
        // Shore ground
        addBox(-62, -2, 0, 80, 4, 150, 0x8b7c6c);

        // Walkway strip along quay
        addBox(-48, 1.7, 0, 14, 0.8, 60, 0xa79783);

        // Main dock deck
        addBox(-33.5, 5.5, 0, 23, 1, 56, 0x8d6849);

        // Dock side walls
        addBox(-45, 3, 0, 1.2, 3, 56, 0x6f5845);
        addBox(-22, 3, 0, 0.8, 3, 56, 0x6f5845);

        // Pilings
        for (let z = -24; z <= 24; z += 8) {
          addBox(-45, 3, z, 1.6, 3, 1.6, 0x655138);
          addBox(-22, 3, z, 1.0, 3, 1.0, 0x655138);
        }

        // Bollards
        for (let z = -24; z <= 24; z += 12) {
          addBox(-23, 6.8, z, 1, 1.5, 1, 0x383431);
        }
      }

      // Warehouses / buildings
      function buildBuildings() {
        const buildings = [
          { x: -76, z: -24, w: 16, d: 16, h: 16, c: 0x9d8469, roof: 0x604b3a },
          { x: -76, z: 0, w: 18, d: 14, h: 13, c: 0xc8b596, roof: 0x9c5a3f },
          { x: -76, z: 24, w: 16, d: 18, h: 18, c: 0x7a6b55, roof: 0x556366 },
          { x: -56, z: -28, w: 12, d: 14, h: 11, c: 0xa88366, roof: 0x694636 },
          { x: -56, z: 28, w: 12, d: 14, h: 9, c: 0xcaa477, roof: 0x8b5b3c },
          { x: -52, z: -8, w: 10, d: 10, h: 14, c: 0x8c6b56, roof: 0x664b39 },
          { x: -52, z: 10, w: 9, d: 12, h: 12, c: 0xd4b58a, roof: 0x8f5f42 },
        ];

        const doorColor = 0x3a2920;
        const windowColor = 0x2c221d;
        const chimneyColor = 0x5c4f48;

        for (const b of buildings) {
          const baseY = 2;
          const bodyCenterY = baseY + b.h / 2;

          addBox(b.x, bodyCenterY, b.z, b.w, b.h, b.d, b.c);

          // Roof slab
          addBox(b.x, baseY + b.h + 1, b.z, b.w + 2, 2, b.d + 2, b.roof);

          // Chimney
          addBox(
            b.x + b.w / 3,
            baseY + b.h + 2.5,
            b.z - b.d / 4,
            1.2,
            3,
            1.2,
            chimneyColor
          );

          // Front facade windows and door
          const front = b.x + b.w / 2 + 0.25;

          addBox(front, 4, b.z, 0.5, 4, 2.0, doorColor);

          for (let yy = 5; yy + 1.1 < baseY + b.h; yy += 5) {
            for (let dz = -b.d / 2 + 2; dz <= b.d / 2 - 2; dz += Math.max(2, b.d / 3)) {
              addBox(front, yy, dz, 0.5, 2.2, 1.6, windowColor);
            }
          }
        }
      }

      // Cargo / barrels
      function buildCargo() {
        const crates = [
          { x: -39, z: -20, w: 3, h: 3 },
          { x: -34, z: -17, w: 2, h: 2.5 },
          { x: -38, z: -10, w: 3, h: 3.5 },
          { x: -32, z: -6, w: 2.2, h: 2.4 },
          { x: -41, z: 2, w: 3.2, h: 3.4 },
          { x: -30, z: 7, w: 2, h: 2 },
          { x: -36, z: 13, w: 2.6, h: 3 },
          { x: -33, z: 20, w: 2.2, h: 2.2 },
          { x: -38, z: 24, w: 3, h: 3.2 },
        ];

        crates.forEach((c, i) => {
          addBox(c.x, 6 + c.h / 2, c.z, c.w, c.h, c.w, i % 2 ? 0x8f6942 : 0xb4875c);
        });

        const barrels = [
          [-42, -13],
          [-42, 5],
          [-42, 17],
          [-37, -25],
        ];

        barrels.forEach(([x, z]) => {
          addBox(x, 7.5, z, 2.2, 3, 2.2, 0x75553a);
          addBox(x, 6.5, z, 2.4, 0.6, 2.4, 0x382a20);
          addBox(x, 8.5, z, 2.4, 0.6, 2.4, 0x382a20);
        });
      }

      let lighthouseLight = null;
      let lighthouseGlow = null;

      function buildLighthouse() {
        const x = -24;
        const z = 45;

        // Base
        addBox(x, 3, z, 6, 2, 6, 0x777572);

        let y = 4;

        // Tower stripes
        for (let i = 0; i < 7; i++) {
          const s = 5 - i * 0.4;
          const color = i % 2 === 0 ? 0xd65149 : 0xf7f7f7;
          addBox(x, y + 1.5, z, s, 3, s, color);
          y += 3;
        }

        // Gallery
        addBox(x, 19.5, z, 4.2, 1, 4.2, 0x3f474c);
        addBox(x, 23.0, z, 4, 1, 4, 0x4f5a63);
        addBox(x, 24.2, z, 2.5, 1, 2.5, 0x384047);

        // Rocks
        addBox(x - 3, 0.5, z + 2, 3, 2, 3, 0x8f8f8f);
        addBox(x + 3, 0, z - 2, 3, 2, 3, 0x909090);
        addBox(x, 0, z - 4, 4, 2, 4, 0x7f7f7f);

        // Lantern glow mesh + light
        lighthouseGlow = new THREE.Mesh(
          new THREE.BoxGeometry(3, 3, 3),
          new THREE.MeshBasicMaterial({ color: 0xffe082 })
        );
        lighthouseGlow.position.set(x, 20.5, z);
        scene.add(lighthouseGlow);

        lighthouseLight = new THREE.PointLight(0xffc560, 1.0, 65);
        lighthouseLight.position.set(x, 20.5, z);
        scene.add(lighthouseLight);
      }

      function addStreetlight(x, y, z) {
        const poleMat = new THREE.MeshLambertMaterial({
          color: 0x333231,
          flatShading: true,
        });

        const lampMat = new THREE.MeshBasicMaterial({ color: 0xffd985 });

        const g = new THREE.Group();

        const pole = new THREE.Mesh(new THREE.BoxGeometry(0.45, 5, 0.45), poleMat);
        pole.position.y = 2.5;
        g.add(pole);

        const arm = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.35, 0.35), poleMat);
        arm.position.set(1, 4.8, 0);
        g.add(arm);

        const lamp = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.7, 1.2), lampMat);
        lamp.position.set(1.8, 5.1, 0);
        g.add(lamp);

        const light = new THREE.PointLight(0xffcc77, 0.6, 32);
        light.position.set(1.8, 5.1, 0);
        g.add(light);

        g.position.set(x, y, z);
        scene.add(g);
      }

      function buildStreetlights() {
        addStreetlight(-23, 6, -22);
        addStreetlight(-23, 6, 0);
        addStreetlight(-23, 6, 22);
      }

      // Small boats
      const boats = [];

      function makeBoat(x, z, heading, phase) {
        const hullMat = new THREE.MeshLambertMaterial({ color: 0x734e35, flatShading: true });
        const deckMat = new THREE.MeshLambertMaterial({ color: 0xb28258, flatShading: true });
        const cabinMat = new THREE.MeshLambertMaterial({ color: 0xc4a57f, flatShading: true });
        const mastMat = new THREE.MeshLambertMaterial({ color: 0x4f3427, flatShading: true });
        const sailMat = new THREE.MeshLambertMaterial({ color: 0xe6dac6, flatShading: true });

        const g = new THREE.Group();

        const hull = new THREE.Mesh(new THREE.BoxGeometry(3, 1.4, 7.5), hullMat);
        hull.position.y = -0.7;
        g.add(hull);

        const bow = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.1, 2.2), hullMat);
        bow.position.set(0, -0.65, 4.0);
        g.add(bow);

        const deck = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.3, 7), deckMat);
        deck.position.y = 0.25;
        g.add(deck);

        const cabin = new THREE.Mesh(new THREE.BoxGeometry(2.0, 2.2, 3), cabinMat);
        cabin.position.set(0, 1.35, -1.2);
        g.add(cabin);

        const mast = new THREE.Mesh(new THREE.BoxGeometry(0.4, 3.2, 0.4), mastMat);
        mast.position.set(0, 2.1, 1.3);
        g.add(mast);

        const yard = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.4, 0.4), mastMat);
        yard.position.set(0, 2.3, 1.3);
        g.add(yard);

        const sail = new THREE.Mesh(new THREE.BoxGeometry(2.8, 2, 1), sailMat);
        sail.position.set(0, 2.3, 1.3);
        g.add(sail);

        g.position.set(x, 0, z);
        g.rotation.y = heading;
        scene.add(g);

        boats.push({
          g,
          phase,
          baseY: -0.1,
          heading,
        });
      }

      function createBoats() {
        makeBoat(26, -28, 0.35, 0.2);
        makeBoat(36, 8, -0.45, 1.4);
        makeBoat(45, 30, 0.65, 2.6);
        makeBoat(18, 22, -0.3, 3.3);
      }

      // Water
      const waterGeo = new THREE.PlaneGeometry(220, 170, 42, 34);
      waterGeo.rotate(-Math.PI / 2);

      const waterMat = new THREE.MeshPhongMaterial({
        color: 0x306f86,
        specular: 0x16303f,
        shininess: 90,
        flatShading: true,
        polygonOffset: true,
        polygonOffsetFactor: -1,
        polygonOffsetUnits: -1,
      });

      const water = new THREE.Mesh(waterGeo, waterMat);
      water.position.set(40, -0.5, 0);
      scene.add(water);

      function updateWater(waterMesh, t) {
        const pos = waterMesh.geometry.attributes.position;

        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i);
          const z = pos.getZ(i);

          const h =
            0.12 * Math.sin(x * 0.08 + t * 1.2) +
            0.10 * Math.sin(z * 0.11 + t * 0.7) +
            0.06 * Math.sin((x + z) * 0.14 + t * 1.7);

          pos.setY(i, h);
        }

        pos.needsUpdate = true;
        waterMesh.geometry.computeVertexNormals();
      }

      // Seagulls
      const birds = [];

      function makeBird() {
        const mat = new THREE.MeshLambertMaterial({
          color: 0xf4f4f4,
          flatShading: true,
        });

        const g = new THREE.Group();

        const body = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1, 2.2), mat);
        g.add(body);

        const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.9), mat);
        head.position.set(0, 0.1, 1.15);
        g.add(head);

        const wingGeo = new THREE.BoxGeometry(2.6, 0.4, 1.2);

        const wingL = new THREE.Group();
        const wingLMesh = new THREE.Mesh(wingGeo, mat);
        wingLMesh.position.set(-1.3, 0, 0);
        wingL.add(wingLMesh);
        wingL.position.set(0, 0.25, 0);
        g.add(wingL);

        const wingR = new THREE.Group();
        const wingRMesh = new THREE.Mesh(wingGeo, mat);
        wingRMesh.position.set(1.3, 0, 0);
        wingR.add(wingRMesh);
        wingR.position.set(0, 0.25, 0);
        g.add(wingR);

        birds.push({
          g,
          wingL,
          wingR,
          phase: Math.random() * Math.PI * 2,
          speed: 0.12 + Math.random() * 0.1,
          radius: 22 + Math.random() * 12,
        });
      }

      function createBirds() {
        makeBird();
        makeBird();
        makeBird();
        makeBird();
      }

      function updateBirds(t) {
        const center = new THREE.Vector3(-5, 34, 5);

        for (const b of birds) {
          const a = b.phase + b.speed * t;
          const r = b.radius;

          b.g.position.set(
            center.x + r * Math.cos(a),
            center.y + 3 * Math.sin(a * 2 + b.phase),
            center.z + r * Math.sin(a)
          );

          b.g.rotation.y = -a;

          const flap = Math.sin(t * 8 + b.phase) * 0.65;
          b.wingL.rotation.z = -flap;
          b.wingR.rotation.z = flap;
        }
      }

      // Build static harbor geometry
      buildDock();
      buildBuildings();
      buildCargo();
      buildLighthouse();
      buildStreetlights();
      createBoats();
      createBirds();

      scene.add(buildInstancedGroup(boxData));

      // Mouse / touch orbit controls
      const orbit = {
        target: new THREE.Vector3(-14, 9, 0),
        theta: 0.72,
        phi: 0.93,
        radius: 135,
        tTheta: 0.72,
        tPhi: 0.93,
        tRadius: 135,
      };

      let pointerDown = false;
      let lastX = 0;
      let lastY = 0;
      let lastInteract = performance.now();

      function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      }

      function updateOrbit() {
        const now = performance.now();

        if (!pointerDown && now - lastInteract > 4500) {
          orbit.tTheta += 0.0008;
        }

        orbit.tPhi = clamp(orbit.tPhi, 0.22, 1.35);
        orbit.tRadius = clamp(orbit.tRadius, 55, 250);

        orbit.theta += (orbit.tTheta - orbit.theta) * 0.12;
        orbit.phi += (orbit.tPhi - orbit.phi) * 0.12;
        orbit.radius += (orbit.tRadius - orbit.radius) * 0.12;

        camera.position.set(
          orbit.target.x + orbit.radius * Math.sin(orbit.phi) * Math.sin(orbit.theta),
          orbit.target.y + orbit.radius * Math.cos(orbit.phi),
          orbit.target.z + orbit.radius * Math.sin(orbit.phi) * Math.cos(orbit.theta)
        );

        camera.lookAt(orbit.target);
      }

      function onPointerDown(e) {
        pointerDown = true;
        lastX = e.clientX;
        lastY = e.clientY;
        lastInteract = performance.now();
      }

      function onPointerMove(e) {
        if (!pointerDown) return;

        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;
        lastInteract = performance.now();

        orbit.tTheta -= dx * 0.005;
        orbit.tPhi -= dy * 0.005;

        orbit.tPhi = clamp(orbit.tPhi, 0.22, 1.35);
      }

      function onPointerUp() {
        pointerDown = false;
      }

      function onWheel(e) {
        e.preventDefault();
        orbit.tRadius += e.deltaY * 0.08;
        orbit.tRadius = clamp(orbit.tRadius, 55, 250);
        lastInteract = performance.now();
      }

      renderer.domElement.addEventListener("pointerdown", onPointerDown);
      window.addEventListener("pointermove", onPointerMove);
      window.addEventListener("pointerup", onPointerUp);
      renderer.domElement.addEventListener("wheel", onWheel, { passive: false });

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Animation
      const clock = new THREE.Clock();

      function updateShip(t) {
        shipGroup.position.y = Math.sin(t * 1.1) * 0.18;
        shipGroup.rotation.x = Math.sin(t * 0.75) * 0.02;
        shipGroup.rotation.z = Math.cos(t * 0.65) * 0.012;

        if (shipFlagPivot) {
          shipFlagPivot.rotation.z = Math.sin(t * 2.5) * 0.18;
        }

        if (lighthouseLight) {
          lighthouseLight.intensity = 1.0 + 0.25 * Math.sin(t * 2.2);
        }
      }

      function updateBoats(t) {
        for (const b of boats) {
          const p = t * 0.85 + b.phase;

          b.g.position.y = b.baseY + Math.sin(p) * 0.12;

          b.g.rotation.set(
            Math.sin(p * 0.9) * 0.045,
            b.heading,
            Math.cos(p * 0.75) * 0.035
          );
        }
      }

      function animate() {
        requestAnimationFrame(animate);

        const t = clock.getElapsedTime();

        updateWater(water, t);
        updateShip(t);
        updateBoats(t);
        updateBirds(t);
        updateOrbit();

        renderer.render(scene, camera);
      }

      animate();
    }
  </script>
</body>
</html>
