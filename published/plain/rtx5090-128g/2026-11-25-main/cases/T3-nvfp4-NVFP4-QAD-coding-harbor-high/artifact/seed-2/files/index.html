<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Harbour Call — a voxel diorama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#071219; --ink2:#0b1c25; --line:rgba(214,169,88,.26);
    --brass:#d6a958; --brass-2:#f0cd8b; --paper:#f1e6cf; --mist:#93a9b3; --sea:#79c3c0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);}
  body{font-family:'IBM Plex Mono',ui-monospace,monospace;color:var(--paper);
       -webkit-font-smoothing:antialiased;}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
  canvas.dragging{cursor:grabbing}

  /* ---------- ambient overlays ---------- */
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(120% 90% at 50% 42%,transparent 45%,rgba(3,10,15,.42) 100%);}
  .grain{position:fixed;inset:-50%;pointer-events:none;z-index:3;opacity:.055;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
    animation:drift 7s steps(6) infinite;}
  @keyframes drift{0%{transform:translate3d(0,0,0)}20%{transform:translate3d(-3%,2%,0)}40%{transform:translate3d(2%,-3%,0)}
    60%{transform:translate3d(-2%,-2%,0)}80%{transform:translate3d(3%,1%,0)}100%{transform:translate3d(0,0,0)}}

  /* ---------- panels ---------- */
  .plate{position:fixed;z-index:6;background:linear-gradient(180deg,rgba(7,18,25,.90),rgba(7,18,25,.80));
    border:1px solid var(--line);box-shadow:0 18px 50px -22px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter:blur(7px);}
  .plate::before,.plate::after{content:'';position:absolute;width:11px;height:11px;border:1px solid var(--brass);opacity:.8}
  .plate::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
  .plate::after{right:-1px;bottom:-1px;border-left:0;border-top:0}

  .titlecard{left:26px;top:24px;padding:20px 26px 18px;max-width:min(46vw,430px);
    animation:rise .9s .15s cubic-bezier(.2,.8,.2,1) both;}
  .kicker{font-size:9.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--brass);display:flex;gap:9px;align-items:center}
  .kicker i{display:block;width:26px;height:1px;background:var(--brass);opacity:.65}
  h1{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(34px,4.4vw,60px);line-height:.88;
     margin:12px 0 0;letter-spacing:-.025em;color:var(--paper);text-shadow:0 6px 26px rgba(0,0,0,.55)}
  h1 em{font-style:italic;font-weight:600;color:var(--brass-2);display:block;font-size:.44em;letter-spacing:.01em;margin-top:.35em}
  .rule{height:1px;background:linear-gradient(90deg,var(--brass),transparent);margin:14px 0 12px}
  .specs{display:grid;gap:5px;font-size:10px;letter-spacing:.06em;color:var(--mist)}
  .specs div{display:flex;gap:8px;align-items:baseline}
  .specs b{color:var(--brass);font-weight:500;min-width:78px;text-transform:uppercase;font-size:9px;letter-spacing:.18em}
  .specs span{color:var(--paper);opacity:.9}
  .specs .dots{flex:1;border-bottom:1px dotted rgba(147,169,179,.32);transform:translateY(-3px)}

  /* ---------- control dock ---------- */
  .dock{left:26px;bottom:24px;padding:16px 18px 15px;width:266px;
    animation:rise .9s .35s cubic-bezier(.2,.8,.2,1) both;}
  .dock h2{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--brass);margin:0 0 12px;font-weight:500;
    display:flex;justify-content:space-between}
  .dock h2 span{color:var(--mist);letter-spacing:.14em}
  .ctl{margin-bottom:13px}
  .ctl label{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--mist);margin-bottom:7px}
  .ctl label b{color:var(--brass-2);font-weight:500;letter-spacing:.08em}
  input[type=range]{-webkit-appearance:none;width:100%;height:3px;background:rgba(147,169,179,.28);outline:none;border-radius:2px;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:var(--brass);border:2px solid #0b1c25;box-shadow:0 0 0 1px var(--brass),0 0 12px rgba(214,169,88,.6);transition:transform .18s}
  input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.28)}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--brass);border:2px solid #0b1c25}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .chip{font:inherit;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--mist);
    background:transparent;border:1px solid rgba(147,169,179,.28);padding:6px 9px;cursor:pointer;
    position:relative;overflow:hidden;transition:color .2s,border-color .2s,transform .2s}
  .chip::after{content:'';position:absolute;left:0;bottom:0;height:1px;width:100%;background:var(--brass);
    transform:scaleX(0);transform-origin:left;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
  .chip:hover{color:var(--paper);border-color:var(--line);transform:translateY(-1px)}
  .chip:hover::after{transform:scaleX(1)}
  .chip.on{color:#0b1c25;background:var(--brass);border-color:var(--brass)}
  .chip.on::after{display:none}

  /* ---------- stations ---------- */
  .stations{right:26px;bottom:24px;padding:14px 8px 10px 0;width:250px;
    animation:rise .9s .5s cubic-bezier(.2,.8,.2,1) both;}
  .stations h2{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--brass);margin:0 0 8px 18px;font-weight:500}
  .st{display:flex;align-items:center;gap:11px;padding:7px 14px 7px 18px;cursor:pointer;position:relative;
    border-left:2px solid transparent;transition:background .2s,border-color .2s,padding-left .22s}
  .st .n{font-size:9px;color:var(--brass);opacity:.65;width:12px}
  .st .nm{font-family:'Fraunces',serif;font-size:14px;font-weight:700;letter-spacing:.01em;color:var(--paper);opacity:.72;transition:opacity .2s}
  .st .ar{margin-left:auto;color:var(--brass);opacity:0;transform:translateX(-6px);transition:.24s}
  .st:hover{background:linear-gradient(90deg,rgba(214,169,88,.13),transparent);border-left-color:var(--brass);padding-left:22px}
  .st:hover .nm{opacity:1}
  .st:hover .ar{opacity:1;transform:translateX(0)}
  .st.active{background:linear-gradient(90deg,rgba(214,169,88,.20),transparent);border-left-color:var(--brass-2)}
  .st.active .nm{opacity:1}

  .hint{position:fixed;right:26px;top:26px;z-index:6;font-size:9px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--mist);text-align:right;line-height:2;transition:opacity .6s;animation:rise .9s .8s both}
  .hint b{color:var(--brass);font-weight:500}
  .hint.gone{opacity:0}

  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  body.noui .plate,body.noui .hint{opacity:0;pointer-events:none;transition:opacity .4s}

  /* ---------- loader ---------- */
  .load{position:fixed;inset:0;z-index:20;background:radial-gradient(120% 100% at 50% 40%,#0d2430,#050d13 70%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .8s .2s,visibility .8s .2s}
  .load.done{opacity:0;visibility:hidden}
  .load .t{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(30px,6vw,64px);letter-spacing:-.03em;color:var(--paper)}
  .load .t span{color:var(--brass)}
  .vox{display:flex;gap:5px}
  .vox i{width:12px;height:12px;background:var(--brass);opacity:.2;animation:pulse 1.25s infinite}
  .vox i:nth-child(2){animation-delay:.1s}.vox i:nth-child(3){animation-delay:.2s}.vox i:nth-child(4){animation-delay:.3s}
  .vox i:nth-child(5){animation-delay:.4s}.vox i:nth-child(6){animation-delay:.5s}.vox i:nth-child(7){animation-delay:.6s}
  @keyframes pulse{0%,100%{opacity:.16;transform:translateY(0)}45%{opacity:1;transform:translateY(-5px)}}
  .load .s{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--mist);min-height:14px}
  .load .bar{width:min(320px,62vw);height:1px;background:rgba(147,169,179,.25);position:relative}
  .load .bar i{position:absolute;inset:0 auto 0 0;background:var(--brass);width:0;transition:width .4s}
  @media(max-width:820px){.titlecard{max-width:70vw}.dock{width:214px}.stations{display:none}.hint{display:none}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette"></div><div class="grain"></div>

<header class="plate titlecard">
  <div class="kicker"><i></i>Voxel diorama №14 · after the logbook</div>
  <h1>Harbour<br>Call<em>a barque strikes her colours</em></h1>
  <div class="rule"></div>
  <div class="specs">
    <div><b>Voxels</b><span class="dots"></span><span id="s-vox">—</span></div>
    <div><b>Vessel</b><span class="dots"></span><span>3-masted barque · 47 pts</span></div>
    <div><b>Hour</b><span class="dots"></span><span id="s-hour">golden hour</span></div>
    <div><b>Render</b><span class="dots"></span><span id="s-fps">—</span></div>
  </div>
</header>

<section class="plate dock">
  <h2>Bridge controls <span id="s-state">calm</span></h2>
  <div class="ctl"><label>Time of day <b id="l-time">golden hour</b></label>
    <input id="i-time" type="range" min="0" max="1000" value="580"></div>
  <div class="ctl"><label>Sea state <b id="l-sea">2 — slight</b></label>
    <input id="i-sea" type="range" min="0" max="100" value="38"></div>
  <div class="chips">
    <button class="chip on" id="b-orbit">Auto-orbit</button>
    <button class="chip on" id="b-gulls">Gulls</button>
    <button class="chip on" id="b-haze">Haze</button>
  </div>
</section>

<nav class="plate stations">
  <h2>Stations</h2>
  <div id="stations"></div>
</nav>

<div class="hint" id="hint"><b>drag</b> orbit &nbsp;·&nbsp; <b>scroll</b> zoom<br><b>1–6</b> stations &nbsp;·&nbsp; <b>h</b> hide ui</div>

<div class="load" id="load">
  <div class="t">HARBOUR<span>·</span>CALL</div>
  <div class="vox"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="bar"><i id="lbar"></i></div>
  <div class="s" id="ls">unrolling the chart…</div>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ══════════════════════════════════ math / helpers ══════════════════════════════════ */
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const smoothstep=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};
const RAD=Math.PI/180;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd=mulberry32(0x5EAF017);
function hash2(x,y){const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n);}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return lerp(lerp(hash2(xi,yi),hash2(xi+1,yi),u),lerp(hash2(xi,yi+1),hash2(xi+1,yi+1),u),v);}
function fbm(x,y,o=4){let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=a*vnoise(x*f,y*f);f*=2;a*=.5;}return s/.9375;}
function jit(hex,amt){const r=(hex>>16)&255,g=(hex>>8)&255,b=hex&255,d=(rnd()-.5)*2*amt;
  return (clamp(Math.round(r+d),0,255)<<16)|(clamp(Math.round(g+d*.94),0,255)<<8)|clamp(Math.round(b+d*.88),0,255);}
const frame=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));

/* ══════════════════════════════════ palette ══════════════════════════════════ */
const C={
  rockDark:0x4e575c, rock:0x6b7076, rockLit:0x8a8b83, cobble:0x7c776b, stone:0x8f8878, stoneD:0x6a6355,
  sand:0xd3bb8a, grass:0x5f7f47, grassD:0x47642f, dirt:0x7b6242,
  wood:0x7a5230, woodD:0x4a3220, woodP:0x9c7448, deck:0x9b7444, deckD:0x7d5a33,
  hull:0x3a2418, hullD:0x25170f, wale:0xd8c193, copper:0xb0743c,
  sail:0xece2c6, sailD:0xd3c4a3, rope:0x6f5a3c,
  brick:0x9d5744, plaster:0xdfd0b3, plaster2:0xc9b995, roofSl:0x3e4a56, roofR:0x95452f,
  glass:0xffd489, iron:0x2b2f33, leaf:0x4c7a3b, leaf2:0x6b8f3e, leafA:0xa8722c,
  red:0xc0392b, white:0xf2ece0, brass:0xc99b4c
};

/* ══════════════════════════════════ renderer / scene ══════════════════════════════════ */
const canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.06;
renderer.outputColorSpace=THREE.SRGBColorSpace;

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0xf2c795,0.0034);
const camera=new THREE.PerspectiveCamera(42,1,.5,4000);

const hemi=new THREE.HemisphereLight(0xa8c6e0,0x6b5636,.6); scene.add(hemi);
const amb=new THREE.AmbientLight(0xffffff,.24); scene.add(amb);
const sun=new THREE.DirectionalLight(0xffcf95,2.2); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-135,right:135,top:135,bottom:-135,near:1,far:600});
sun.shadow.bias=-0.0007; sun.shadow.normalBias=.32;
scene.add(sun,sun.target);
const fill=new THREE.DirectionalLight(0x9fc4e8,.3); fill.position.set(-60,40,60); scene.add(fill);
const lampLightA=new THREE.PointLight(0xffb066,0,60,2); lampLightA.position.set(18,12,0); scene.add(lampLightA);
const lampLightB=new THREE.PointLight(0x9fd0ff,0,80,2); lampLightB.position.set(-52,34,-6); scene.add(lampLightB);

/* shared geometry */
const BOX=new THREE.BoxGeometry(1,1,1);
const matVox=new THREE.MeshLambertMaterial();
const matEmis=new THREE.MeshLambertMaterial({color:0xffffff,emissive:0xffb45c,emissiveIntensity:0});
const matFoam=new THREE.MeshLambertMaterial({color:0xffffff,transparent:true,opacity:.9});

/* ══════════════════════════════════ terrain model ══════════════════════════════════ */
const TOWN_FRONT=32;
function shoreX(z){ return 34 + 3*Math.sin(z*.05) + 4.5*fbm(z*.045,3.7); }
function headland(x,z){
  const dx=(x+56)*1.02, dz=(z+4)*.82;
  const d=Math.hypot(dx,dz), ang=Math.atan2(dz,dx);
  const R=17+5*fbm(ang*1.7+5,2.3);
  if(d>R) return -1;
  const t=1-d/R;
  return Math.round(2+13*Math.pow(t,.78)+2.2*fbm(x*.09,z*.09));
}
function terrainTop(x,z){
  if(z>-19&&z<19&&x<TOWN_FRONT+2) return -1;      // dredged harbour basin
  const hl=headland(x,z); if(hl>=0) return hl;
  const sx=shoreX(z);
  if(x<sx) return -1;
  const t=clamp((x-sx)/40,0,1);
  let h=3+12*Math.pow(t,1.15)+3.2*fbm(x*.055,z*.055)+1.6*fbm(x*.16,z*.16,2);
  const wz=smoothstep(34,46,Math.abs(z)), wx=smoothstep(50,62,x);
  h=lerp(6.4,h,clamp(Math.max(wz,wx),0,1));
  return Math.round(h);
}

/* ══════════════════════════════════ voxel group ══════════════════════════════════ */
class Vox{
  constructor(){this.m=new Map();}
  static k(x,y,z){return (x+512)+(y+512)*1024+(z+512)*115292150; }
  has(x,y,z){return this.m.has(Vox.k(Math.round(x),Math.round(y),Math.round(z)));}
  set(x,y,z,c,sc){ if(typeof c!=='number')return; x=Math.round(x);y=Math.round(y);z=Math.round(z);
    this.m.set(Vox.k(x,y,z),{x,y,z,c,sx:sc?sc[0]:1,sy:sc?sc[1]:1,sz:sc?sc[2]:1}); }
  get(x,y,z){return this.m.get(Vox.k(Math.round(x),Math.round(y),Math.round(z)));}
  del(x,y,z){this.m.delete(Vox.k(Math.round(x),Math.round(y),Math.round(z)));}
  box(x0,y0,z0,x1,y1,z1,c,jitAmt=0){
    if(x1<x0){[x0,x1]=[x1,x0];} if(z1<z0){[z0,z1]=[z1,z0];}
    for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++) this.set(x,y,z,jitAmt?jit(c,jitAmt):c);
  }
  cyl(cx,cz,r,y0,y1,c,axis='y',jitAmt=0){
    for(let y=y0;y<=y1;y++){const rr=(typeof r==='function')?r(y):r;
      for(let x=Math.floor(cx-rr);x<=Math.ceil(cx+rr);x++)for(let z=Math.floor(cz-rr);z<=Math.ceil(cz+rr);z++)
        if((x-cx+.5)**2+(z-cz+.5)**2<=rr*rr) this.set(x,axis==='y'?y:Math.round(c),z, jitAmt?jit(c,jitAmt):c,
          axis==='y'?null:[1.4,1,1.4]);
      if(axis!=='y')for(let i=Math.floor(y);i<=Math.ceil(y);i++){}
    }
    if(axis!=='y'){ // horizontal along x
      for(let x=Math.floor(cx);x<=Math.ceil(cx);x++){const rr=(typeof r==='function')?r(x):r;
        for(let y=Math.round(c[0]-rr);y<=Math.round(c[0]+rr);y++)for(let z=Math.round(c[1]-rr);z<=Math.round(c[1]+rr);z++)
          if((y-c[0]+.5)**2+(z-c[1]+.5)**2<=rr*rr) this.set(x,y,z,jitAmt?jit(c,jitAmt):c);}
    }
  }
  toMesh({cull=true,cast=true,receive=true,mat=matVox,parent=scene}={}){
    let arr=[...this.m.values()];
    if(cull) arr=arr.filter(v=>!(this.has(v.x+1,v.y,v.z)&&this.has(v.x-1,v.y,v.z)&&this.has(v.x,v.y+1,v.z)&&
                                  this.has(v.x,v.y-1,v.z)&&this.has(v.x,v.y,v.z+1)&&this.has(v.x,v.y,v.z-1)));
    const mesh=new THREE.InstancedMesh(BOX,mat,Math.max(arr.length,1));
    mesh.castShadow=cast; mesh.receiveShadow=receive; mesh.frustumCulled=false;
    const d=new THREE.Object3D(), col=new THREE.Color();
    arr.forEach((v,i)=>{d.position.set(v.x,v.y,v.z);d.scale.set(v.sx,v.sy,v.sz);d.updateMatrix();
      mesh.setMatrixAt(i,d.matrix); mesh.setColorAt(i,col.setHex(v.c));});
    mesh.instanceMatrix.needsUpdate=true; if(mesh.instanceColor) mesh.instanceColor.needsUpdate=true;
    parent.add(mesh); window.__VOX=(window.__VOX||0)+arr.length;
    return mesh;
  }
}

/* ══════════════════════════════════ prop factory ══════════════════════════════════ */
const chimneys=[], lamps=[], winCells=[];
function tree(b,x,y,z,s=1){
  const th=2+Math.floor(rnd()*2)+(s>1.2?1:0);
  b.box(x,y,z,x,y+th,z,C.woodD);
  const r=(s>1.2?2.4:1.7), base=y+th;
  const pal=[C.leaf,C.leaf2,C.leafA]; const cc=pal[rnd()<.14?2:(rnd()<.5?0:1)];
  for(let i=0;i<Math.round(r*2.1);i++){
    const rr=r-i*.34+.4, yy=base+i;
    for(let dx=-Math.ceil(rr);dx<=Math.ceil(rr);dx++)for(let dz=-Math.ceil(rr);dz<=Math.ceil(rr);dz++)
      if(dx*dx+dz*dz<=rr*rr+rnd()*.9) b.set(x+dx,yy,z+dz,jit(cc,.12));
  }
}
function gableRoof(b,x0,z0,w,d,y,rh,cols){
  let inset=0,i=0;
  while(inset<Math.floor(w/2)){
    b.box(x0+inset,y+i,z0,x0+w-1-inset,y+i,z0+d-1,jit(cols[0],.09));
    if(inset>0) b.box(x0+inset-1,y+i,z0-1,x0+w-inset,y+i,z0-1,jit(cols[1],.08));
    if(inset>0) b.box(x0+inset-1,y+i,z0+d,x0+w-inset,y+i,z0+d-1,jit(cols[1],.08));

/* ══════════════════════════════════ THE TALL SHIP ══════════════════════════════════ */
const SHIP={x:-4,z:-2};
const ZB=-24,ZS=23, MA=[{z:-12,h:31},{z:0,h:35},{z:13,h:27}];
function hw(z){
  if(z<=ZB+2) return Math.max(.35, 3.3*Math.pow(clamp((z-ZB)/2.6,0,1),.55));
  if(z<-14){const t=(z+24)/10; return .6+5.5*Math.pow(t,.6);}
  if(z>16){const t=(23-z)/7; return 1.1+5*Math.pow(clamp(t,0,1),.8);}
  return 5.4+Math.sin((z+14)/30*Math.PI)*.9;
}
const deckY=z=>Math.round(5+1.9*clamp(Math.max((-z-15)/9,(z-15)/8),0,1));
const keelY=z=>Math.round(-5.2+2.7*Math.pow(clamp(Math.abs(z)/24,0,1),1.4));
function hullInside(x,z){return Math.abs(x)<=hw(z)&&z>=ZB&&z<=ZS;}

function buildShip(){
  const b=new Vox(), E=new Vox(), rig=[], masts=[];
  /* hull */
  for(let z=ZB;z<=ZS;z++){
    const W=Math.round(hw(z)), dy=deckY(z), ky=keelY(z), t=(z-ZB)/(ZS-ZB);
    for(let x=-W;x<=W;x++){
      for(let y=ky;y<dy;y++){
        let c=C.hull;
        if(y<ky+2) c=C.hullD; else if(y===3) c=C.wale; else if(y>=dy-1) c=jit(0x4a2d1c,.12);
        if(x===W||x===-W){
          if(y===2&&(z%3===0)&&z>-16&&z<19) c=0x14100c;
          if(y===4&&z%7===0) c=0x2a1c12;
          if(y===0&&Math.abs(x)>W-2) c=C.copper;
        }
        b.set(x,y,z,c);
      }
      if(Math.abs(x)<=W-1) b.set(x,dy,z,(z&1)?C.deck:C.deckD);
      else b.set(x,dy,z,C.woodP);
      if(Math.abs(x)===W&&dy<7) b.set(x,dy+1,z,jit(C.wood,.1));
    }
    if(z%4===0&&Math.abs(z)<20) b.set(0,ky-1,z,C.hullD);
    // forecastle + quarterdeck
    if(z>-23&&z<-15){ for(let x=-W+1;x<=W-1;x++){b.set(x,dy+1,z,(x&1)?C.deck:C.deckD); if(Math.abs(x)===W-1)b.set(x,dy+2,z,C.wood);} }
    if(z>12&&z<23){ for(let x=-W+1;x<=W-1;x++){b.set(x,dy+1,z,(x&1)?C.deck:C.deckD); if(Math.abs(x)===W-1)b.set(x,dy+2,z,C.wood);} }
    // stern gallery
    if(z>=ZS-1){ const W2=Math.round(hw(ZS-1));
      for(let x=-W2;x<=W2;x++){b.set(x,7,z,C.wale); b.set(x,6,z,jit(0x3a2418,.1)); if(Math.abs(x)<W2-1){b.set(x,6,z,C.glass);E.set(x,6,z,0xffc46a);} }
      for(let x=-W2-1;x<=W2+1;x++) b.set(x,8,z,C.wale); }
    // bowsprit
    if(z===ZB){ b.box(-1,6,z-1,1,7,z-1,C.woodD); }
  }
  b.box(-1,7,ZB-1,1,8,ZB-1,C.woodD);
  for(let i=0;i<10;i++){const t=i/9; const x=0,y=Math.round(7+4.2*t),z=Math.round(ZB-1-8*t);
    b.set(x,y,z,C.woodD); b.set(x+1,y,z,C.woodD); b.set(x-1,y,z,C.woodD);}
  for(let i=0;i<5;i++){const t=i/4; b.set(0,Math.round(11+1.6*t),Math.round(ZB-9-6*t),C.wood);}
  b.set(0,10,ZB-9,C.woodD);
  // figurehead
  for(let y=2;y<=5;y++) b.set(0,y,ZB-1,jit(0xdcc9a0,.1));
  /* masts, yards, sails */
  const S=new Vox();
  MA.forEach((m,mi)=>{
    const base=deckY(m.z)+1, top=base+m.h;
    for(let y=base;y<=top;y++){const w=(y<base+16)?1:0;
      b.box(m.z?0:0,y,-0+w,0,y,0+w,C.woodD); // placeholder replaced below
    }
    // proper 2x2 lower mast / 1x1 topmast
    for(let x=-1;x<=1;x++)for(let z=-1;z<=1;z++){
      for(let y=base;y<=base+16;y++) b.set(x,y,m.z+z,C.woodD);
      for(let y=base+16;y<=top;y++) b.set(0,y,m.z,C.woodD);
    }
    b.set(0,top+1,m.z,C.brass);
    masts.push({z:m.z,base,top});
    // crosstrees + top platform
    b.box(-2,base+16,m.z,2,base+16,m.z,C.wood);
    b.box(-1,base+17,m.z,1,base+17,m.z,C.wood);
    if(mi<2){
      const yards=[{y:base+9,r:.98,set:mi===1},{y:base+17,r:.74,set:mi===0},{y:base+24,r:.5,set:mi===1&&false}];
      if(mi===1) yards[2].set=true;
      yards.forEach((Y,yi)=>{
        const L=Math.max(2,Math.round(hw(m.z)*Y.r*1.02));
        b.box(-L,Y.y,m.z,L,Y.y,m.z,C.wood);
        b.set(-L-1,Y.y,m.z,C.woodP); b.set(L+1,Y.y,m.z,C.woodP);
        if(Y.set){
          const y0=Y.y+1, y1=(yi===2?top-1:yards[yi+1].y-1);
          for(let x=-L;x<=L;x++)for(let y=y0;y<=y1;y++){
            const u=x/L, v=(y-y0)/Math.max(1,(y1-y0));
            const belly=Math.cos(v*1.25)*Math.pow(Math.cos(u*1.42),.55);
            const zz=m.z+belly*1.7;
            if(rnd()<.012) continue;
            S.set(x,y,Math.round(zz), (Math.abs(u)>.9&&v>.5)?C.sailD:(v>.8?jit(C.sailD,.05):jit(C.sail,.05)));
          }
          // buntline gOOey bulge
          for(let x=-Math.round(L*.6);x<=Math.round(L*.6);x++) S.set(x,y0+Math.round((y1-y0)*.45),m.z+2,jit(C.sail,.06));
        }else{
          for(let x=-L;x<=L;x++){S.set(x,Y.y+1,m.z,jit(C.sailD,.07)); S.set(x,Y.y+1,m.z+1,jit(C.sail,.05));}
        }
        // braces
        rig.push([L,Y.y,m.z, Woff(m.z),deckY(m.z)+1,m.z+(mi===0?-4:4)]);
        rig.push([-L,Y.y,m.z,-Woff(m.z),deckY(m.z)+1,m.z+(mi===0?-4:4)]);
      });
    }else{
      // spanker (fore-aft) + yard
      const yb=base+3, yt=base+13;
      b.box(0,yb,m.z-1,0,yb,m.z+9,C.wood);
      b.box(0,yt,m.z-1,0,yt,m.z+7,C.wood);
      for(let z=m.z-1;z<=m.z+8;z++)for(let y=yb+1;y<=yt-1;y++){
        const t=(z-m.z)/9, belly=Math.sin(t*Math.PI)*1.6;
        S.set(Math.round(belly),y,z,jit(C.sail,.05));
      }
    }
    // shrouds
    const W=Woff(m.z);
    for(let s=-1;s<=1;s+=2){
      for(let i=0;i<4;i++){ rig.push([-W,deckY(m.z)+1,m.z-3+i*2, 0,top-2,m.z]); }
      rig.push([W,deckY(m.z)+1,m.z-3,m.z+ (mi===0?4:-4),top-2,m.z]);
    }
  });
  function Woff(mz){return Math.round(hw(mz))+0;}
  // stays
  rig.push([0,MA[0].top,MA[0].z, 0,deckY(ZB)+8,ZB-1]);
  rig.push([0,MA[1].top,MA[1].z, 0,MA[0].top-3,MA[0].z]);
  rig.push([0,MA[2].top,MA[2].z, 0,MA[1].top-3,MA[1].z]);
  rig.push([0,MA[0].top,MA[0].z, 0,deckY(ZS)+2,ZS-1]);
  rig.push([0,MA[1].top,MA[1].z, 0,deckY(ZS)+2,ZS-1]);
  // jibs (triangles in x≈0 plane)
  tri(S,[ZB-9,13.6],[MA[0].z,MA[0].top-3],[ZB-1,deckY(ZB)+8],1.4,C.sail);
  tri(S,[ZB-16,12],[MA[0].z,MA[0].top-8],[ZB-9,13.4],1.2,jit(C.sail,.04));
  tri(S,[MA[1].z,MA[1].top-4],[MA[0].z,MA[0].top-4],[MA[0].z,deckY(MA[0].z)+9],1.0,C.sailD);
  // deck clutter
  const d0=deckY(0)+1;
  [[-2,8],[4,-6],[-6,-6],[7,5]].forEach(([z,x])=>{b.box(x,d0+1,z,x+1,d0+1,z+1,C.deckD);});
  barrel(b,3,d0+1,-8); barrel(b,-3,d0+1,7); crate(b,4,d0+1,-2);
  b.cyl(.5,.5,1.4,d0+1,d0+2,C.wood,'y'); // capstan
  for(let x=-4;x<=4;x+=2) b.set(x,d0+3,-19,C.woodP);
  // ship's boat on deck
  for(let z=-4;z<=2;z++){const w=Math.round(1+ (1-Math.abs(z)/5)*1.1);
    for(let x=-w;x<=w;x++) b.set(x,d0+2,z+8,(Math.abs(x)===w)?C.woodP:C.deckD);}
  // stern + bow lanterns
  b.set(0,8,ZS-2,C.glass); E.set(0,8,ZS-2,0xffc06a); lamps.push([SHIP.x,SHIP.y+8,SHIP.z+ZS-2]);
  b.set(-3,7,ZS-1,C.glass); E.set(-3,7,ZS-1,0xffc06a);
  b.set( 3,7,ZS-1,C.glass); E.set( 3,7,ZS-1,0xffc06a);
  return {b,E,rig,masts};
}
function tri(V,a,b,c,billow,col){ // points in (z,y) plane at x=0
  const minZ=Math.min(a[0],b[0],c[0]), maxZ=Math.max(a[0],b[0],c[0]);
  const minY=Math.min(a[1],b[1],c[1]), maxY=Math.max(a[1],b[1],c[1]);
  const s1=(b[0]-a[0])*(0-a[1])-(b[1]-a[1])*(0-a[0]);
  const sign=s1<0?-1:1;
  const edge=(p0,p1,p2,px,py)=>((p1[0]-p0[0])*(py-p0[1])-(p1[1]-p0[1])*(px-p0[0]))*sign;
  for(let z=Math.round(minZ);z<=maxZ;z++)for(let y=Math.round(minY);y<=maxY;y++){
    if(edge(a,b,z,y)>=0&&edge(b,c,z,y)>=0&&edge(c,a,z,y)>=0){
      const u=clamp((z-Math.min(a[0],b[0],c[0]))/Math.max(1,(maxZ-minZ)),0,1);
      V.set(Math.round(Math.sin(u*Math.PI)*billow),y,z,jit(col,.05));
    }
  }
}

let nightF=0, seaLUT=[];
function applyTime(t){
  let i=0; while(i<TC.length-2&&t>TC[i+1].t)i++;
  const a=TC[i],b=TC[Math.min(i+1,TC.length-1)],k=(b.t===a.t)?0:clamp((t-a.t)/(b.t-a.t),0,1);
  cT.lerpColors(a.cT,b.cT,k); cM.lerpColors(a.cM,b.cM,k); cB.lerpColors(a.cB,b.cB,k);
  cS.lerpColors(a.cS,b.cS,k); cH.lerpColors(a.cH,b.cH,k); cG.lerpColors(a.cG,b.cG,k);
  cF.lerpColors(a.cF,b.cF,k); cSea.lerpColors(a.cSea,b.cSea,k); cD.lerpColors(a.cD,b.cD,k);
  const az=lerp(a.sunAz,b.sunAz,k)*RAD, el=lerp(a.sunEl,b.sunEl,k)*RAD;
  const dir=new THREE.Vector3(Math.sin(az)*Math.cos(el),Math.sin(el),Math.cos(az)*Math.cos(el)).normalize();
  skyU.top.value.copy(cT); skyU.mid.value.copy(cM); skyU.bot.value.copy(cB); skyU.sunC.value.copy(cS); skyU.sunD.value.copy(dir);
  sun.position.copy(dir).multiplyScalar(230); sun.position.y=Math.max(sun.position.y,-60);
  sun.color.copy(cS); sun.intensity=lerp(a.sunInt,b.sunInt,k);
  hemi.color.copy(cH); hemi.groundColor.copy(cG); hemi.intensity=lerp(a.hi,b.hi,k);
  amb.intensity=lerp(a.amb,b.amb,k); fill.intensity=lerp(a.fill,b.fill,k);
  renderer.toneMappingExposure=lerp(a.exp,b.exp,k);
  scene.fog.color.copy(cF);
  nightF=lerp(a.night,b.night,k);
  starMat.opacity=lerp(a.star,b.star,k)*.95;
  matEmis.emissiveIntensity=nightF*1.15+.05;
  matEmis.color.setRGB(1,1,1).multiplyScalar(1-nightF*.55);
  const seab=scene.getObjectByName('seabase'); if(seab) seab.material.color.copy(cD);
  // water LUT (dark trough → bright crest)
  seaLUT=[];
  for(let s=0;s<20;s++){const u=s/19; const c=new THREE.Color().copy(cSea).lerp(new THREE.Color(0xdff4f2),u*u*.85);
    c.lerp(cM,u*.28); seaLUT.push(c);}
  sunSprite.position.copy(dir).multiplyScalar(900); sunSprite.material.opacity=clamp(smoothstep(-.05,.12,dir.y),0,1)*(1-nightF*.7);
  sunSprite.material.color.copy(cS);
  moonSprite.position.copy(dir).multiplyScalar(-900); moonSprite.material.opacity=nightF*.9;
  beaconLight.intensity=nightF*3.4; 
  lampLightA.intensity=nightF*2.6; lampLightB.intensity=nightF*1.8;
  (window.__glows||[]).forEach(g=>g.material.opacity=nightF*.85);
  (window.__glows||[]).forEach(g=>g.material.color.setRGB(1,.78+nightF*.06,.48));
  const nm=k<.5?a.name:b.name; $('l-time').textContent=nm; $('s-hour').textContent=nm;
}

/* ══════════════════════════════════ camera controls ══════════════════════════════════ */
const cam={th:133*RAD,ph:76*RAD,r:150,tg:new THREE.Vector3(-2,12,0)};
const want={th:133*RAD,ph:76*RAD,r:150,tg:new THREE.Vector3(-2,12,0)};
let autoRot=true, dragging=false, idle=0;
const ptrs=new Map(); let pinch=0;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,btn:e.button});
  dragging=true; idle=0; canvas.classList.add('dragging'); hideHint();});
canvas.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId); if(!p)return;
  const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY; idle=0;
  if(ptrs.size>=2){const a=[...ptrs.values()];const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    if(pinch) want.r=clamp(want.r*(pinch/d),34,420); pinch=d; return;}
  if(e.shiftKey||p.btn===2||p.btn===1){
    const rt=new THREE.Vector3().setFromSpherical(new THREE.Spherical(1,cam.ph,cam.th));
    const right=new THREE.Vector3(-rt.z,0,rt.x).normalize();
    const fwd=new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0),right).normalize();
    want.tg.addScaledVector(right,-dx*.16*(cam.r/160)).addScaledVector(fwd,dy*.16*(cam.r/160));
    want.tg.x=clamp(want.tg.x,-110,110); want.tg.z=clamp(want.tg.z,-110,110); want.tg.y=clamp(want.tg.y,0,46);
  }else{ want.th-=dx*.0052; want.ph=clamp(want.ph-dy*.0048,11*RAD,86*RAD); }
});
const up=e=>{ptrs.delete(e.pointerId); if(!ptrs.size){dragging=false;pinch=0;canvas.classList.remove('dragging');}};
canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{e.preventDefault();idle=0;want.r=clamp(want.r*Math.exp(e.deltaY*.0011),34,420);},{passive:false});

const STATIONS=[
 {n:'Arrival',th:133,ph:76,r:150,t:[-2,12,0]},
 {n:'The Wharf',th:112,ph:80,r:52,t:[16,7,2]},
 {n:'Quarterdeck',th:268,ph:66,r:46,t:[-2,15,4]},
 {n:'Lighthouse Point',th:150,ph:70,r:76,t:[-48,24,-5]},
 {n:'Mill Hill',th:96,ph:62,r:88,t:[52,16,18]},
 {n:'Harbour Chart',th:126,ph:17,r:196,t:[2,6,-2]}
];
const stEl=$('stations');
STATIONS.forEach((s,i)=>{const d=document.createElement('div');d.className='st'+(i===0?' active':'');
  d.innerHTML=`<span class="n">0${i+1}</span><span class="nm">${s.n}</span><span class="ar">▸</span>`;
  d.onclick=()=>goto(i); stEl.appendChild(d);});
function goto(i){const s=STATIONS[i]; want.th=s.th*RAD; want.ph=s.ph*RAD; want.r=s.r; want.tg.set(...s.t); idle=0;
  [...stEl.children].forEach((c,j)=>c.classList.toggle('active',j===i)); hideHint();}
addEventListener('keydown',e=>{
  if(e.key>='1'&&e.key<='6')goto(+e.key-1);
  if(e.key.toLowerCase()==='h')document.body.classList.toggle('noui');
  if(e.key===' '){e.preventDefault();$('b-orbit').click();}
});

/* ══════════════════════════════════ UI wiring ══════════════════════════════════ */
$('i-time').oninput=e=>{T=e.target.value/1000; applyTime(T);};
$('i-sea').oninput=e=>{SEA=e.target.value/100; 
  const names=['0 — glassy','1 — rippled','2 — slight','3 — moderate','4 — rough'];
  $('l-sea').textContent=names[Math.min(4,Math.floor(SEA*5))];
  $('s-state').textContent=['glassy','rippled','slight','moderate','rough'][Math.min(4,Math.floor(SEA*5))];};
const toggle=(id,fn)=>{const b=$(id);b.onclick=()=>{b.classList.toggle('on');fn(b.classList.contains('on'));};};
toggle('b-orbit',v=>autoRot=v); toggle('b-gulls',v=>birds.forEach(b=>b.g.visible=v));
toggle('b-haze',v=>scene.fog.density=v?.0034:.0006);
let hintTimer=setTimeout(hideHint,9000);
function hideHint(){$('hint').classList.add('gone');clearTimeout(hintTimer);}

/* ══════════════════════════════════ animation ══════════════════════════════════ */
const clock=new THREE.Clock(); let fpsA=0,fpsN=0,fpsT=0;
const dummy=new THREE.Object3D(), tmpC=new THREE.Color(), shipWave=new THREE.Vector3();
function wave(x,z,t){
  return Math.sin(x*.085+t*1.05)*.62 + Math.sin(z*.112-t*.82)*.48 + Math.sin((x+z)*.061+t*1.5)*.4
       + Math.sin(x*.31+z*.24+t*2.4)*.2;
}
function tick(){
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;

  /* water */
  if(water){
    const amp=.55+SEA*1.75, W=water.instanceMatrix.array, col=new THREE.Color();
    for(let i=0;i<waterCells.length;i++){
      const c=waterCells[i];
      let h=wave(c.x,c.z,t)*amp*c.shelter;
      if(c.foam) h+=Math.sin(t*3.2+c.x*.5)*.18-.12;
      if(c.quay) h+=Math.sin(t*2.4+c.z*.4)*.1;
      dummy.position.set(c.x,h-.35,c.z); dummy.scale.set(c.sx,2,c.sz); dummy.rotation.set(0,0,0);
      dummy.updateMatrix(); dummy.matrix.toArray(W,i*16);
      const s=clamp(Math.round((h/(amp+.4)*.5+.5)*19),0,19);
      water.setColorAt(i,seaLUT[s]||col.setHex(0x1b6070));
    }
    water.instanceMatrix.needsUpdate=true; if(water.instanceColor)water.instanceColor.needsUpdate=true;
    if(foamMesh){
      const F=foamMesh.instanceMatrix.array;
      for(let i=0;i<foamCells.length;i++){const c=foamCells[i];
        const a=(.35+.65*(.5+.5*Math.sin(t*1.6+c.x*.3+c.z*.22)))*(c.foam?1:.55);
        dummy.position.set(c.x,wave(c.x,c.z,t)*(.55+SEA*1.75)*c.shelter+.75,c.z);
        dummy.scale.set(c.sx*.92*a,.22,c.sz*.92*a); dummy.rotation.set(0,0,0);
        dummy.updateMatrix(); dummy.matrix.toArray(F,i*16);}
      foamMesh.instanceMatrix.needsUpdate=true;
      matFoam.color.copy(new THREE.Color(0xe8f6f4).lerp(cM,.25));
      matFoam.opacity=.5+.4*(1-nightF);
    }
    shipWave.set(wave(SHIP.x,SHIP.z,t)*(.55+SEA*1.75)*.5,0,0);
  }

  /* ship */
  if(shipGroup){
    const h=wave(SHIP.x,SHIP.z,t)*(.55+SEA*1.75)*.5;
    shipGroup.position.y=h;
    shipGroup.rotation.z=Math.sin(t*.62)*(.012+SEA*.02)+Math.sin(t*1.7)*.004;
    shipGroup.rotation.x=Math.sin(t*.47+1.2)*(.006+SEA*.012);
    shipGroup.rotation.y=Math.sin(t*.31)*.006;
    shipGroup.updateMatrixWorld();
    // flags
    shipFlags.forEach(f=>{const M=f.m.instanceMatrix.array;
      for(let i=0;i<f.cells.length;i++){const c=f.cells[i];
        const u=c.x/(f.cells[f.cells.length-1].x+1);
        dummy.position.set(c.x,c.y+Math.sin(c.x*.8-t*5)*.16*u,Math.sin(c.x*1.05-t*6.2)*.55*u+u*.1);
        dummy.scale.set(1,.9,.12); dummy.rotation.set(0,0,0); dummy.updateMatrix(); dummy.matrix.toArray(M,i*16);}
      f.m.instanceMatrix.needsUpdate=true;});
    // mooring ropes
    ropes.forEach(r=>{
      const a=new THREE.Vector3(...r.from), b2=new THREE.Vector3(...r.to);
      const aa=shipGroup.localToWorld(a.clone());
      const P=r.line.geometry.attributes.position, n=P.count;
      for(let i=0;i<n;i++){const u=i/(n-1);
        const p=new THREE.Vector3().lerpVectors(aa,b2,u); p.y-=Math.sin(u*Math.PI)*(2.6+SEA*1.2);
        P.setXYZ(i,p.x,p.y,p.z);}
      P.needsUpdate=true;});
  }

  /* birds */
  birds.forEach(b=>{
    b.a+=b.sp*dt; const x=b.cx+Math.cos(b.a)*b.r0, z=b.cz+Math.sin(b.a)*b.r0*.75;
    b.g.position.set(x,b.y+Math.sin(t*1.1+b.ph)*1.6,z); b.g.rotation.y=-b.a+Math.PI/2;
    const fl=Math.sin(t*9+b.ph);
    b.l.rotation.z=fl*.9; b.r.rotation.z=-fl*.9;
  });

  /* smoke */
  if(window.__smoke){
    const {sm,parts}=window.__smoke, M=sm.instanceMatrix.array, col=new THREE.Color();
    for(let i=0;i<parts.length;i++){const p=parts[i];
      p.t+=dt*.16; if(p.t>1)p.t=0;
      const dr=p.t*7;
      dummy.position.set(p.x+dr*.35+Math.sin(p.t*5+p.x)*.5, p.y+p.t*8.5, p.z+dr*.12);
      const s=(.5+p.t*2.1)*p.r; dummy.scale.set(s,s,s); dummy.rotation.set(0,p.t*2,0);
      dummy.updateMatrix(); dummy.matrix.toArray(M,i*16);
      col.setHex(0xd8d2c8).lerp(cM,clamp(p.t*1.3,0,.92)).lerp(cB,nightF*.4);
      sm.setColorAt(i,col);}
    sm.instanceMatrix.needsUpdate=true; if(sm.instanceColor)sm.instanceColor.needsUpdate=true;
  }

  /* misc movers */
  if(beacon) beacon.rotation.y+=dt*.55;
  blades.forEach(b=>b.rotation.z+=dt*(.35+SEA*.25));
  if(clouds){clouds.position.x+=dt*(1.1+SEA*2.2); if(clouds.position.x>200)clouds.position.x-=400;}

  /* camera */
  idle+=dt; if(autoRot&&!dragging&&idle>2.5) want.th+=dt*.045;
  const k=1-Math.pow(.0015,dt);
  cam.th=lerp(cam.th,want.th,k); cam.ph=lerp(cam.ph,want.ph,k); cam.r=lerp(cam.r,want.r,k);
  cam.tg.lerp(want.tg,k);
  const sp=new THREE.Spherical(cam.r,cam.ph,cam.th);
  camera.position.setFromSpherical(sp).add(cam.tg);
  if(camera.position.y<2.4)camera.position.y=2.4;
  camera.lookAt(cam.tg);
  sun.target.position.set(cam.tg.x,0,cam.tg.z); sun.target.updateMatrixWorld();
  sun.position.copy(sun.position).setLength(240).add(new THREE.Vector3(cam.tg.x*.35,0,cam.tg.z*.35));

  renderer.render(scene,camera);

  fpsA+=dt; fpsN++;
  if(fpsA>.6){$('s-fps').textContent=Math.round(fpsN/fpsA)+' fps · '+((window.__VOX||0)/1000).toFixed(1)+'k vox';fpsA=0;fpsN=0;}
  requestAnimationFrame(tick);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight,false);});

/* ══════════════════════════════════ run ══════════════════════════════════ */
(async()=>{
  renderer.setSize(innerWidth,innerHeight,false);
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  applyTime(T);
  for(let i=0;i<tasks.length;i++){
    $('ls').textContent=tasks[i][0]+'…';
    $('lbar').style.width=((i)/tasks.length*100)+'%';
    await frame();
    tasks[i][1]();
  }
  $('lbar').style.width='100%'; $('ls').textContent='all hands on deck';
  $('s-vox').textContent=(window.__VOX||0).toLocaleString()+' placed';
  await new Promise(r=>setTimeout(r,420));
  $('load').classList.add('done');
  // cinematic arrival
  cam.r=330; cam.th=want.th-.55; cam.ph=want.ph+.18;
  tick();
})();
</script>
