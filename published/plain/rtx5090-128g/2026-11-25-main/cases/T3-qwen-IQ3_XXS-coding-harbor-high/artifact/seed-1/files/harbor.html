<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voxel Harbor — A Sailing Ship Calling at a Harbor</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #8fd3f0;
    }
    canvas { display: block; }
    #ui {
      position: fixed;
      left: 14px;
      top: 14px;
      padding: 10px 14px;
      font-family: system-ui, sans-serif;
      color: #123;
      background: rgba(255, 255, 255, 0.72);
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.4;
      pointer-events: none;
      user-select: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="ui">
    <strong>A sailing ship calling at a harbor</strong><br>
    Mouse: drag = rotate, scroll = zoom, right-drag = pan<br>
    Double-click = reset view
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ------------------------------------------------------------------
    // Renderer, scene, camera, controls
    // ------------------------------------------------------------------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x8fd3f0);
    scene.fog = new THREE.Fog(0x8fd3f0, 80, 220);

    const camera = new THREE.PerspectiveCamera(
      52,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(27, 21, 29);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(12, 5, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 6;
    controls.maxDistance = 160;
    controls.maxPolarAngle = Math.PI * 0.495;
    controls.update();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    renderer.domElement.addEventListener('dblclick', () => {
      camera.position.set(27, 21, 29);
      controls.target.set(12, 5, 0);
      controls.update();
    });

    // ------------------------------------------------------------------
    // Voxel helpers
    // ------------------------------------------------------------------
    const worldVoxels = [];
    const shipVoxels = [];
    const seen = new Set();

    function mod(n, m) {
      return ((n % m) + m) % m;
    }

    function addVoxel(arr, x, y, z, color) {
      if (x < -50 || x > 60 || z < -50 || z > 60 || y < 0 || y > 35) return;
      const k = (x + 100) * 1000000 + (y + 100) * 1000 + (z + 100);
      if (seen.has(k)) return;
      seen.add(k);
      arr.push({ x, y, z, color });
    }

    function box(arr, x1, x2, y1, y2, z1, z2, color) {
      for (let x = x1; x <= x2; x++) {
        for (let y = y1; y <= y2; y++) {
          for (let z = z1; z <= z2; z++) {
            addVoxel(arr, x, y, z, color);
          }
        }
      }
    }

    function buildInstancedMesh(voxels) {
      const geometry = new THREE.BoxGeometry(1, 1, 1);
      const material = new THREE.MeshLambertMaterial({ color: 0xffffff });
      const mesh = new THREE.InstancedMesh(geometry, material, voxels.length);

      const dummy = new THREE.Object3D();
      const color = new THREE.Color();

      for (let i = 0; i < voxels.length; i++) {
        const v = voxels[i];
        dummy.position.set(v.x + 0.5, v.y + 0.5, v.z + 0.5);
        dummy.updateMatrix();
        mesh.setMatrixAt(i, dummy.matrix);

        color.set(v.color);
        mesh.setColorAt(i, color);
      }

      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      return mesh;
    }

    // ------------------------------------------------------------------
    // Colors
    // ------------------------------------------------------------------
    const SEA_DEEP = 0x134d7e;
    const SEA_MID = 0x1f6fbf;
    const SEA_LIGHT = 0x3f99d9;

    const WALL = 0x8b94a3;
    const STONE = 0x97a1ac;
    const SAND = 0xd9bb84;
    const GRASS1 = 0x4f8b37;
    const GRASS2 = 0x5e9f43;
    const GRASS3 = 0x6fa84c;
    const DOCK_LIGHT = 0x9c6231;
    const DOCK_DARK = 0x854f27;

    const HULL_MID = 0x845429;
    const HULL_LIGHT = 0xa26731;
    const DECK = 0xd6bd83;
    const RAIL = 0x80502b;
    const MAST = 0x734a29;
    const SAIL_LIGHT = 0xf7f2e9;
    const SAIL_MID = 0xe9dfcd;
    const FLAG_RED = 0xd23643;

    // ------------------------------------------------------------------
    // Sea
    // ------------------------------------------------------------------
    for (let x = -32; x <= 21; x++) {
      for (let z = -26; z <= 26; z++) {
        const n = mod(x + z, 7);
        const c = n === 0 ? SEA_LIGHT : n < 3 ? SEA_MID : SEA_DEEP;
        addVoxel(worldVoxels, x, 0, z, c);
      }
    }

    // ------------------------------------------------------------------
    // Harbor land / quay
    // ------------------------------------------------------------------
    for (let x = 22; x <= 36; x++) {
      for (let z = -20; z <= 20; z++) {
        for (let y = 1; y <= 3; y++) {
          let c;
          if (x === 22) {
            c = WALL;
          } else if (y === 3) {
            const r = mod(x + z, 4);
            c = r === 0 ? GRASS1 : r === 1 ? GRASS2 : r === 2 ? SAND : GRASS3;
          } else {
            c = mod(x + z, 3) === 0 ? SAND : STONE;
          }
          addVoxel(worldVoxels, x, y, z, c);
        }
      }
    }

    // ------------------------------------------------------------------
    // Dock
    // ------------------------------------------------------------------
    for (let x = 19; x <= 21; x++) {
      for (let z = -8; z <= 8; z++) {
        addVoxel(worldVoxels, x, 1, z, mod(z, 2) === 0 ? DOCK_LIGHT : DOCK_DARK);
      }
    }

    // Bollards
    for (const z of [-6, -3, 3, 6]) {
      addVoxel(worldVoxels, 20, 2, z, 0x2f241e);
    }

    // Cargo crates on the dock
    addVoxel(worldVoxels, 21, 2, -4, 0x8b5a2b);
    addVoxel(worldVoxels, 21, 2, 0, 0xd59457);
    addVoxel(worldVoxels, 21, 2, 4, 0x9a6431);

    // ------------------------------------------------------------------
    // Breakwaters / harbor mouth
    // ------------------------------------------------------------------
    box(worldVoxels, 10, 22, 1, 3, 15, 16, WALL);
    box(worldVoxels, 10, 22, 1, 3, -16, -15, WALL);

    // Red beacon on north breakwater
    box(worldVoxels, 10, 10, 4, 4, 15, 15, 0x8b3030);
    addVoxel(worldVoxels, 10, 5, 15, 0xff9d9d);

    // Green beacon on south breakwater
    box(worldVoxels, 10, 10, 4, 4, -15, -15, 0x1f7d30);
    addVoxel(worldVoxels, 10, 5, -15, 0x9dff9d);

    // ------------------------------------------------------------------
    // Warehouses
    // ------------------------------------------------------------------
    function buildWarehouse(x1, x2, z1, z2, bodyColor, roofColor) {
      box(worldVoxels, x1, x2, 4, 6, z1, z2, bodyColor);

      // Windows and doors facing the harbor/water side
      for (let z = z1 + 1; z < z2; z += 2) {
        addVoxel(worldVoxels, x1 - 1, 5, z, 0xf3d26b);
        addVoxel(worldVoxels, x1 - 1, 4, z, 0x422818);
      }

      // Simple voxel roof
      let rx1 = x1, rx2 = x2, rz1 = z1, rz2 = z2;
      for (let y = 7; y <= 8; y++) {
        box(worldVoxels, rx1, rx2, y, y, rz1, rz2, roofColor);
        if (rx1 < rx2) { rx1++; rx2--; }
        if (rz1 < rz2) { rz1++; rz2--; }
      }
    }

    buildWarehouse(24, 28, -10, -4, 0xbb4e43, 0x663222);
    buildWarehouse(24, 29,   2,  6, 0x936a3c, 0x553925);

    // ------------------------------------------------------------------
    // Lighthouse
    // ------------------------------------------------------------------
    for (let y = 4; y <= 9; y++) {
      const c = mod(y, 2) === 0 ? 0xf3f1ea : 0xcb3830;
      box(worldVoxels, 30, 31, y, y, 8, 9, c);
    }
    box(worldVoxels, 30, 31, 10, 10, 8, 9, 0xfff1a2);
    box(worldVoxels, 29, 32, 11, 11, 7, 10, 0x8c2c26);

    // ------------------------------------------------------------------
    // Trees
    // ------------------------------------------------------------------
    function addTree(x, z) {
      const trunk = 0x6d4525;
      addVoxel(worldVoxels, x, 4, z, trunk);
      addVoxel(worldVoxels, x, 5, z, trunk);

      const leaf = 0x2e7c31;
      for (let y = 6; y <= 8; y++) {
        for (let dx = -1; dx <= 1; dx++) {
          for (let dz = -1; dz <= 1; dz++) {
            if (dx === 0 && dz === 0 && y > 7) continue;
            addVoxel(worldVoxels, x + dx, y, z + dz, leaf);
          }
        }
      }
    }

    const treePositions = [
      [24, -14], [26, -16], [28, -18],
      [25,   8], [27,  10], [29,  12],
      [32,  -6], [33, -10], [34,   2],
      [31,  14], [34,  12], [23,  -8]
    ];
    for (const [x, z] of treePositions) addTree(x, z);

    // ------------------------------------------------------------------
    // Sailing ship
    // Ship is placed near x = 4..18, z = 0, bow facing the harbor (+x).
    // ------------------------------------------------------------------

    const shipStart = 4;
    const shipEnd = 18;

    // Hull
    for (let x = shipStart; x <= shipEnd; x++) {
      const t = (x - shipStart) / (shipEnd - shipStart);
      const w = Math.max(2, Math.round(4 * Math.sin(Math.PI * (0.18 + 0.74 * t))));

      for (let y = 1; y <= 3; y++) {
        for (let z = -w; z <= w; z++) {
          let c;
          if (y === 3) {
            c = Math.abs(z) === w ? RAIL : DECK;
          } else {
            c = Math.abs(z) === w ? HULL_LIGHT : HULL_MID;
          }
          addVoxel(shipVoxels, x, y, z, c);
        }
      }
    }

    // Stern cabin
    box(shipVoxels, 4, 6, 4, 5, -2, 2, HULL_MID);
    addVoxel(shipVoxels, 3, 4, 0, 0xf1d279);
    addVoxel(shipVoxels, 3, 5, 0, 0xf1d279);
    addVoxel(shipVoxels, 3, 4, 1, 0x452a18);

    // Forecastle
    box(shipVoxels, 16, 18, 4, 4, -1, 1, HULL_LIGHT);

    // Bowsprit, pointing toward the dock
    box(shipVoxels, 19, 20, 4, 4, 0, 0, MAST);

    // Masts
    function addMast(x, y0, y1) {
      for (let y = y0; y <= y1; y++) {
        addVoxel(shipVoxels, x, y, 0, MAST);
      }
    }

    addMast(6, 6, 11);   // mizzen
    addMast(10, 4, 13);  // main
    addMast(15, 4, 13);  // fore

    // Sails are thick stylized blocks so they read well from many angles.
    function sail(x1, x2, y1, y2, halfZ, color) {
      box(shipVoxels, x1, x2, y1, y2, -halfZ, halfZ, color);
    }

    sail(5, 7, 6, 8, 2, SAIL_LIGHT);      // mizzen sail
    sail(8, 12, 5, 9, 3, SAIL_LIGHT);     // main sail
    sail(8, 12, 10, 12, 2, SAIL_MID);     // main top sail
    sail(13, 17, 6, 8, 2, SAIL_LIGHT);    // fore sail
    sail(14, 17, 9, 11, 1, SAIL_MID);     // fore top sail

    // Flag
    addVoxel(shipVoxels, 15, 14, 1, FLAG_RED);
    addVoxel(shipVoxels, 16, 14, 1, FLAG_RED);

    // ------------------------------------------------------------------
    // Lighting
    // ------------------------------------------------------------------
    const hemi = new THREE.HemisphereLight(0xc8e8ff, 0x4b3a22, 1.15);
    const sun = new THREE.DirectionalLight(0xfff3d8, 1.55);
    const ambient = new THREE.AmbientLight(0xffffff, 0.25);
    sun.position.set(-30, 45, 20);

    scene.add(hemi, sun, ambient);

    // ------------------------------------------------------------------
    // Build meshes
    // ------------------------------------------------------------------
    const worldMesh = buildInstancedMesh(worldVoxels);
    const shipMesh = buildInstancedMesh(shipVoxels);

    const shipGroup = new THREE.Group();
    shipGroup.add(shipMesh);

    scene.add(worldMesh);
    scene.add(shipGroup);

    // ------------------------------------------------------------------
    // Animation
    // ------------------------------------------------------------------
    const clock = new THREE.Clock();

    function animate() {
      const t = clock.getElapsedTime();

      // Gentle ship bobbing
      shipGroup.position.y = Math.sin(t * 0.9) * 0.08;
      shipGroup.rotation.z = Math.sin(t * 0.45) * 0.008;

      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    // Render immediately, then animate.
    controls.update();
    renderer.render(scene, camera);
    animate();
  </script>
</body>
</html>
