<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voxel Art — A Sailing Ship Calling at a Harbor</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #083043;
    }
    canvas {
      display: block;
      touch-action: none;
    }
    #hint {
      position: fixed;
      left: 12px;
      bottom: 12px;
      color: rgba(255,255,255,0.85);
      font-family: sans-serif;
      font-size: 14px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="hint">Drag to rotate • Wheel to zoom • Right-drag to pan</div>
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script>
    (function () {
      if (!window.THREE) {
        document.body.innerHTML =
          '<p style="color:#fff;font-family:sans-serif;margin:20px">Three.js could not load. Check your internet connection or CDN access.</p>';
        return;
      }

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x9dd8e8);
      scene.fog = new THREE.Fog(0x9dd8e8, 62, 175);

      const camera = new THREE.PerspectiveCamera(
        50,
        window.innerWidth / window.innerHeight,
        0.1,
        400
      );

      const renderer = new THREE.WebGLRenderer({ antialias: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const C = {
        sea: 0x2f7d9c,

        dock1: 0x8a5a2c,
        dock2: 0x72471f,

        stone: 0x7f8891,
        stoneDark: 0x556069,

        grass: 0x4b8a3e,
        grassDark: 0x3b6d31,

        hull: 0x402718,
        hullDark: 0x27180e,

        deck: 0x8f6237,
        deckLight: 0xa7794d,

        mast: 0x4e321e,
        mastDark: 0x312014,
        yard: 0x24170e,

        sail: 0xeef2ec,
        sailEdge: 0xc4c8c1,
        rope: 0x191b1a,

        black: 0x171a19,
        red: 0xc63f33,
        white: 0xf2f4f3,

        roof: 0x4e545c,
        interior: 0x26211e,
        window: 0x243a46,

        crate: 0x9b713d,
        crateDark: 0x6c4c25,

        lamp: 0xffd45f,

        trunk: 0x5a3821,
        leaf: 0x408a39,
        leafLight: 0x58a851,

        cloud1: 0xdce7ec,
        cloud2: 0xf2f7f8
      };

      const staticVoxels = new Map();

      function addVoxel(x, y, z, color) {
        x = Math.round(x);
        y = Math.round(y);
        z = Math.round(z);
        staticVoxels.set(`${x},${y},${z}`, color);
      }

      function fillBox(x0, y0, z0, w, h, d, color) {
        for (let x = x0; x < x0 + w; x++) {
          for (let y = y0; y < y0 + h; y++) {
            for (let z = z0; z < z0 + d; z++) {
              addVoxel(x, y, z, color);
            }
          }
        }
      }

      function shellBox(x0, y0, z0, w, h, d, color) {
        for (let x = x0; x < x0 + w; x++) {
          for (let y = y0; y < y0 + h; y++) {
            for (let z = z0; z < z0 + d; z++) {
              if (
                x === x0 ||
                x === x0 + w - 1 ||
                z === z0 ||
                z === z0 + d - 1
              ) {
                addVoxel(x, y, z, color);
              }
            }
          }
        }
      }

      function addLine(x0, y0, z0, x1, y1, z1, color, maxSteps = 200) {
        const dist = Math.hypot(x1 - x0, y1 - y0, z1 - z0);
        const steps = Math.max(1, Math.min(maxSteps, Math.ceil(dist)));
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          addVoxel(
            x0 + (x1 - x0) * t,
            y0 + (y1 - y0) * t,
            z0 + (z1 - z0) * t,
            color
          );
        }
      }

      function even(x, z) {
        return (((x + z) % 2) + 2) % 2 === 0;
      }

      function addTree(x, z) {
        fillBox(x, 1, z, 1, 3, 1, C.trunk);
        fillBox(x - 1, 4, z - 1, 3, 3, 3, C.leaf);
        fillBox(x, 7, z, 1, 1, 1, C.leafLight);
      }

      function addCloud(cx, cz) {
        fillBox(cx - 3, 28, cz - 1, 7, 1, 3, C.cloud1);
        fillBox(cx - 1, 29, cz, 3, 1, 2, C.cloud2);
        fillBox(cx, 30, cz, 1, 1, 1, C.white);
      }

      function buildWarehouse(x0, z0, w, d, h, wallColor) {
        shellBox(x0, 1, z0, w, h, d, wallColor);
        fillBox(x0 - 1, h + 1, z0 - 1, w + 2, 1, d + 2, C.roof);

        // Door facing the harbor
        fillBox(x0, 1, z0 + d - 3, 1, 2, 2, C.interior);

        // Simple window blocks
        for (let z = z0 + 2; z <= z0 + d - 3; z += 3) {
          addVoxel(x0, 3, z, C.window);
          addVoxel(x0, 4, z, C.window);
        }
      }

      function buildLighthouse() {
        // Pier extension platform
        fillBox(0, 1, 20, 5, 1, 5, C.dock2);

        // Tower
        fillBox(1, 2, 21, 3, 6, 3, C.white);
        fillBox(1, 8, 21, 3, 2, 3, C.red);
        fillBox(1, 10, 21, 3, 1, 3, C.white);
        fillBox(2, 11, 22, 1, 2, 1, C.white);
        fillBox(2, 13, 22, 1, 1, 1, C.lamp);
        fillBox(1, 14, 21, 3, 1, 3, C.red);
      }

      function buildHarbor() {
        const z0 = -18;
        const z1 = 24;

        // Dock surface
        for (let x = 0; x <= 7; x++) {
          for (let z = z0; z <= z1; z++) {
            addVoxel(x, 0, z, even(x, z) ? C.dock1 : C.dock2);
          }
        }

        // Dock wall / underside
        for (let z = z0; z <= z1; z++) {
          for (let x = 0; x <= 7; x++) {
            for (let y = -3; y <= -1; y++) {
              addVoxel(x, y, z, y === -1 ? C.stoneDark : C.stone);
            }
          }
        }

        // Harbor land and waterfront path
        for (let x = 8; x <= 34; x++) {
          for (let z = z0; z <= z1; z++) {
            const pathStripe = (((z % 4) + 4) % 4) < 2;
            if (x <= 11) {
              addVoxel(x, 0, z, pathStripe ? C.stone : C.stoneDark);
            } else {
              addVoxel(x, 0, z, even(x, z) ? C.grass : C.grassDark);
            }
          }
        }

        // Bollards along the harbor edge
        const bollardZ = [-12, -8, -4, 0, 4, 8, 12, 16];
        for (const bz of bollardZ) {
          addVoxel(0, 1, bz, C.black);
          addVoxel(0, 2, bz, C.black);
        }

        // Warehouses
        buildWarehouse(13, -6, 7, 10, 5, 0xa54a35);
        buildWarehouse(23, 9, 6, 7, 4, 0x44709a);

        // Harbor lighthouse
        buildLighthouse();
      }

      function buildDecor() {
        // Crates on the dock
        fillBox(3, 1, -12, 2, 2, 2, C.crate);
        fillBox(3, 2, -12, 2, 1, 2, C.crateDark);

        fillBox(5, 1, 2, 2, 2, 2, C.crate);
        fillBox(5, 2, 2, 2, 1, 2, C.crateDark);

        fillBox(2, 1, 16, 2, 2, 2, C.crate);
        fillBox(2, 2, 16, 2, 1, 2, C.crateDark);

        // Dock lamps
        const lampZ = [-14, -6, 6, 14];
        for (const z of lampZ) {
          fillBox(1, 1, z, 1, 2, 1, C.mastDark);
          addVoxel(1, 3, z, C.lamp);
        }

        // A few harbor trees
        addTree(12, 10);
        addTree(29, 1);
        addTree(31, -12);
      }

      function buildShip() {
        const sx = -7;
        const zmin = -14;
        const zmax = 14;

        function hullHalf(z, factor = 1) {
          const n = Math.max(-1, Math.min(1, z / 14));
          const end = Math.max(0.22, Math.pow(1 - n * n, 0.55));
          return 5.2 * end * factor;
        }

        // Solid hull, slightly rounded by layer
        for (let z = zmin; z <= zmax; z++) {
          const base = hullHalf(z);

          for (let y = -4; y <= 1; y++) {
            const hy = y + 4;

            let f = 1;
            if (hy < 1) f = 0.30;
            else if (hy < 2) f = 0.55;
            else if (hy < 3) f = 0.75;
            else if (hy < 4) f = 0.92;

            let half = base * f;
            if (half < 0.8) half = 0.8;

            const xMin = Math.round(sx - half);
            const xMax = Math.round(sx + half);
            const color = y >= 1 ? C.hull : C.hullDark;

            for (let x = xMin; x <= xMax; x++) {
              addVoxel(x, y, z, color);
            }
          }
        }

        // Black waterline stripe
        for (let z = zmin; z <= zmax; z++) {
          const half = hullHalf(z);
          const xMin = Math.round(sx - half);
          const xMax = Math.round(sx + half);

          for (let x = xMin; x <= xMax; x++) {
            if (Math.abs(x - sx) > half - 0.7) {
              addVoxel(x, 1, z, C.black);
            }
          }
        }

        // Deck
        for (let z = zmin + 1; z <= zmax - 1; z++) {
          const half = hullHalf(z, 0.82);
          if (half < 0.6) continue;

          const xMin = Math.round(sx - half);
          const xMax = Math.round(sx + half);

          for (let x = xMin; x <= xMax; x++) {
            addVoxel(x, 2, z, even(x, z) ? C.deck : C.deckLight);
          }
        }

        // Deck rails
        for (let z = zmin + 1; z <= zmax - 1; z++) {
          const half = hullHalf(z, 0.82);
          if (half < 0.8) continue;

          const xMin = Math.round(sx - half);
          const xMax = Math.round(sx + half);

          addVoxel(xMin, 3, z, C.deckLight);
          addVoxel(xMax, 3, z, C.deckLight);
        }

        // Quarterdeck and forecastle
        fillBox(sx - 4, 3, -13, 7, 1, 6, C.deckLight);
        fillBox(sx - 4, 3, 8, 7, 1, 5, C.deckLight);

        // Masts
        function mast(z, height) {
          for (let y = 2; y <= height; y++) {
            addVoxel(sx, y, z, C.mast);
          }
          addVoxel(sx, height + 1, z, C.mastDark);
        }

        mast(0, 18);    // main mast
        mast(8, 14);    // fore mast
        mast(-8, 11);   // mizzen mast

        // Yards
        function yard(y, z0, z1) {
          for (let z = z0; z <= z1; z++) {
            addVoxel(sx, y, z, C.yard);
          }
        }

        yard(7, -6, 6);
        yard(12, -6, 6);
        yard(13, -5, 5);
        yard(17, -4, 4);

        yard(7, 2, 10);
        yard(11, 2, 10);

        yard(7, -12, -5);
        yard(10, -12, -5);

        // Sails
        function sail(y0, y1, z0, z1) {
          fillBox(
            -6,
            y0,
            z0,
            1,
            y1 - y0 + 1,
            z1 - z0 + 1,
            C.sail
          );

          for (let z = z0; z <= z1; z++) {
            addVoxel(-6, y0, z, C.sailEdge);
            addVoxel(-6, y1, z, C.sailEdge);
          }
        }

        sail(7, 12, -5, 5);     // main lower
        sail(13, 17, -4, 4);    // main upper
        sail(7, 11, 2, 10);     // fore sail
        sail(7, 10, -11, -5);   // mizzen sail

        // Bowsprit
        addLine(sx, 3, 14, sx, 4, 19, C.mast);

        // Simple rigging
        addLine(sx, 4, 19, sx, 13, 8, C.rope);
        addLine(sx, 18, 0, sx, 4, -11, C.rope);

        // Small flag
        for (let x = sx; x <= sx + 1; x++) {
          addVoxel(x, 20, 0, C.red);
        }
        addVoxel(sx + 1, 20, 1, C.white);

        // Mooring lines to harbor bollards
        for (const moorZ of [-8, -4, 0, 4, 8]) {
          addLine(-4, 2, moorZ, 0, 1, moorZ, C.rope, 4);
        }
      }

      buildHarbor();
      buildDecor();
      buildShip();

      // Clouds
      addCloud(-18, -16);
      addCloud(2, 10);
      addCloud(18, -6);
      addCloud(-6, 18);
      addCloud(28, 2);

      // Convert the static voxel map into instanced meshes, grouped by color
      const grouped = new Map();
      for (const [key, color] of staticVoxels) {
        const parts = key.split(",");
        const x = Number(parts[0]);
        const y = Number(parts[1]);
        const z = Number(parts[2]);

        if (!grouped.has(color)) {
          grouped.set(color, []);
        }
        grouped.get(color).push(x, y, z);
      }

      staticVoxels.clear();

      const boxGeometry = new THREE.BoxGeometry(1, 1, 1);
      const dummy = new THREE.Object3D();

      for (const [color, coords] of grouped) {
        const count = coords.length / 3;
        if (!count) continue;

        const material = new THREE.MeshLambertMaterial({ color });
        const mesh = new THREE.InstancedMesh(boxGeometry, material, count);
        mesh.frustumCulled = false;

        for (let i = 0; i < count; i++) {
          dummy.position.set(
            coords[i * 3],
            coords[i * 3 + 1],
            coords[i * 3 + 2]
          );
          dummy.updateMatrix();
          mesh.setMatrixAt(i, dummy.matrix);
        }

        mesh.instanceMatrix.needsUpdate = true;
        scene.add(mesh);
      }

      // Animated sea surface / sea volume
      const seaGeometry = new THREE.BoxGeometry(1, 4, 1);
      const seaMaterial = new THREE.MeshLambertMaterial({ color: C.sea });

      const seaX = [];
      const seaZ = [];

      const seaX0 = -48;
      const seaX1 = -1;
      const seaZ0 = -30;
      const seaZ1 = 30;

      for (let x = seaX0; x <= seaX1; x++) {
        for (let z = seaZ0; z <= seaZ1; z++) {
          seaX.push(x);
          seaZ.push(z);
        }
      }

      const seaMesh = new THREE.InstancedMesh(
        seaGeometry,
        seaMaterial,
        seaX.length
      );
      seaMesh.frustumCulled = false;
      scene.add(seaMesh);

      // Lights
      const hemisphere = new THREE.HemisphereLight(0xbfe8ff, 0x223b44, 0.85);
      scene.add(hemisphere);

      const sun = new THREE.DirectionalLight(0xffffff, 0.8);
      sun.position.set(45, 70, -35);
      scene.add(sun);

      const lighthouseLight = new THREE.PointLight(0xffd45f, 1.2, 80);
      lighthouseLight.position.set(2, 13, 22);
      scene.add(lighthouseLight);

      // Mouse controls: orbit, zoom, right-drag pan
      const target = new THREE.Vector3(-2, 6, 0);
      let radius = 58;
      let theta = 1.05;
      let phi = 1.12;

      function updateCamera() {
        const sinPhi = Math.sin(phi);
        const cosPhi = Math.cos(phi);

        camera.position.set(
          target.x + radius * sinPhi * Math.cos(theta),
          target.y + radius * cosPhi,
          target.z + radius * sinPhi * Math.sin(theta)
        );

        camera.lookAt(target);
      }

      updateCamera();

      let dragging = 0;
      let lastX = 0;
      let lastY = 0;

      renderer.domElement.addEventListener("contextmenu", (e) => {
        e.preventDefault();
      });

      renderer.domElement.addEventListener("pointerdown", (e) => {
        dragging = e.button === 2 ? 2 : 1;
        lastX = e.clientX;
        lastY = e.clientY;
      });

      window.addEventListener("pointermove", (e) => {
        if (!dragging) return;

        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;

        if (dragging === 1) {
          theta -= dx * 0.005;
          phi -= dy * 0.005;
          phi = Math.max(0.22, Math.min(1.42, phi));
        } else {
          const sinPhi = Math.sin(phi);
          const cosPhi = Math.cos(phi);

          const dir = new THREE.Vector3(
            -sinPhi * Math.cos(theta),
            -cosPhi,
            -sinPhi * Math.sin(theta)
          );

          const right = new THREE.Vector3()
            .crossVectors(dir, new THREE.Vector3(0, 1, 0))
            .normalize();

          const upLocal = new THREE.Vector3()
            .crossVectors(right, dir)
            .normalize();

          const scale = radius * 0.0025;

          target.addScaledVector(right, -dx * scale);
          target.addScaledVector(upLocal, dy * scale);

          target.x = Math.max(-40, Math.min(40, target.x));
          target.y = Math.max(3, Math.min(22, target.y));
          target.z = Math.max(-40, Math.min(40, target.z));
        }
      });

      window.addEventListener("pointerup", () => {
        dragging = 0;
      });

      window.addEventListener("pointercancel", () => {
        dragging = 0;
      });

      renderer.domElement.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          radius += e.deltaY * 0.04;
          radius = Math.max(18, Math.min(130, radius));
        },
        { passive: false }
      );

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      const clock = new THREE.Clock();
      const seaMatrix = new THREE.Matrix4();

      function animate() {
        requestAnimationFrame(animate);

        const t = clock.getElapsedTime();

        for (let i = 0; i < seaX.length; i++) {
          const x = seaX[i];
          const z = seaZ[i];

          const y =
            -2 +
            0.18 *
              (Math.sin(x * 0.28 + z * 0.18 + t * 1.3) +
                Math.sin((x - z) * 0.17 - t * 0.9));

          seaMatrix.makeTranslation(x, y, z);
          seaMesh.setMatrixAt(i, seaMatrix);
        }

        seaMesh.instanceMatrix.needsUpdate = true;

        updateCamera();
        renderer.render(scene, camera);
      }

      animate();
    })();
  </script>
</body>
</html>
