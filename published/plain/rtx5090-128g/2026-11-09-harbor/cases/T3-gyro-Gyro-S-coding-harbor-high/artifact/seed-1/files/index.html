<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A sailing ship calling at a harbor</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c1214; }
  canvas { display: block; }
  #info {
    position: fixed;
    bottom: 12px;
    left: 12px;
    padding: 8px 10px;
    border-radius: 8px;
    background: rgba(255,255,255,.75);
    color: #111;
    font: 12px system-ui;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="info">Drag mouse to orbit · wheel to zoom · right drag to pan</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fc8d4);
scene.fog = new THREE.Fog(0x9fc8d4, 45, 160);

const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 260);
camera.position.set(26, 20, -28);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(8, 4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.45;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 8;
controls.maxDistance = 120;

const hemi = new THREE.HemisphereLight(0xe9f4ff, 0x244a58, 0.95);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffe5bd, 1.15);
sun.position.set(35, 45, -20);
scene.add(sun);

const lamp = new THREE.PointLight(0xffd36a, 1.2, 28);
lamp.position.set(22, 10, -12);
scene.add(lamp);

const palette = {
  seaDeep: 0x255c71,
  seaMid: 0x357f93,
  seaLight: 0x4f99aa,
  foam: 0xc8e4ea,

  hullDark: 0x4a382c,
  hullLight: 0x856347,
  deck: 0xba8f62,
  sail: 0xf2e7d6,
  sailShade: 0xd5c5b1,
  mast: 0x6f4e3b,
  rope: 0x9d835f,
  flag: 0xc2362c,
  window: 0x28313b,

  quayDark: 0x565249,
  quayStone: 0x8f8677,
  cobble: 0x9b9281,
  grass: 0x6e8f55,

  dock: 0x8b715a,
  crate: 0xb58a4c,
  barrel: 0x77533a,
  warehouse: 0xd9b990,
  roof: 0x8c3a31,

  crane: 0x434a57,
  red: 0xc2362c,
  green: 0x2c8f44,
  light: 0xffd97a,
  treeTrunk: 0x5a3f2b,
  treeLeaf: 0x4f7d43,
};

const boxGeo = new THREE.BoxGeometry(1, 1, 1);

const staticInstances = new Map();

function addStatic(x, y, z, sx = 1, sy = 1, sz = 1, color = 0xffffff, rx = 0, ry = 0, rz = 0) {
  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz));
  m.compose(new THREE.Vector3(x, y, z), q, new THREE.Vector3(sx, sy, sz));

  let arr = staticInstances.get(color);
  if (!arr) {
    arr = [];
    staticInstances.set(color, arr);
  }
  arr.push(m);
}

function finishStatic() {
  for (const [color, matrices] of staticInstances) {
    const material = new THREE.MeshLambertMaterial({ color, flatShading: true });
    const mesh = new THREE.InstancedMesh(boxGeo, material, matrices.length);

    for (let i = 0; i < matrices.length; i++) {
      mesh.setMatrixAt(i, matrices[i]);
    }
    mesh.instanceMatrix.needsUpdate = true;
    mesh.frustumCulled = false;
    scene.add(mesh);
  }
}

const ship = new THREE.Group();
ship.position.set(1, -0.1, 0);
scene.add(ship);

const shipMats = new Map();

function shipMaterial(color) {
  let material = shipMats.get(color);
  if (!material) {
    material = new THREE.MeshLambertMaterial({ color, flatShading: true });
    shipMats.set(color, material);
  }
  return material;
}

function addShip(x, y, z, sx = 1, sy = 1, sz = 1, color = 0xffffff, rx = 0, ry = 0, rz = 0) {
  const mesh = new THREE.Mesh(boxGeo, shipMaterial(color));
  mesh.position.set(x, y, z);
  mesh.scale.set(sx, sy, sz);
  mesh.rotation.set(rx, ry, rz);
  ship.add(mesh);
}

function addShipLine(x1, y1, z1, x2, y2, z2, thickness = 0.12, color = palette.rope) {
  const p1 = new THREE.Vector3(x1, y1, z1);
  const p2 = new THREE.Vector3(x2, y2, z2);
  const dir = p2.clone().sub(p1);
  const len = dir.length();
  if (len < 0.05) return;

  const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(1, 0, 0), dir.clone().normalize());
  const mid = p1.clone().add(p2).multiplyScalar(0.5);

  const mesh = new THREE.Mesh(boxGeo, shipMaterial(color));
  mesh.position.copy(mid);
  mesh.scale.set(len, thickness, thickness);
  mesh.quaternion.copy(q);
  ship.add(mesh);
}

function buildHarbor() {
  // Sea
  for (let x = -28; x <= 10; x += 2) {
    for (let z = -30; z <= 30; z += 2) {
      const shoreFactor = (x + 28) / 38;

      let color = palette.seaDeep;
      if (shoreFactor > 0.35) color = palette.seaMid;
      if (shoreFactor > 0.65) color = palette.seaLight;

      if (Math.sin((x * 0.25 + z * 0.17) * 1.2) > 0.45) color = palette.seaLight;

      addStatic(x, -1, z, 2, 2, 2, color);
    }
  }

  // Foam along harbor edge
  for (let z = -30; z <= 30; z += 2) {
    addStatic(11.4, -0.15, z, 2, 0.7, 2, palette.foam);
  }
  for (let z = -24; z <= 24; z += 4) {
    addStatic(9.5, -0.12, z, 2, 0.55, 2, palette.foam);
  }

  // Harbor land / quay
  for (let x = 12; x <= 24; x += 2) {
    for (let z = -30; z <= 30; z += 2) {
      let color;
      if (x === 12) color = palette.quayDark;
      else if (x === 14) color = palette.quayStone;
      else if (x < 20) color = palette.cobble;
      else color = palette.grass;

      addStatic(x, 1, z, 2, 2, 2, color);
    }
  }

  // Quay wall
  for (let z = -30; z <= 30; z += 2) {
    addStatic(12.1, 1.25, z, 2.2, 2.4, 2.2, palette.quayDark);
  }

  // Pilings
  for (let z = -26; z <= 26; z += 4) {
    addStatic(11.25, 0.35, z, 0.9, 2.2, 0.9, palette.dock);
  }

  // Bollards
  for (let z = -16; z <= 16; z += 4) {
    addStatic(14.5, 2.4, z, 0.8, 0.8, 0.8, 0x3f444a);
  }
  addStatic(14.5, 2.4, 1, 0.8, 0.8, 0.8, 0x3f444a);
  addStatic(14.5, 2.4, -1, 0.8, 0.8, 0.8, 0x3f444a);

  // Mooring ropes from ship bow to quay
  addStatic(11.8, 1.85, 0.9, 3.1, 0.22, 0.22, palette.rope, 0, 0, 0.27);
  addStatic(11.8, 1.85, -0.9, 3.1, 0.22, 0.22, palette.rope, 0, 0, 0.27);

  // Crates and barrels on quay
  addStatic(15, 2.5, -12, 1.4, 1.1, 1.2, palette.crate);
  addStatic(16, 2.4, -11, 1, 0.9, 1, palette.crate);
  addStatic(16.5, 2.35, 8, 1.2, 1, 1, palette.crate);
  addStatic(15.5, 2.35, 9, 0.8, 0.9, 0.8, palette.barrel);
  addStatic(17, 2.4, -2, 1.2, 1, 1.2, palette.crate);
  addStatic(16.5, 2.35, 2, 0.8, 0.9, 0.8, palette.barrel);
  addStatic(18, 2.5, 14, 1.4, 1.2, 1.4, palette.crate);

  // Small pier into harbor
  addStatic(8, 1.35, 10, 6, 0.9, 2.4, palette.dock);
  addStatic(7, 0.65, 10, 0.8, 1.7, 0.8, palette.dock);
  addStatic(9, 0.65, 10, 0.8, 1.7, 0.8, palette.dock);
  addStatic(11, 0.65, 10, 0.8, 1.7, 0.8, palette.dock);

  // Warehouse
  addStatic(20, 3.0, 0, 6, 4.2, 8, palette.warehouse);
  addStatic(20, 5.2, -2, 6.2, 1.4, 4, palette.roof, 0.45, 0, 0);
  addStatic(20, 5.2, 2, 6.2, 1.4, 4, palette.roof, -0.45, 0, 0);
  addStatic(20, 5.7, 0, 6, 0.7, 1.6, palette.roof);
  addStatic(17.1, 2.8, 0, 0.5, 2.6, 2.2, palette.window);

  // Crane
  addStatic(17, 2.6, 12, 1.4, 2.6, 1.4, palette.crane);
  addStatic(17, 5.4, 12, 0.8, 4.2, 0.8, palette.crane);
  addStatic(18.5, 7.4, 12, 4.2, 0.45, 0.45, palette.crane);
  addStatic(15.7, 7.4, 12, 1.2, 1.1, 1.2, palette.crane);
  addStatic(19.6, 4.6, 12, 0.22, 3.1, 0.22, palette.rope);

  // Lighthouse
  addStatic(22, 3.2, -12, 3.2, 3.2, 3.2, palette.cobble);
  addStatic(22, 6.6, -12, 2.1, 4.0, 2.1, palette.quayStone);
  addStatic(22, 5.2, -12, 2.2, 0.9, 2.2, palette.red);
  addStatic(22, 7.8, -12, 2.2, 0.9, 2.2, palette.red);
  addStatic(22, 9.1, -12, 1.8, 1.0, 1.8, palette.cobble);
  addStatic(22, 10.3, -12, 1.4, 1.0, 1.4, palette.quayStone);

  // Trees
  function addTree(x, z) {
    addStatic(x, 2.4, z, 0.5, 1.2, 0.5, palette.treeTrunk);
    addStatic(x, 3.3, z, 2.2, 1.1, 2.2, palette.treeLeaf);
    addStatic(x, 4.1, z, 1.4, 0.9, 1.4, palette.treeLeaf);
  }

  addTree(24, 22);
  addTree(24, -22);
  addTree(24, 16);
  addTree(24, -16);

  // Small boats
  function buildBoat(x, z) {
    addStatic(x, 0.25, z, 2.8, 0.8, 1.3, palette.hullDark);
    addStatic(x + 0.6, 0.45, z, 0.4, 0.35, 0.7, palette.hullLight);
    addStatic(x, 1.3, z, 0.25, 1.4, 0.25, palette.mast);
    addStatic(x + 0.35, 1.55, z, 0.25, 1.2, 1.0, palette.sail);
  }

  buildBoat(8, 22);
  buildBoat(8, -22);
  buildBoat(9, 16);
  buildBoat(9, -16);

  // Harbor buoys
  addStatic(1, 0.25, 20, 0.9, 0.7, 0.9, palette.green);
  addStatic(1, 0.25, -20, 0.9, 0.7, 0.9, palette.red);
}

function buildShip() {
  // Hull
  addShip(-1, -1, 0, 12, 2, 6, palette.hullDark);
  addShip(-1, 0.65, 0, 12, 1.3, 6, palette.hullLight);
  addShip(-1, 0.25, 0, 12.2, 0.35, 6.4, palette.hullDark);
  addShip(-1, 1.45, 0, 12, 0.35, 6, palette.deck);

  // Bow taper
  for (let x = 7; x <= 9; x += 0.5) {
    const w = Math.max(0.4, 6 - (x - 7) * 2);
    addShip(x, -1, 0, 0.7, 2, w, palette.hullDark);
    addShip(x, 0.65, 0, 0.7, 1.3, w, palette.hullLight);
    addShip(x, 1.45, 0, 0.7, 0.3, w, palette.deck);
  }

  // Railings
  addShip(-1, 1.68, 2.8, 12, 0.25, 0.25, palette.deck);
  addShip(-1, 1.68, -2.8, 12, 0.25, 0.25, palette.deck);

  // Cabin at stern
  addShip(-5.5, 2.25, 0, 3.2, 2, 5.6, palette.hullLight);
  addShip(-5.5, 3.4, 0, 3.4, 0.3, 5.8, palette.deck);

  for (let z = -2; z <= 2; z += 2) {
    addShip(-4.2, 2.35, z, 0.2, 1.2, 0.2, palette.window);
  }

  // Cargo
  addShip(0, 1.85, 1.3, 1.2, 0.85, 1.2, palette.crate);
  addShip(2, 1.85, -1.2, 1, 0.8, 1, palette.crate);
  addShip(4, 1.85, 0.8, 0.7, 0.75, 0.7, palette.barrel);
  addShip(-2, 1.85, -1.5, 0.9, 0.75, 0.9, palette.crate);
  addShip(3.5, 1.85, -2, 0.8, 0.65, 0.8, palette.barrel);
  addShip(6.2, 1.75, 0, 1.2, 0.25, 1.2, palette.rope);

  // Masts
  addShip(-4, 1.5 + 3.6 / 2, 0, 0.35, 3.6, 0.35, palette.mast);
  addShip(0, 1.5 + 5.7 / 2, 0, 0.38, 5.7, 0.38, palette.mast);
  addShip(4, 1.5 + 3.2 / 2, 0, 0.32, 3.2, 0.32, palette.mast);

  // Fore sail
  addShip(-4, 4.9, 0, 0.3, 0.3, 4.8, palette.mast);
  addShip(-4, 3.2, 0, 0.2, 2.5, 4.4, palette.sail);

  // Main sail
  addShip(0, 6.6, 0, 0.38, 0.38, 6.4, palette.mast);
  addShip(0, 4.2, 0, 0.2, 4.1, 5.8, palette.sail);
  addShip(0, 6.0, 0, 0.2, 1.4, 5.2, palette.sailShade);

  // Mizzen sail
  addShip(4, 4.6, 0, 0.32, 0.32, 4.2, palette.mast);
  addShip(4, 3.25, 0, 0.2, 2.2, 3.8, palette.sail);

  // Flag
  addShip(0, 7.25, 0, 1.0, 0.6, 0.2, palette.flag);

  // Bowsprit
  addShip(8.2, 2.15, 0, 3.2, 0.25, 0.25, palette.mast, 0, 0, 0.14);

  // Rigging
  addShipLine(-4, 5.1, -2, -2.5, 1.6, -2, 0.14, palette.rope);
  addShipLine(-4, 5.1, 2, -2.5, 1.6, 2, 0.14, palette.rope);
  addShipLine(0, 7.2, -2, 2.2, 1.6, -2, 0.14, palette.rope);
  addShipLine(0, 7.2, 2, 2.2, 1.6, 2, 0.14, palette.rope);
  addShipLine(4, 4.7, -2, 2.5, 1.6, -2, 0.14, palette.rope);
  addShipLine(4, 4.7, 2, 2.5, 1.6, 2, 0.14, palette.rope);
  addShipLine(0, 7.2, 0, 9.6, 2.25, 0, 0.14, palette.rope);
}

buildHarbor();
finishStatic();
buildShip();

const lampGlow = new THREE.Mesh(
  boxGeo,
  new THREE.MeshBasicMaterial({ color: palette.light, transparent: true, opacity: 0.9 })
);
lampGlow.position.set(22, 9.35, -12);
lampGlow.scale.set(1.7, 0.9, 1.7);
scene.add(lampGlow);

const clock = new THREE.Clock();

function animate() {
  const t = clock.getElapsedTime();

  ship.rotation.z = Math.sin(t * 0.75) * 0.03;
  ship.position.y = -0.1 + Math.sin(t * 1.1) * 0.06;

  lamp.intensity = 1.0 + 0.55 * (0.5 + 0.5 * Math.sin(t * 2.2));
  lampGlow.scale.set(
    1.7 + 0.25 * Math.sin(t * 2.2),
    0.9,
    1.7 + 0.25 * Math.sin(t * 2.2)
  );

  controls.update();
  renderer.render(scene, camera);
}

renderer.setAnimationLoop(animate);

function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}

window.addEventListener('resize', onResize);
</script>
</body>
</html>
