<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voxel Harbor: Sailing Ship Calling at Harbor</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: linear-gradient(to bottom, #95c7e3, #4f7c93 45%, #132836);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  #ui {
    position: fixed;
    top: 12px;
    left: 12px;
    color: #f2f6f7;
    background: rgba(16, 22, 27, 0.38);
    padding: 10px 12px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.35;
    pointer-events: none;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<div id="ui">Drag mouse to orbit. Scroll to zoom.</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x132836, 55, 145);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 300);
camera.position.set(28, 24, 30);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(2, 3, 2);
controls.minDistance = 8;
controls.maxDistance = 85;
controls.maxPolarAngle = Math.PI * 0.52;

const hemi = new THREE.HemisphereLight(0xc2d9e5, 0x33515d, 0.48);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffe3b6, 1.15);
sun.position.set(18, 28, 14);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);

const shadowSize = 45;
sun.shadow.camera.left = -shadowSize;
sun.shadow.camera.right = shadowSize;
sun.shadow.camera.top = shadowSize;
sun.shadow.camera.bottom = -shadowSize;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 120;
sun.shadow.bias = -0.001;

scene.add(sun);

const voxels = [];
const keyIndex = new Map();

const C = {
  water1: "#123d54",
  water2: "#16526b",
  water3: "#1c657f",
  water4: "#23748d",
  water5: "#2b839e",

  grass1: "#426d3d",
  grass2: "#518351",
  grass3: "#639759",

  sand: "#c2a779",
  sandDark: "#a4916b",

  rock: "#79817b",
  stone: "#777f85",
  stoneDark: "#606a71",

  wood: "#735434",
  woodDark: "#4e3826",
  plank: "#856a4d",

  mast: "#5f4b37",
  mastDark: "#3b3127",

  sailWhite: "#f7f7f4",
  sailCream: "#e2dbc8",
  rigging: "#263033",

  hull: "#57422c",
  hullDark: "#3e3024",
  deck: "#876c4c",
  cabin: "#7c6243",

  red: "#b14b46",
  white: "#f7f7f4",
  yellow: "#e4c358",
  blue: "#4c7b8b",
  dark: "#2f3836"
};

const waterPalette = [C.water1, C.water2, C.water3, C.water4, C.water5];

function hashIndex(a, b, n) {
  const v = (a * 15183 + b * 3111) % n;
  return ((v % n) + n) % n;
}

function addV(x, y, z, color) {
  const key = `${x},${y},${z}`;

  if (keyIndex.has(key)) {
    voxels[keyIndex.get(key)].color = color;
    return;
  }

  keyIndex.set(key, voxels.length);
  voxels.push({ x, y, z, color });
}

function fillRect(x0, x1, z0, z1, y, color) {
  for (let x = x0; x <= x1; x++) {
    for (let z = z0; z <= z1; z++) {
      addV(x, y, z, color);
    }
  }
}

function fillBox(x0, x1, y0, y1, z0, z1, color) {
  for (let x = x0; x <= x1; x++) {
    for (let y = y0; y <= y1; y++) {
      for (let z = z0; z <= z1; z++) {
        addV(x, y, z, color);
      }
    }
  }
}

function column(x, z, y0, y1, color) {
  for (let y = y0; y <= y1; y++) addV(x, y, z, color);
}

function pitchedRoof(x0, x1, z0, z1, baseY, height, color) {
  for (let h = 0; h <= height; h++) {
    const zStart = z0 + h;
    const zEnd = z1 - h;
    if (zEnd < zStart) continue;

    for (let x = x0; x <= x1; x++) {
      for (let z = zStart; z <= zEnd; z++) {
        addV(x, baseY + h, z, color);
      }
    }
  }
}

const shipBase = new THREE.Vector3(6, 1, 1);

function addShip(x, y, z, color) {
  addV(shipBase.x + x, shipBase.y + y, shipBase.z + z, color);
}

function addShipRect(x0, x1, y0, y1, z0, z1, color) {
  for (let x = x0; x <= x1; x++) {
    for (let y = y0; y <= y1; y++) {
      for (let z = z0; z <= z1; z++) {
        addShip(x, y, z, color);
      }
    }
  }
}

function addShipSail(z, y0, y1, maxW) {
  for (let y = y0; y <= y1; y++) {
    const w = Math.max(0, Math.min(maxW, y - y0));
    for (let x = -w; x <= w; x++) {
      addShip(x, y, z, C.sailWhite);
    }
  }
}

function addShipLineCube(x1, y1, z1, x2, y2, z2, color) {
  const dx = x2 - x1;
  const dy = y2 - y1;
  const dz = z2 - z1;
  const steps = Math.max(Math.abs(dx), Math.abs(dy), Math.abs(dz));

  for (let i = 0; i <= steps; i++) {
    const t = steps > 0 ? i / steps : 0;
    addV(
      shipBase.x + Math.round(x1 + dx * t),
      shipBase.y + Math.round(y1 + dy * t),
      shipBase.z + Math.round(z1 + dz * t),
      color
    );
  }
}

function landColor(x, z) {
  const h = hashIndex(x, z, 6);

  if (z <= 9) {
    return h < 4 ? C.sand : C.sandDark;
  }

  if (h < 2) return C.grass1;
  if (h < 4) return C.grass2;
  if (h < 5) return C.grass3;
  return C.rock;
}

function warehouse(x0, x1, z0, z1, wall, roof) {
  fillBox(x0, x1, 1, 3, z0, z1, wall);
  pitchedRoof(x0, x1, z0, z1, 4, 3, roof);
}

// Harbor water
for (let x = -24; x <= 24; x++) {
  for (let z = -24; z <= 24; z++) {
    addV(x, 0, z, waterPalette[hashIndex(x, z, waterPalette.length)]);
  }
}

// Harbor shoreline
for (let x = -15; x <= 15; x++) {
  for (let z = 10; z <= 18; z++) {
    addV(x, 1, z, landColor(x, z));
  }
}

for (let x = -15; x <= -12; x++) {
  for (let z = -8; z <= 18; z++) {
    addV(x, 1, z, landColor(x, z));
  }
}

for (let x = 12; x <= 15; x++) {
  for (let z = -8; z <= 18; z++) {
    addV(x, 1, z, landColor(x, z));
  }
}

// Quay edges
fillRect(-13, 13, 9, 9, C.stone);
fillRect(-12, -12, -8, 9, C.stoneDark);
fillRect(12, 12, -8, 9, C.stoneDark);

// Pier
fillRect(-2, 2, 3, 8, C.wood);

for (let z = 4; z <= 8; z += 2) {
  for (let x = -2; x <= 2; x += 2) {
    column(x, z, 0, 1, C.woodDark);
  }
}

// Bollards
for (let x = -8; x <= 8; x += 3) {
  addV(x, 2, 9, C.dark);
}

// Cargo on pier
addV(0, 1, 5, C.plank);
addV(0, 2, 5, C.sand);
addV(1, 1, 5, C.plank);
addV(1, 2, 5, C.sand);
addV(-1, 1, 5, C.plank);
addV(-1, 2, 5, C.sand);

// Small crane
column(5, 6, 0, 5, C.mastDark);
fillRect(3, 5, 6, 6, 5, C.woodDark);
fillRect(4, 4, 3, 4, 6, C.mastDark);
addV(4, 2, 6, C.stone);

// Warehouses
warehouse(-11, -7, 11, 14, C.blue, C.red);
warehouse(-2, 2, 11, 14, C.white, C.dark);
warehouse(3, 7, 11, 14, C.sand, C.sandDark);

// Lighthouse
for (let y = 1; y <= 6; y++) {
  addV(-14, y, 12, y % 2 === 0 ? C.red : C.white);
}
addV(-14, 7, 12, C.white);
addV(-14, 9, 12, C.red);

// Ship hull
for (let z = -4; z <= 4; z++) {
  const w = z > 3 ? 0 : z > 1 ? 1 : z < -3 ? 1 : 2;

  for (let y = 0; y <= 2; y++) {
    for (let x = -w; x <= w; x++) {
      addShip(x, y, z, C.hull);
    }
  }

  for (let x = -w; x <= w; x++) {
    addShip(x, 3, z, C.deck);
  }
}

// Ship cabin
addShipRect(-1, 1, 3, 4, -4, -3, C.cabin);

// Bow
addShip(0, 0, 5, C.hullDark);
addShip(0, 1, 5, C.hullDark);
addShip(0, 2, 5, C.hullDark);
addShip(0, 3, 5, C.deck);

// Bowsprit
addShipRect(0, 0, 4, 4, 6, 7, C.mastDark);

// Sails
addShipSail(0, 5, 7, 2);
addShipSail(2, 5, 6, 1);

// Yards
addShipRect(-2, 2, 4, 4, 0, C.mastDark);
addShipRect(-2, 2, 8, 8, 0, C.mastDark);
addShipRect(-1, 1, 4, 4, 2, C.mastDark);
addShipRect(-1, 1, 7, 7, 2, C.mastDark);

// Masts
addShipRect(0, 0, 3, 10, 0, C.mast);
addShipRect(0, 0, 3, 8, 2, C.mast);
addShipRect(0, 0, 3, 6, -3, C.mast);

// Pennant
addShipRect(1, 2, 10, 10, 0, C.red);
addShipRect(2, 3, 11, 11, 0, C.white);

// Rigging
addShipLineCube(1, 8, 0, 1, 3, 7, C.rigging);
addShipLineCube(-1, 8, 0, -1, 3, 7, C.rigging);
addShipLineCube(1, 8, 0, 1, 3, -4, C.rigging);
addShipLineCube(1, 7, 2, 1, 3, 7, C.rigging);
addShipLineCube(1, 7, 2, 1, 3, -3, C.rigging);
addShipLineCube(0, 6, -3, 0, 3, -5, C.rigging);

// Build instanced voxel mesh
const geometry = new THREE.BoxGeometry(0.96, 0.96, 0.96);
const material = new THREE.MeshStandardMaterial({
  vertexColors: true,
  roughness: 0.85,
  metalness: 0.0
});

const mesh = new THREE.InstancedMesh(geometry, material, voxels.length);
mesh.castShadow = true;
mesh.receiveShadow = true;

const dummy = new THREE.Object3D();

voxels.forEach((v, i) => {
  dummy.position.set(v.x, v.y, v.z);
  dummy.updateMatrix();

  mesh.setMatrixAt(i, dummy.matrix);
  mesh.setColorAt(i, new THREE.Color(v.color));
});

mesh.instanceMatrix.needsUpdate = true;
if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
mesh.computeBoundingSphere();

scene.add(mesh);

// Lighthouse lamp glow
const lamp = new THREE.Mesh(
  new THREE.BoxGeometry(0.92, 0.92, 0.92),
  new THREE.MeshStandardMaterial({
    color: C.yellow,
    emissive: C.yellow,
    emissiveIntensity: 0.85
  })
);

lamp.position.set(-14, 8, 12);
scene.add(lamp);

const lampLight = new THREE.PointLight("#ffd444", 1.3, 24);
lampLight.position.set(-14, 8, 12);
scene.add(lampLight);

// Animate
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
