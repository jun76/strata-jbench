<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voxel Harbor - Sailing Ship Calling at Harbor</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #9ad3e8;
      font-family: system-ui, Arial, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #ui {
      position: fixed;
      left: 12px;
      top: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(16, 28, 38, 0.58);
      color: #fff;
      font-size: 13px;
      line-height: 1.45;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }
    #title {
      position: fixed;
      right: 12px;
      top: 12px;
      color: #06273a;
      opacity: 0.85;
      font-size: 14px;
      pointer-events: none;
      text-shadow: 0 1px 2px #fff;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="ui">
    <b>A sailing ship calling at a harbor</b><br />
    Drag: rotate<br />
    Scroll: zoom<br />
    Right-drag: pan
  </div>

  <div id="title">Voxel harbor scene</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const canvas = document.getElementById('scene');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9ad3e8);
    scene.fog = new THREE.Fog(0x9ad3e8, 90, 230);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(34, 22, 40);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    scene.add(new THREE.HemisphereLight(0xffffff, 0x6b5233, 0.75));

    const sun = new THREE.DirectionalLight(0xfff0c8, 1.15);
    sun.position.set(52, 82, 35);
    scene.add(sun);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(4, 7, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 12;
    controls.maxDistance = 170;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.update();

    const C = {
      waterDeepDark: 0x173a56,
      waterDeep: 0x1f5b86,
      waterMid: 0x2f76a4,
      water: 0x3d90bd,
      waterLight: 0x68b8de,
      waterFoam: 0xbfe8f3,

      seabed: 0x533a28,
      grass: 0x49a24b,
      dirt: 0x8a6a41,
      sand: 0xd8c07a,

      stone: 0x8d8d8d,
      stoneDark: 0x5f6668,
      stoneLight: 0xa8adab,

      wood: 0x8e5a2d,
      woodLight: 0xba7f44,
      woodDark: 0x4e2e1c,
      mast: 0x5d3e2a,

      sail: 0xe8dec3,
      sail2: 0xf4eed9,
      flag: 0xc93832,
      flagGold: 0xe8b04b,

      crate: 0x7a5131,
      crateDark: 0x4e331f,
      barrel: 0x8b5a2b,

      wall: 0xd9c7a4,
      wallLight: 0xe7d7b8,
      roof: 0x8f3d35,
      roof2: 0x4d6571,

      glass: 0x77d1ff,
      lantern: 0xffd26a,
      metal: 0x8f99a1,
      rope: 0x3c2a1f,
      white: 0xf5f7f8,
      black: 0x101010
    };

    const voxels = [];

    function addVoxel(x, y, z, color) {
      voxels.push({ x, y, z, color });
    }

    function addBox(x0, x1, y0, y1, z0, z1, color) {
      if (x0 > x1) [x0, x1] = [x1, x0];
      if (y0 > y1) [y0, y1] = [y1, y0];
      if (z0 > z1) [z0, z1] = [z1, z0];

      for (let x = x0; x <= x1; x++) {
        for (let y = y0; y <= y1; y++) {
          for (let z = z0; z <= z1; z++) {
            addVoxel(x, y, z, color);
          }
        }
      }
    }

    function addRect(x0, x1, z0, z1, y, color) {
      if (x0 > x1) [x0, x1] = [x1, x0];
      if (z0 > z1) [z0, z1] = [z1, z0];

      for (let x = x0; x <= x1; x++) {
        for (let z = z0; z <= z1; z++) {
          addVoxel(x, y, z, color);
        }
      }
    }

    function addLine(x0, y0, z0, x1, y1, z1, color) {
      const dx = x1 - x0;
      const dy = y1 - y0;
      const dz = z1 - z0;
      const steps = Math.max(Math.abs(dx), Math.abs(dy), Math.abs(dz));

      if (steps === 0) {
        addVoxel(x0, y0, z0, color);
        return;
      }

      for (let i = 0; i <= steps; i++) {
        const x = Math.round(x0 + (dx * i) / steps);
        const y = Math.round(y0 + (dy * i) / steps);
        const z = Math.round(z0 + (dz * i) / steps);
        addVoxel(x, y, z, color);
      }
    }

    function waterColor(x, z) {
      const t =
        Math.sin(x * 0.31 + z * 0.41) +
        Math.cos(z * 0.19 - x * 0.11);

      let c = C.waterMid;

      if (t > 1.15) c = C.waterLight;
      else if (t > 0.15) c = C.water;
      else if (t > -0.85) c = C.waterMid;
      else c = C.waterDeep;

      if (Math.abs((x * 17 + z * 29) % 101) === 0) c = C.waterFoam;

      return c;
    }

    function addWater() {
      for (let x = -44; x <= 44; x++) {
        for (let z = -44; z <= 44; z++) {
          addVoxel(x, 0, z, waterColor(x, z));
          addVoxel(x, -1, z, C.waterDeep);
          addVoxel(x, -2, z, C.waterDeepDark);
          addVoxel(x, -3, z, C.seabed);
        }
      }
    }

    function addLand() {
      for (let x = -42; x <= -14; x++) {
        for (let z = -42; z <= 38; z++) {
          let h = 2;
          const n = Math.abs((x * 17 + z * 31) % 101);

          if (n < 8) h = 4;
          else if (n < 32) h = 3;

          if (z >= -11 && z <= 11) h = 2;

          for (let y = 1; y <= h; y++) {
            let c = C.stone;
            if (y === 1) c = C.dirt;
            if (y === h) c = C.grass;
            if (n >= 40 && n < 44) c = C.stoneDark;

            addVoxel(x, y, z, c);
          }
        }
      }

      for (let z = -42; z <= 38; z++) {
        addVoxel(-14, 1, z, C.sand);
        addVoxel(-14, 2, z, C.sand);
      }

      for (let z = -38; z <= 38; z += 4) {
        addVoxel(-15, 1, z, C.stoneDark);
        addVoxel(-15, 2, z, C.stone);
        addVoxel(-15, 3, z, C.stoneLight);
      }

      for (let z = -42; z <= 38; z++) {
        addVoxel(-15, 0, z, C.waterFoam);
      }
    }

    function addLamp(x, z) {
      for (let y = 3; y <= 8; y++) addVoxel(x, y, z, C.metal);
      addVoxel(x + 1, 8, z, C.metal);
      addVoxel(x, 9, z, C.lantern);
      addVoxel(x, 10, z, C.metal);
    }

    function addFlagPole(x, z) {
      for (let y = 3; y <= 10; y++) addVoxel(x, y, z, C.mast);
      for (let i = 1; i <= 3; i++) addVoxel(x + i, 10, z, C.flag);
      addVoxel(x + 2, 9, z, C.flag);
    }

    function addCrate(x, z) {
      for (let dx = 0; dx <= 1; dx++) {
        for (let dz = 0; dz <= 1; dz++) {
          for (let y = 3; y <= 4; y++) {
            const c = (x + z + y) % 2 === 0 ? C.crate : C.crateDark;
            addVoxel(x + dx, y, z + dz, c);
          }
        }
      }
    }

    function addBarrelAt(x, y, z) {
      addVoxel(x, y, z, C.crateDark);
      addVoxel(x, y + 1, z, C.barrel);
    }

    function addDock() {
      for (const x of [-11, -7, -3]) {
        for (const z of [-4, 0, 4]) {
          addVoxel(x, 1, z, C.woodDark);
          addVoxel(x, 0, z, C.woodDark);
        }
      }

      for (let x = -12; x <= -1; x++) {
        for (let z = -5; z <= 4; z++) {
          addVoxel(x, 2, z, z % 2 === 0 ? C.woodLight : C.wood);
        }
      }

      for (let x = -12; x <= -1; x++) {
        if (x % 2 === 0) addVoxel(x, 3, -5, C.woodDark);
        addVoxel(x, 4, -5, C.woodLight);

        if (x % 2 === 0) addVoxel(x, 3, 4, C.woodDark);
        addVoxel(x, 4, 4, C.woodLight);
      }

      for (const x of [-8, -4, -1]) {
        for (const z of [4, -4]) {
          addVoxel(x, 3, z, C.crateDark);
          addVoxel(x, 4, z, C.crate);
        }
      }

      addLamp(-11, -5);
      addLamp(-11, 4);

      addFlagPole(-12, -5);
      addFlagPole(-12, 4);

      addCrate(-10, -4);
      addCrate(-11, -2);
      addCrate(-9, -3);
      addCrate(-10, 2);

      addBarrelAt(-10, 3, -3);
      addBarrelAt(-7, 3, -2);
      addBarrelAt(-11, 3, 3);
      addBarrelAt(-4, 3, -3);
    }

    function addHouse(x0, z0, w, d, h, wallColor, roofColor) {
      const x1 = x0 + w - 1;
      const z1 = z0 + d - 1;

      for (let x = x0; x <= x1; x++) {
        for (let z = z0; z <= z1; z++) {
          for (let y = 3; y < 3 + h; y++) {
            addVoxel(x, y, z, wallColor);
          }
        }
      }

      const roofH = Math.ceil(Math.min(w, d) / 2);
      for (let i = 0; i < roofH; i++) {
        addRect(
          x0 + i,
          x1 - i,
          z0 + i,
          z1 - i,
          3 + h + i,
          roofColor
        );
      }

      for (let x = x0 + 1; x <= x1 - 1; x += 2) {
        addVoxel(x, 4, z0, C.glass);
        addVoxel(x, 4, z1, C.glass);
      }

      for (let z = z0 + 1; z <= z1 - 1; z += 2) {
        addVoxel(x0, 4, z, C.glass);
        addVoxel(x1, 4, z, C.glass);
      }

      const doorX = x0 + Math.floor(w / 2);
      addVoxel(doorX, 3, z0, C.woodDark);
      addVoxel(doorX, 4, z0, C.woodDark);
    }

    function addMarket(x, z) {
      for (const dx of [0, 3]) {
        for (const dz of [0, 3]) {
          for (let y = 3; y <= 5; y++) {
            addVoxel(x + dx, y, z + dz, C.woodDark);
          }
        }
      }

      addRect(x, x + 3, z, z + 3, 4, C.woodLight);
      addRect(x, x + 3, z, z + 3, 5, C.roof2);
      addRect(x + 1, x + 2, z + 1, z + 2, 6, C.roof2);

      addVoxel(x + 1, 4, z + 1, C.flag);
      addVoxel(x + 2, 4, z + 1, C.grass);
      addVoxel(x + 1, 4, z + 2, C.flagGold);
      addVoxel(x + 2, 4, z + 2, C.crate);
    }

    function addBuildings() {
      addHouse(-30, 8, 5, 4, 4, C.wall, C.roof);
      addHouse(-25, 10, 4, 5, 5, C.wallLight, C.roof);
      addHouse(-31, -14, 4, 4, 4, C.wall, C.roof2);
      addHouse(-26, -10, 5, 3, 3, C.wallLight, C.roof);
      addHouse(-22, 5, 4, 3, 3, C.wall, C.roof2);
      addHouse(-21, -8, 3, 3, 2, C.wall, C.roof2);

      addMarket(-18, 12);
      addMarket(-18, -12);
    }

    function addLighthouse(x, z) {
      addBox(x - 1, x + 1, 1, 3, z - 1, z + 1, C.stoneDark);

      for (let y = 4; y <= 13; y++) {
        const c = y % 4 < 2 ? C.white : C.flag;
        for (let dx = -1; dx <= 1; dx++) {
          for (let dz = -1; dz <= 1; dz++) {
            addVoxel(x + dx, y, z + dz, c);
          }
        }
      }

      addBox(x - 1, x + 1, 14, 15, z - 1, z + 1, C.metal);

      for (let dx = -1; dx <= 1; dx++) {
        for (let dz = -1; dz <= 1; dz++) {
          addVoxel(x + dx, 14, z + dz, C.glass);
        }
      }

      addBox(x - 1, x + 1, 16, 16, z - 1, z + 1, C.roof2);
      addVoxel(x, 17, z, C.flagGold);

      addVoxel(x, 6, z - 1, C.glass);
      addVoxel(x, 9, z + 1, C.glass);
    }

    function addCloud(x, z) {
      addBox(x, x + 4, 22, 23, z, z + 3, C.sail);
      addBox(x + 1, x + 3, 24, 24, z + 1, z + 2, C.sail2);
      addBox(x - 1, x + 5, 21, 21, z + 1, z + 2, C.sail2);
    }

    function addClouds() {
      addCloud(-22, -28);
      addCloud(8, 30);
      addCloud(-8, 18);
      addCloud(16, -24);
      addCloud(-34, -2);
      addCloud(30, 8);
    }

    function addBird(x, y, z) {
      addVoxel(x, y, z, C.white);
      addVoxel(x + 1, y + 1, z, C.white);
      addVoxel(x - 1, y + 1, z, C.white);
    }

    function addBirds() {
      const spots = [
        [-12, 20, -8],
        [-4, 22, 4],
        [4, 21, -14],
        [12, 23, 12],
        [20, 20, -4],
        [28, 22, 6],
        [-18, 21, 16],
        [2, 24, 22]
      ];

      for (const [x, y, z] of spots) addBird(x, y, z);
    }

    function zRangeFor(x) {
      if (x <= -3) return [0, 0];
      if (x === -2) return [0, 0];
      if (x === -1) return [-1, 1];
      if (x === 0) return [-2, 2];
      if (x === 1) return [-3, 3];
      if (x >= 2 && x <= 16) return [-4, 4];
      if (x === 17) return [-3, 3];
      if (x === 18) return [-2, 2];
      return [0, 0];
    }

    function addSternCastle() {
      for (let x = 13; x <= 18; x++) {
        for (let z = -3; z <= 3; z++) {
          addVoxel(x, 5, z, C.woodDark);
        }
      }

      for (let x = 13; x <= 18; x++) {
        for (let z = -3; z <= 3; z++) {
          const wall = z === -3 || z === 3 || x === 13 || x === 18;
          addVoxel(x, 6, z, wall ? C.woodLight : C.woodDark);
        }
      }

      for (let x = 13; x <= 18; x++) {
        for (let z = -3; z <= 3; z++) {
          addVoxel(x, 7, z, C.woodLight);
        }
      }

      for (let x = 14; x <= 17; x++) {
        addVoxel(x, 6, -3, C.glass);
        addVoxel(x, 6, 3, C.glass);
      }

      for (let z = -2; z <= 2; z++) {
        addVoxel(18, 6, z, C.glass);
      }
    }

    function addForecastle() {
      for (let x = -1; x <= 3; x++) {
        for (let z = -2; z <= 2; z++) {
          addVoxel(x, 5, z, C.woodDark);
        }
      }

      for (let x = -1; x <= 3; x++) {
        for (let z = -2; z <= 2; z++) {
          const wall = z === -2 || z === 2 || x === -1 || x === 3;
          addVoxel(x, 6, z, wall ? C.woodLight : C.woodDark);
        }
      }

      for (let x = -1; x <= 3; x++) {
        for (let z = -2; z <= 2; z++) {
          addVoxel(x, 7, z, C.woodLight);
        }
      }

      for (let x = 0; x <= 2; x++) {
        addVoxel(x, 6, -2, C.glass);
        addVoxel(x, 6, 2, C.glass);
      }
    }

    function addMast(x, y0, y1) {
      for (let y = y0; y <= y1; y++) addVoxel(x, y, 0, C.mast);
    }

    function addSail(x0, x1, y0, y1, z0, z1, c1, c2) {
      for (let y = y0; y <= y1; y++) {
        for (let x = x0; x <= x1; x++) {
          for (let z = z0; z <= z1; z++) {
            const c = (x + y + z) % 4 === 0 ? c2 : c1;
            addVoxel(x, y, z, c);
          }
        }
      }
    }

    function addMastFlag(x, y) {
      for (let i = 1; i <= 3; i++) addVoxel(x + i, y, 0, C.flag);
      addVoxel(x + 2, y - 1, 0, C.flag);
      addVoxel(x + 1, y + 1, 0, C.flagGold);
    }

    function addCargoOnShip() {
      for (let x = 3; x <= 5; x++) {
        for (let z = -1; z <= 1; z++) {
          for (let y = 5; y <= 6; y++) {
            const c = (x + z + y) % 2 === 0 ? C.crate : C.crateDark;
            addVoxel(x, y, z, c);
          }
        }
      }

      const barrels = [
        [7, -2],
        [7, 2],
        [9, -2],
        [11, 2],
        [6, 0],
        [12, 0]
      ];

      for (const [x, z] of barrels) addBarrelAt(x, 5, z);
    }

    function addWake() {
      for (let x = -3; x <= 19; x++) {
        const [z0, z1] = zRangeFor(x);

        for (let z = z0 - 1; z <= z1 + 1; z++) {
          if (z < z0 || z > z1) addVoxel(x, 0, z, C.waterFoam);
        }
      }

      for (let i = 0; i < 18; i++) {
        const x = -4 + ((i * 13) % 24);
        const z = ((i * 7) % 12) - 6;
        addVoxel(x, 0, z, C.waterFoam);
      }
    }

    function addShip() {
      for (let x = -2; x <= 18; x++) {
        const [z0, z1] = zRangeFor(x);

        for (let z = z0; z <= z1; z++) {
          addVoxel(x, 2, z, C.woodDark);
          addVoxel(x, 3, z, z === z0 || z === z1 ? C.wood : C.woodDark);
          addVoxel(x, 4, z, C.woodLight);
        }

        for (let z = z0; z <= z1; z++) {
          if (z === z0 || z === z1) addVoxel(x, 5, z, C.woodLight);
        }

        if (x === -2 || x === 18) {
          for (let z = z0; z <= z1; z++) addVoxel(x, 5, z, C.woodLight);
        }

        if (x >= 5 && x <= 15 && x % 3 === 0) {
          addVoxel(x, 3, z0, C.black);
          addVoxel(x, 3, z1, C.black);
        }
      }

      for (let x = 0; x <= 16; x++) addVoxel(x, 1, 0, C.woodDark);

      addVoxel(-2, 4, 0, C.wood);
      addVoxel(-2, 5, 0, C.wood);
      addVoxel(-2, 6, 0, C.woodDark);

      for (let x = -6; x <= -2; x++) addVoxel(x, 5, 0, C.mast);

      addVoxel(-2, 1, 0, C.metal);
      addVoxel(-3, 1, 0, C.metal);
      addVoxel(-1, 1, 0, C.metal);
      addVoxel(-2, 0, 0, C.metal);

      addSternCastle();
      addForecastle();

      addMast(8, 5, 16);
      addMast(-1, 5, 14);
      addMast(16, 5, 13);

      for (let x = 4; x <= 12; x++) addVoxel(x, 12, 0, C.mast);
      for (let x = -3; x <= 3; x++) addVoxel(x, 10, 0, C.mast);
      for (let x = 14; x <= 18; x++) addVoxel(x, 10, 0, C.mast);

      addSail(5, 11, 8, 11, -3, 3, C.sail, C.sail2);
      addSail(6, 10, 12, 13, -2, 2, C.sail2, C.sail);

      addSail(-3, 3, 8, 10, -2, 2, C.sail, C.sail2);
      addSail(-2, 2, 11, 12, -1, 1, C.sail2, C.sail);

      addSail(14, 18, 8, 10, -2, 2, C.sail, C.sail2);
      addSail(15, 17, 11, 12, -1, 1, C.sail2, C.sail);

      addSail(-6, -1, 7, 9, -1, 1, C.sail2, C.sail);

      addMastFlag(8, 16);
      addMastFlag(-1, 14);
      addMastFlag(16, 13);

      for (let i = 1; i <= 4; i++) addVoxel(18 + i, 7, 0, C.flag);
      addVoxel(20, 6, 0, C.flagGold);

      addLine(8, 14, 0, 8, 4, -4, C.rope);
      addLine(8, 14, 0, 8, 4, 4, C.rope);

      addLine(-1, 13, 0, -1, 4, -3, C.rope);
      addLine(-1, 13, 0, -1, 4, 3, C.rope);

      addLine(16, 12, 0, 16, 4, -3, C.rope);
      addLine(16, 12, 0, 16, 4, 3, C.rope);

      addLine(-6, 5, 0, -1, 13, 0, C.rope);
      addLine(-2, 4, 0, -1, 13, 0, C.rope);
      addLine(-1, 13, 0, 8, 14, 0, C.rope);
      addLine(8, 14, 0, 16, 12, 0, C.rope);

      addLine(-2, 3, 0, -8, 3, 4, C.rope);
      addLine(-2, 3, 0, -8, 3, -4, C.rope);

      addCargoOnShip();
      addWake();
    }

    addWater();
    addLand();
    addDock();
    addBuildings();
    addLighthouse(-30, -18);
    addShip();
    addClouds();
    addBirds();

    const geometry = new THREE.BoxGeometry(1, 1, 1);
    const material = new THREE.MeshLambertMaterial({ color: 0xffffff });

    const mesh = new THREE.InstancedMesh(geometry, material, voxels.length);
    mesh.frustumCulled = false;

    const dummy = new THREE.Object3D();
    const color = new THREE.Color();

    for (let i = 0; i < voxels.length; i++) {
      const v = voxels[i];

      dummy.position.set(v.x + 0.5, v.y + 0.5, v.z + 0.5);
      dummy.updateMatrix();
      mesh.setMatrixAt(i, dummy.matrix);

      color.setHex(v.color);
      mesh.setColorAt(i, color);
    }

    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;

    scene.add(mesh);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
