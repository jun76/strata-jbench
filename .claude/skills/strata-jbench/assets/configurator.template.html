<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>strata-jbench configurator</title>
<style>
:root{--bg:#f6f6f3;--card:#fff;--ink:#1d1f23;--mute:#5f6670;--line:#dfe2e6;--soft:#f0f2f4;--acc:#0b8a69;--acc-ink:#fff;--acc2:#e7f5f0;--warn:#a8540a;--warn2:#fdf1e2;--ok2:#e3f4ee;
 --c0:#0b8a69;--c1:#2f6fde;--c2:#c2410c;--c3:#7c3aed;--c4:#0e7490;--c5:#be185d;--c6:#4d7c0f;--c7:#a16207;--c8:#475569;--c9:#b91c1c;--c10:#1d4ed8;--launch:#9aa1ab;--shadow:0 1px 2px rgba(20,24,30,.05)}
:root[data-theme="dark"]{--bg:#14161a;--card:#1c1f24;--ink:#e6e8eb;--mute:#9da4ae;--line:#30353c;--soft:#252930;--acc:#3ecfa5;--acc-ink:#062a20;--acc2:#15322b;--warn:#f0b35a;--warn2:#3a2c16;--ok2:#17352d;--launch:#5b626c;--shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1c1f24;--ink:#e6e8eb;--mute:#9da4ae;--line:#30353c;--soft:#252930;--acc:#3ecfa5;--acc-ink:#062a20;--acc2:#15322b;--warn:#f0b35a;--warn2:#3a2c16;--ok2:#17352d;--launch:#5b626c;--shadow:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.75 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Noto Sans SC","Yu Gothic UI",sans-serif;overflow-wrap:anywhere}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
code{font:0.92em/1.5 ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;background:var(--soft);border-radius:4px;padding:1px 5px}
header{background:var(--card);border-bottom:1px solid var(--line)}
header .in{max-width:1320px;margin:0 auto;padding:18px 20px 16px;display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
header h1{font-size:19px;line-height:1.4;margin:0;flex:1 1 auto;letter-spacing:.01em}
header h1 span{font-weight:500;color:var(--mute);margin-left:6px}
header .sub{color:var(--mute);font-size:13.5px;line-height:1.75;flex:1 1 100%;max-width:78ch;margin:0}
header .meta{color:var(--mute);font-size:12px;flex:1 1 100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:5px 12px;line-height:1.5;cursor:pointer;font-size:13.5px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--acc);color:var(--acc-ink);font-weight:600}
main{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;padding:20px;max-width:1320px;margin:0 auto;align-items:start}
@media (max-width:1040px){main{grid-template-columns:minmax(0,1fr);padding:16px}aside{position:static!important;max-height:none!important;overflow:visible!important}}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px 22px;margin:0 0 18px;box-shadow:var(--shadow)}
section>h2{font-size:16px;line-height:1.5;margin:0 0 6px;display:flex;gap:10px;align-items:center}
section>h2 .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--acc);color:var(--acc-ink);font-size:12.5px;font-weight:700;flex:none}
.lead{color:var(--mute);font-size:13.5px;line-height:1.75;margin:0 0 16px;max-width:70ch}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:12px;padding:16px 18px;cursor:pointer;background:var(--card);color:inherit;font:inherit;text-align:left;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:8px;min-width:0;width:100%;transition:border-color .12s,background .12s}
.card:hover{border-color:var(--acc)}
.card.on{border-color:var(--acc);background:var(--acc2);box-shadow:inset 0 0 0 1px var(--acc)}
.card.off{opacity:.5;cursor:not-allowed}.card.off:hover{border-color:var(--line)}
.card .t{font-weight:700;font-size:15px;line-height:1.5;display:flex;gap:9px;align-items:flex-start}
.card .t .sw{width:11px;height:11px;border-radius:3px;flex:none;margin-top:6px}
.card .q{font-size:14px;line-height:1.7;margin:0}
.card .d{color:var(--mute);font-size:13px;line-height:1.75;margin:0}
.small{color:var(--mute);font-size:12.5px;line-height:1.7}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;min-width:0}
.tag{display:inline-block;max-width:100%;background:var(--soft);color:var(--mute);border-radius:6px;padding:2px 9px;font-size:12px;line-height:1.6;white-space:normal}
.tag.id{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;font-size:11.5px}
.tag.g{background:var(--ok2);color:var(--acc)}
.tag.w{background:var(--warn2);color:var(--warn)}
.row{display:flex;gap:8px 10px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 14px;line-height:1.5;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--acc)}
.btn.on,.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
select.btn{padding:8px 12px;max-width:100%;min-width:min(100%,340px)}
#env-info{margin-top:10px}#track-info{margin-top:2px}#tracks{margin:16px 0 6px}
.tablewrap{border:1px solid var(--line);border-radius:10px;overflow:hidden}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;line-height:1.6}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.models td:first-child{width:38px;padding-right:0}
.models input{width:16px;height:16px;accent-color:var(--acc);vertical-align:middle;margin:0}
.models tr.base td{background:var(--soft);font-weight:600;font-size:13px;color:var(--mute);padding:8px 12px}
.models tr.dis{opacity:.45}
.models label{display:block;font-weight:600}
.models .small{display:block;margin-top:1px}
label{cursor:pointer}
details{margin-top:2px}
details summary{cursor:pointer;color:var(--acc);font-size:12.5px;line-height:1.7;list-style-position:inside}
details .small{margin-top:6px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--soft);border-radius:10px;padding:12px 14px;font:12.5px/1.7 ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;margin:8px 0 0;max-height:280px;overflow:auto}
aside{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;scrollbar-width:thin}
aside section{padding:18px 20px 20px;margin-bottom:14px}
aside section>h2{font-size:14.5px;margin-bottom:10px}
.big{font-size:30px;line-height:1.3;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
#total-sub{margin-top:2px}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--soft);margin:14px 0 12px;gap:2px}
.bar i{display:block;height:100%;min-width:2px}
.legend div{display:flex;gap:9px;align-items:center;font-size:13px;line-height:1.5;padding:4px 0}
.legend span.sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend span.v{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--mute);white-space:nowrap}
.legend .disk{border-top:1px solid var(--line);margin-top:8px;padding-top:10px;color:var(--mute)}
#est-note{margin-top:10px}
.hl{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.65}
.hl:first-child{padding-top:0}.hl:last-child{border-bottom:0;padding-bottom:0}
.hl .dot{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:none;background:var(--line)}
.hl.on .dot{background:var(--acc)}
.hl .name{font-weight:700}.hl .name code{background:none;padding:0;margin-right:6px;color:var(--acc)}
.hl:not(.on) .name code{color:var(--mute)}
.hl .small{margin-top:3px}
.matrix table{font-size:13px}
.matrix th,.matrix td{padding:6px 4px;border-bottom:1px solid var(--line)}
.matrix td:first-child{padding-left:0;line-height:1.5}
.matrix th.c,.matrix td.c{text-align:center;width:26px}
.matrix th.c i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:middle}
.matrix td.c i{display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--soft);vertical-align:middle}
.matrix td.c i.on{background:var(--acc)}
.keys{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:12px}
.keys span{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--mute);line-height:1.6}
.keys i{width:10px;height:10px;border-radius:3px;flex:none}
#recipe{margin:0 0 14px;font-size:13px}
#recipe-note{margin-top:4px}
.empty{color:var(--mute);font-size:13.5px}
</style>
</head>
<body>
<header><div class="in">
  <h1>strata-jbench<span id="t-title"></span></h1>
  <div class="seg" id="lang"></div>
  <div class="seg" id="theme"></div>
  <p class="sub" id="t-sub"></p>
  <div class="meta" id="t-meta"></div>
</div></header>
<main>
<div>
  <section><h2><span class="n">1</span><span id="h-env"></span></h2><p class="lead" id="l-env"></p>
    <select id="env" class="btn"></select><div class="small" id="env-info"></div></section>
  <section><h2><span class="n">2</span><span id="h-engine"></span></h2><p class="lead" id="l-engine"></p>
    <div class="cards" id="engines"></div><div class="row" id="tracks"></div><div class="small" id="track-info"></div></section>
  <section><h2><span class="n">3</span><span id="h-driver"></span></h2><p class="lead" id="l-driver"></p>
    <div class="cards" id="drivers"></div></section>
  <section><h2><span class="n">4</span><span id="h-models"></span></h2><p class="lead" id="l-models"></p>
    <div class="row" id="model-buttons"></div><div id="models"></div></section>
  <section><h2><span class="n">5</span><span id="h-tasks"></span></h2><p class="lead" id="l-tasks"></p>
    <div class="row" id="presets"></div><div class="cards" id="tasks"></div></section>
</div>
<aside>
  <section><h2 id="h-time"></h2><div class="big" id="total"></div><div class="small" id="total-sub"></div>
    <div class="bar" id="bar"></div><div class="legend" id="legend"></div><div class="small" id="est-note"></div></section>
  <section><h2 id="h-head"></h2><div id="headlines"></div></section>
  <section><h2 id="h-cover"></h2><div class="matrix" id="matrix"></div></section>
  <section><h2 id="h-recipe"></h2><p class="lead" id="l-recipe"></p><pre id="recipe"></pre>
    <div class="row"><button class="btn pri" id="copy"></button><button class="btn" id="copy2"></button><span class="small" id="copied"></span></div>
    <div class="small" id="recipe-note"></div></section>
</aside>
</main>
<script>
const D = /*JBENCH_DATA*/null;
const TXT = {
  title: ['コンフィギュレータ', 'configurator', '配置器'],
  sub: ['測るものと条件を選ぶと、測れる指標と所要時間の目安が表示されます。最後にレシピをコピーして、エージェントに渡してください。',
        'Choose what to measure and how; the page shows which metrics that covers and about how long it takes. Then copy the recipe and hand it to your agent.',
        '选择测什么、怎么测，页面会显示覆盖的指标和大致耗时。最后复制配方交给智能体。'],
  env: ['環境', 'Environment', '环境'],
  lenv: ['所要時間の目安を出すためのハードウェアです。自分の PC に近いものを選びます。', 'The hardware the time estimate is for. Pick the one closest to your PC.', '用于估算耗时的硬件。请选择最接近你电脑的一项。'],
  local: ['この PC', 'this PC', '本机'],
  engine: ['エンジン', 'Engine', '引擎'],
  lengine: ['測る推論エンジンです。1 回の計測では 1 つのエンジンだけを測ります。', 'The inference engine to measure. One run measures one engine.', '要测量的推理引擎。一次测量只测一个引擎。'],
  managed: ['jbench が起動・停止し、設定の反映を確認', 'jbench starts and stops it and checks the settings', '由 jbench 启动、停止并核对设置'],
  attach: ['接続のみ（起動時の設定は検証できない）', 'attach only (the launch cannot be checked)', '仅连接（无法核对启动方式）'],
  track: ['設定の系統', 'Track', '设置类别'],
  texact: ['exact: 出力を変える近似をすべて無効にする（エンジン同士を比べるときの既定）', 'exact: every approximation that changes the output is off (the default for comparing engines)', 'exact：关闭所有会改变输出的近似（引擎间比较的默认）'],
  tdefault: ['default: エンジンの既定のまま', 'default: the engine as it comes', 'default：引擎默认设置'],
  tcustom: ['custom: 自分で起動したときの設定（申告された内容として記録）', 'custom: whatever you started (recorded as declared)', 'custom：自行启动的设置（按申报记录）'],
  driver: ['動かし方', 'Driver', '驱动方式'],
  ldriver: ['エンジンの API を直接呼ぶか、エージェントのハーネスに任せるかを選びます。両者の結果は混ぜません。', 'Call the engine\'s API directly, or hand the task to an agent harness. The results are never mixed.', '直接调用引擎 API，或交给智能体 harness。结果不混合。'],
  models: ['モデル', 'Models', '模型'],
  lmodels: ['測るモデルです。サイズと、この環境のメモリに収まるかの目安を添えています。', 'The models to measure, with their size and whether they fit this environment\'s memory.', '要测量的模型，附大小及是否适合该环境内存。'],
  all: ['すべて', 'All', '全选'], none: ['なし', 'None', '清空'],
  fit: {small: ['収まる', 'fits', '可容纳'], edge: ['ぎりぎり', 'tight', '临界'], large: ['SSD から読む', 'reads from SSD', '需读 SSD']},
  notfor: ['このエンジンでは動かない', 'not for this engine', '该引擎不支持'],
  one: ['接続のみのエンジンでは、読み込み済みのモデルを 1 つだけ選びます。', 'Attach only: pick the one model that is loaded.', '仅连接时只选择已加载的那一个模型。'],
  tasks: ['種目', 'Tasks', '项目'],
  ltasks: ['何を実行するかを選びます。カードを開くと、実際に送るプロンプトを読めます。', 'What to run. Open a card to read the prompt that is sent.', '运行什么。展开卡片可阅读实际发送的提示词。'],
  preset: ['プリセット', 'Preset', '预设'],
  prompt: ['送るプロンプトを見る', 'Show the prompt sent', '查看发送的提示词'],
  cut: ['（先頭のみ）', '(the start only)', '（仅开头）'],
  nocase: ['この選択ではケースがない（モデル・エンジンが対応していない）', 'no case for this selection (the models or the engine do not take it)', '当前选择下无用例（模型或引擎不支持）'],
  measured: ['{n} 環境に結果あり', 'results in {n} environment(s)', '{n} 个环境已有结果'],
  time: ['所要時間の目安', 'Estimated time', '预计耗时'],
  cases: ['{c} ケース · {r} リクエスト · {m} モデル · 起動 {l} 回', '{c} cases · {r} requests · {m} models · {l} engine starts', '{c} 个用例 · {r} 个请求 · {m} 个模型 · 启动 {l} 次'],
  starts: ['エンジンの起動', 'engine starts', '引擎启动'],
  estnote: ['この環境で最初に通して測った結果に合わせた係数から見積もっています（計測済みのケースの時間も含みます）。モデルの取得にかかる時間は含みません。',
            'Estimated from coefficients fitted to this environment\'s first full run (cases already measured are included). Downloading models is not included.',
            '根据该环境首次完整测量拟合的系数估算（含已测用例）。不含模型下载时间。'],
  disk: ['モデルのディスク使用量: 合計 {g} GB', 'Models on disk: {g} GB in all', '模型磁盘占用：共 {g} GB'],
  head: ['見出しの数字', 'Headline numbers', '头条数字'],
  add: ['「{t}」を追加すると得られる', 'add "{t}" to get it', '添加“{t}”即可获得'],
  cover: ['測れる指標', 'Metrics covered', '覆盖的指标'],
  recipe: ['レシピ', 'Recipe', '配方'],
  lrecipe: ['この選択を 1 つのテキストにしたものです。そのままエージェントに貼り付けてください。', 'This selection as one text. Paste it to your agent as it is.', '把当前选择写成一段文本，直接粘贴给智能体即可。'],
  copy: ['レシピをコピー', 'Copy the recipe', '复制配方'],
  copy2: ['依頼文と一緒にコピー', 'Copy with the request', '连同请求一起复制'],
  copied: ['コピーしました', 'Copied', '已复制'],
  ask: ['strata-jbench スキルの手順で、次のレシピを測ってください。始める前に、計画（ケース数と所要時間）と足りないものを見せてください。\n\n',
        'Following the strata-jbench skill, measure this recipe. Before starting, show me the plan (cases and time) and anything that is missing.\n\n',
        '请按 strata-jbench 技能的步骤测量以下配方。开始前请先展示计划（用例数与耗时）以及缺少的东西。\n\n'],
  rnote: ['id はエンジン・設定の系統・動かし方・種目とそのバージョンから作った hash で、モデルは含みません。id が同じ結果は、同じ物差しで測ったものです。',
          'The id is a hash of the engine, the track, the driver and the tasks with their versions; the models are not in it. Results with the same id used the same ruler.',
          'id 是由引擎、设置类别、驱动方式、项目及其版本生成的 hash，不含模型。相同 id 的结果使用同一把尺子。'],
  pick: ['モデルと種目を選んでください', 'Pick models and tasks', '请选择模型和项目'],
  h: ['時間', 'h', '小时'], min: ['分', 'min', '分钟'],
  more: ['説明を見る', 'Details', '查看说明'],
  gen: ['生成', 'generated', '生成于'], preview: ['確認用（この PC の環境と未公開の結果も含む）', 'preview (this PC\'s environments and unpublished results too)', '预览（含本机环境与未发布结果）'],
};
const LANGS = ['ja', 'en', 'zh'], LNAME = {ja: '日本語', en: 'English', zh: '中文'};
const S = {lang: 'ja', env: 0, engine: 'strata', track: 'exact', driver: 'plain', models: new Set(), tasks: new Map(), preset: null};
const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (v !== false && v != null) e.setAttribute(k, v); } for (const k of kids.flat()) e.append(k?.nodeType ? k : document.createTextNode(k ?? '')); return e; };
const t = (key, vars = {}) => { let s = (TXT[key] || [key, key, key])[LANGS.indexOf(S.lang)]; for (const [k, v] of Object.entries(vars)) s = s.replace('{' + k + '}', v); return s; };
const L = o => (o && (o[S.lang] || o.en || o.ja)) || '';
// `code` in the catalog's texts becomes <code>
const rich = text => String(text).split('`').map((part, i) => i % 2 ? el('code', {}, part) : part);
const COLORS = ['--c0', '--c1', '--c2', '--c3', '--c4', '--c5', '--c6', '--c7', '--c8', '--c9', '--c10'];
const taskColor = id => `var(${COLORS[D.tasks.findIndex(x => x.id === id) % COLORS.length]})`;
const env = () => D.envs[S.env];
const engine = () => D.engines.find(e => e.id === S.engine);
const division = () => D.divisions.find(d => d.id === S.driver);
const buildsOf = () => D.bases.flatMap(b => b.builds.map(x => ({...x, base: b})));
const key = b => b.family + ' ' + b.model;

// rows of the environment this engine and driver can be asked
function pool() {
  const e = engine();
  return env().rows.filter(r => r.d === S.driver && (e.managed ? r.e === e.id : r.a === 1));
}
function modelsHere() { return new Set(pool().map(r => r.f + ' ' + r.m)); }
function chosen() {
  return pool().filter(r => S.models.has(r.f + ' ' + r.m) && S.tasks.has(r.t) && (S.tasks.get(r.t) === 'all' || r.h.length));
}
function fmtTime(sec) {
  if (sec >= 3600) return (sec / 3600).toFixed(sec >= 36000 ? 0 : 1) + ' ' + t('h');
  return Math.max(1, Math.round(sec / 60)) + ' ' + t('min');
}

// --- the recipe and its id (the same canonical JSON and SHA-256 as scripts/recipe.py)
function pyJson(v) {
  if (v === null) return 'null';
  if (v === true) return 'true';
  if (v === false) return 'false';
  if (typeof v === 'number') return String(v);
  if (typeof v === 'string') return JSON.stringify(v);
  if (Array.isArray(v)) return '[' + v.map(pyJson).join(', ') + ']';
  return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ': ' + pyJson(v[k])).join(', ') + '}';
}
function sha256(str) {
  const K = [], H = [], isPrime = n => { for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; };
  for (let n = 2; K.length < 64; n++) if (isPrime(n)) { if (H.length < 8) H.push((Math.sqrt(n) * 2 ** 32) >>> 0); K.push((Math.cbrt(n) * 2 ** 32) >>> 0); }
  const bytes = Array.from(new TextEncoder().encode(str)), bits = bytes.length * 8;
  bytes.push(0x80); while (bytes.length % 64 !== 56) bytes.push(0);
  for (let i = 7; i >= 0; i--) bytes.push(i > 3 ? 0 : (bits >>> (i * 8)) & 255);
  const rr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let o = 0; o < bytes.length; o += 64) {
    const w = [];
    for (let i = 0; i < 64; i++) w[i] = i < 16 ? (bytes[o + 4 * i] << 24 | bytes[o + 4 * i + 1] << 16 | bytes[o + 4 * i + 2] << 8 | bytes[o + 4 * i + 3]) >>> 0
      : (w[i - 16] + (rr(w[i - 15], 7) ^ rr(w[i - 15], 18) ^ (w[i - 15] >>> 3)) + w[i - 7] + (rr(w[i - 2], 17) ^ rr(w[i - 2], 19) ^ (w[i - 2] >>> 10))) >>> 0;
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) >>> 0;
      const t2 = ((rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    [a, b, c, d, e, f, g, h].forEach((v, i) => { H[i] = (H[i] + v) >>> 0; });
  }
  return H.map(v => v.toString(16).padStart(8, '0')).join('');
}
function specs() {
  if (S.preset) return D.presets.find(p => p.id === S.preset).tasks;
  return D.tasks.filter(x => S.tasks.has(x.id)).map(x => ({task: x.id}));
}
function recipeText() {
  const versions = Object.fromEntries(D.tasks.map(x => [x.id, x.version || 1]));
  const sp = specs();
  const what = {v: 1, engine: S.engine, track: S.track, driver: S.driver, tasks: sp.map(s => ({...s, version: versions[s.task] || 1}))};
  const here = [...modelsHere()], picked = buildsOf().map(key).filter(k => S.models.has(k) && here.includes(k));
  const lines = ['jbench-recipe/1', `engine: ${S.engine} (track ${S.track})`, `driver: ${S.driver}`];
  lines.push(S.preset ? `preset: ${S.preset}` : 'tasks: ' + sp.map(s => s.task).join(', '));
  lines.push('models: ' + (picked.length === here.length && engine().managed ? 'all' : picked.join(', ')));
  lines.push('id: r1-' + sha256(pyJson(what)).slice(0, 8));
  return lines.join('\n');
}

// --- drawing
function seg(node, items, current, set) {
  node.replaceChildren(...items.map(([v, label]) => el('button', {class: v === current ? 'on' : '', onclick: () => { set(v); draw(); }}, label)));
}
function fixState() {
  const e = engine();
  if (!(S.track in e.tracks)) S.track = e.managed ? 'exact' : 'custom';
  if (!e.managed && S.track === 'exact') S.track = 'custom';
  if (S.driver !== 'plain' && S.engine !== 'strata') S.driver = 'plain';
  const here = modelsHere();
  for (const m of [...S.models]) if (!here.has(m)) S.models.delete(m);
  if (!e.managed && S.models.size > 1) S.models = new Set([[...S.models][0]]);
  const tasksHere = new Set(pool().map(r => r.t));
  for (const k of [...S.tasks.keys()]) if (!tasksHere.has(k)) { S.tasks.delete(k); S.preset = null; }
}
function setPreset(id) {
  const p = D.presets.find(x => x.id === id), have = new Set(pool().map(r => r.t));
  S.tasks = new Map(p.tasks.filter(x => have.has(x.task)).map(x => [x.task, x.headline_only ? 'headline' : 'all']));
  S.preset = p.tasks.every(x => have.has(x.task)) ? id : null;
}
function draw() {
  fixState();
  document.documentElement.lang = S.lang;
  $('t-title').textContent = t('title'); $('t-sub').textContent = t('sub'); $('t-meta').textContent = `${t('gen')} ${D.generated}` + (D.preview ? ' · ' + t('preview') : '');
  for (const [id, k] of [['h-env', 'env'], ['l-env', 'lenv'], ['h-engine', 'engine'], ['l-engine', 'lengine'], ['h-driver', 'driver'], ['l-driver', 'ldriver'],
    ['h-models', 'models'], ['l-models', 'lmodels'], ['h-tasks', 'tasks'], ['l-tasks', 'ltasks'], ['h-time', 'time'], ['h-head', 'head'], ['h-cover', 'cover'],
    ['h-recipe', 'recipe'], ['l-recipe', 'lrecipe'], ['copy', 'copy'], ['copy2', 'copy2'], ['recipe-note', 'rnote'], ['est-note', 'estnote']]) $(id).textContent = t(k);
  seg($('lang'), LANGS.map(l => [l, LNAME[l]]), S.lang, v => { S.lang = v; });
  const theme = document.documentElement.dataset.theme || '';
  seg($('theme'), [['', 'Auto'], ['light', 'Light'], ['dark', 'Dark']], theme, v => { if (v) document.documentElement.dataset.theme = v; else delete document.documentElement.dataset.theme; });

  // 1 environment
  $('env').replaceChildren(...D.envs.map((e, i) => el('option', {value: i, selected: i === S.env}, e.label + (e.local ? `  (${t('local')})` : ''))));
  const hw = env().hardware;
  $('env-info').textContent = `${env().id} · VRAM ${hw.gpu_vram_gib ?? '?'} GiB · RAM ${hw.ram_gib ?? '?'} GiB · drafters: ${(env().drafters || []).join(', ')}`;

  // 2 engine and track
  $('engines').replaceChildren(...D.engines.map(e => el('button', {class: 'card' + (e.id === S.engine ? ' on' : ''), onclick: () => { S.engine = e.id; draw(); }},
    el('div', {class: 't'}, e.label), el('p', {class: 'd'}, rich(L(e.about))),
    el('div', {class: 'tags'}, el('span', {class: 'tag ' + (e.managed ? 'g' : 'w')}, t(e.managed ? 'managed' : 'attach')),
      e.pin ? el('span', {class: 'tag'}, 'pin ' + e.pin.version) : ''))));
  $('tracks').replaceChildren(el('span', {class: 'small'}, t('track') + ':'), ...Object.keys(engine().tracks).filter(k => engine().managed || k === 'custom')
    .map(k => el('button', {class: 'btn' + (k === S.track ? ' on' : ''), onclick: () => { S.track = k; draw(); }}, k)));
  const ap = (engine().approximations || []).map(a => `${a.option}: exact = ${a.exact}; default = ${a.default}`).join(' / ');
  $('track-info').textContent = t('t' + S.track) + (ap ? '  —  ' + ap : '');

  // 3 driver
  $('drivers').replaceChildren(...D.divisions.filter(d => d.status === 'active').sort((a, b) => (a.harness ? 1 : 0) - (b.harness ? 1 : 0)).map(d => {
    const ok = d.id === 'plain' || S.engine === 'strata';
    return el('button', {class: 'card' + (d.id === S.driver ? ' on' : '') + (ok ? '' : ' off'), disabled: !ok, onclick: () => { S.driver = d.id; S.tasks.clear(); S.preset = null; draw(); }},
      el('div', {class: 't'}, L(d.label)),
      d.pin.version ? el('div', {class: 'tags'}, el('span', {class: 'tag'}, `${d.pin.name || d.harness} ${d.pin.version}`)) : '',
      el('details', {onclick: ev => ev.stopPropagation()}, el('summary', {}, t('more')), el('div', {class: 'small'}, rich(L(d.summary)))));
  }));

  // 4 models
  const here = modelsHere(), sizeClass = Object.fromEntries(pool().map(r => [r.f + ' ' + r.m, r.sc]));
  $('model-buttons').replaceChildren(
    el('button', {class: 'btn', onclick: () => { S.models = engine().managed ? new Set(here) : new Set([...here].slice(0, 1)); draw(); }}, t('all')),
    el('button', {class: 'btn', onclick: () => { S.models.clear(); draw(); }}, t('none')),
    el('span', {class: 'small'}, engine().managed ? '' : t('one')));
  const body = [];
  for (const b of D.bases) {
    body.push(el('tr', {class: 'base'}, el('td', {colspan: 4}, `${b.label}  ·  tokenizer ${b.tokenizer}${b.thinking ? '' : '  ·  thinking off only'}`)));
    for (const x of b.builds) {
      const k = key(x), ok = here.has(k);
      body.push(el('tr', {class: ok ? '' : 'dis'},
        el('td', {}, el('input', {type: engine().managed ? 'checkbox' : 'radio', name: 'm', id: 'm-' + k, checked: S.models.has(k), disabled: !ok,
          onchange: ev => { if (!engine().managed) S.models.clear(); if (ev.target.checked) S.models.add(k); else S.models.delete(k); draw(); }})),
        el('td', {}, el('label', {for: 'm-' + k}, `${x.family} ${x.display || x.model}`), el('span', {class: 'small'}, (D.i18n_roles?.[x.role]?.[S.lang]) || x.role)),
        el('td', {class: 'num'}, x.size_gb.toFixed(1) + ' GB'),
        el('td', {}, ok ? el('span', {class: 'tag ' + (sizeClass[k] === 'small' ? 'g' : 'w')}, (TXT.fit[sizeClass[k]] || ['?', '?', '?'])[LANGS.indexOf(S.lang)]) : el('span', {class: 'small'}, t('notfor')))));
    }
  }
  $('models').replaceChildren(el('div', {class: 'tablewrap'}, el('table', {class: 'models'}, body)));

  // 5 tasks
  const havePool = pool(), tasksHere = new Set(havePool.map(r => r.t));
  const mine = havePool.filter(r => S.models.has(r.f + ' ' + r.m));
  $('presets').replaceChildren(el('span', {class: 'small'}, t('preset') + ':'), ...D.presets.filter(p => p.tasks.some(x => tasksHere.has(x.task))).map(p =>
    el('button', {class: 'btn' + (S.preset === p.id ? ' on' : ''), title: L(p.about), onclick: () => { setPreset(p.id); draw(); }}, `${L(p.label)}`)),
    el('span', {class: 'small', style: 'flex-basis:100%'}, S.preset ? L(D.presets.find(p => p.id === S.preset).about) : ''));
  $('tasks').replaceChildren(...D.tasks.filter(x => tasksHere.has(x.id)).map(x => {
    const rows = mine.filter(r => r.t === x.id), on = S.tasks.has(x.id), fx = [...new Set(havePool.filter(r => r.t === x.id).map(r => r.fx))];
    const envsDone = D.envs.filter(e => e.rows.some(r => r.t === x.id && r.e === (engine().managed ? S.engine : 'strata') && r.done)).length;
    const p = fx.map(f => D.prompts[f] ? `── ${f}${D.prompts[f].tokens ? ` (${D.prompts[f].tokens} tokens)` : ''}\n${D.prompts[f].text}${D.prompts[f].cut ? ' … ' + t('cut') : ''}` : '').filter(Boolean).join('\n\n');
    return el('div', {class: 'card' + (on ? ' on' : ''), onclick: () => { if (on) S.tasks.delete(x.id); else S.tasks.set(x.id, 'all'); S.preset = null; draw(); }},
      el('div', {class: 't'}, el('span', {class: 'sw', style: `background:${taskColor(x.id)}`}), L(x.label)),
      el('p', {class: 'q'}, L(x.question)), el('p', {class: 'd'}, rich(L(x.sends))),
      el('div', {class: 'tags'}, el('span', {class: 'tag id'}, x.id), x.headline ? el('span', {class: 'tag g'}, x.headline) : '',
        S.models.size && !rows.length ? el('span', {class: 'tag w'}, t('nocase')) : '', envsDone ? el('span', {class: 'tag'}, t('measured', {n: envsDone})) : '',
        on && S.tasks.get(x.id) === 'headline' ? el('span', {class: 'tag w'}, x.headline + ' only') : ''),
      p ? el('details', {onclick: ev => ev.stopPropagation()}, el('summary', {}, t('prompt')), el('pre', {}, p)) : '');
  }));

  // summary
  const rows = chosen();
  const launches = new Map();
  for (const r of rows) launches.set(r.k, Math.max(launches.get(r.k) || 0, r.l));
  const launchS = [...launches.values()].reduce((a, b) => a + b, 0), reqS = rows.reduce((a, r) => a + r.est, 0), total = launchS + reqS;
  $('total').textContent = rows.length ? '≈ ' + fmtTime(total) : '—';
  const nModels = new Set(rows.map(r => r.f + ' ' + r.m)).size;
  $('total-sub').textContent = rows.length ? t('cases', {c: rows.length, r: rows.reduce((a, r) => a + r.rq, 0), m: nModels, l: launches.size}) : t('pick');
  const parts = D.tasks.map(x => [x, rows.filter(r => r.t === x.id).reduce((a, r) => a + r.est, 0)]).filter(([, s]) => s > 0);
  $('bar').replaceChildren(...parts.map(([x, s]) => el('i', {style: `width:${100 * s / total}%;background:${taskColor(x.id)}`, title: L(x.label)})),
    launchS ? el('i', {style: `width:${100 * launchS / total}%;background:var(--launch)`, title: t('starts')}) : '');
  const size = buildsOf().filter(b => S.models.has(key(b)) && here.has(key(b))).reduce((a, b) => a + b.size_gb, 0);
  $('legend').replaceChildren(...parts.map(([x, s]) => el('div', {}, el('span', {class: 'sw', style: `background:${taskColor(x.id)}`}), L(x.label), el('span', {class: 'v'}, fmtTime(s)))),
    launchS ? el('div', {}, el('span', {class: 'sw', style: 'background:var(--launch)'}), t('starts'), el('span', {class: 'v'}, fmtTime(launchS))) : '',
    size ? el('div', {class: 'disk'}, t('disk', {g: size.toFixed(0)})) : '');

  // headline numbers
  const got = new Set(rows.flatMap(r => r.h));
  $('headlines').replaceChildren(...D.headlines.filter(h => tasksHere.has(h.task)).map(h => {
    const task = D.tasks.find(x => x.id === h.task);
    return el('div', {class: 'hl' + (got.has(h.id) ? ' on' : '')}, el('span', {class: 'dot'}),
      el('div', {}, el('div', {class: 'name'}, el('code', {}, h.id), L(h.label)), el('div', {class: 'small'}, got.has(h.id) ? L(h.definition) : t('add', {t: L(task.label)}))));
  }));

  // metrics covered
  const sel = D.tasks.filter(x => S.tasks.has(x.id) && rows.some(r => r.t === x.id));
  if (!sel.length) $('matrix').replaceChildren(el('div', {class: 'empty'}, t('pick')));
  else {
    const covered = D.metrics.filter(m => sel.some(x => x.metrics.includes(m.id)));
    $('matrix').replaceChildren(el('table', {},
      el('tr', {}, el('th', {}, ''), ...sel.map(x => el('th', {class: 'c', title: L(x.label)}, el('i', {style: `background:${taskColor(x.id)}`})))),
      ...covered.map(m => el('tr', {title: L(m.definition)}, el('td', {}, L(m.label), el('span', {class: 'small'}, ` ${m.unit}`)),
        ...sel.map(x => el('td', {class: 'c'}, el('i', {class: x.metrics.includes(m.id) ? 'on' : '', style: x.metrics.includes(m.id) ? `background:${taskColor(x.id)}` : ''})))))),
      el('div', {class: 'keys'}, ...sel.map(x => el('span', {}, el('i', {style: `background:${taskColor(x.id)}`}), L(x.label)))));
  }

  // recipe
  const ready = rows.length > 0;
  $('recipe').textContent = ready ? recipeText() : t('pick');
  $('copy').disabled = $('copy2').disabled = !ready;
}
function copy(text) {
  const done = () => { $('copied').textContent = t('copied'); setTimeout(() => { $('copied').textContent = ''; }, 2000); };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done, () => fallback());
  else fallback();
  function fallback() { const ta = el('textarea', {}); ta.value = text; document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove(); done(); }
}
$('env').addEventListener('change', ev => { S.env = Number(ev.target.value); draw(); });
$('copy').addEventListener('click', () => copy(recipeText()));
$('copy2').addEventListener('click', () => copy(t('ask') + '```\n' + recipeText() + '\n```\n'));

// start: the language of the browser, this PC's environment (or #env=<id>), the reference-sized default selection
const nav = (navigator.language || 'ja').slice(0, 2); S.lang = LANGS.includes(nav) ? nav : 'en';
const q = new URLSearchParams(location.hash.slice(1));
if (q.get('lang') && LANGS.includes(q.get('lang'))) S.lang = q.get('lang');
S.env = Math.max(0, D.envs.findIndex(e => q.get('env') ? e.id === q.get('env') : e.local));
if (q.get('engine') && D.engines.some(e => e.id === q.get('engine'))) S.engine = q.get('engine');
const pickRef = () => { const here = modelsHere(); S.models = new Set(env().ref && here.has(env().ref) ? [env().ref] : [...here].slice(0, 1)); };
pickRef();
setPreset('standard');
draw();
</script>
